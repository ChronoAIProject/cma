[workspace]
resolver = "2"
members = [
    "crates/layer1-public",
    "crates/layer2-core",
    "crates/layer3-adapter",
    "crates/layer4-runtime",
    "crates/cma",
    "crates/cma-am-auth",
    "crates/cma-am-mongo-primitives",
    "crates/cma-am-reporting",
    "crates/cma-qualification",
    "crates/cmaeg-core",
    "crates/cmaeg-engine",
    "crates/cmaeg-execution",
    "crates/cmaeg-http",
    "crates/cmaeg",
    "crates/cma-image-manager",
    "crates/cma-service-auth",
    "crates/cma-service-migrations",
    "crates/cma-allocator-qualification",
    "crates/cma-journey-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
# The Agent Client Protocol's published schema. Layer 3 *is* ACP, so its types
# are taken from the protocol's own crate rather than mirrored by hand — a
# hand-written copy drifts from the specification the first time it moves.
#
# The schema crate rather than the full `agent-client-protocol`: that one
# carries a JSON-RPC runtime on a second async executor and a process-spawning
# stdio transport, none of which fits a conversation that rides the
# supervisor's WebSocket. Both clear `cargo deny`; this one costs less.
agent-client-protocol-schema = { version = "1.5", features = [
    # Per-turn token counts. Marked unstable by the protocol because the field
    # is not in the specification yet, and enabled anyway because it is what a
    # runtime actually sends: the codex bridge carries it on every prompt
    # response, and get_usage exists to report exactly these numbers. Reading
    # them from `_meta` instead would be the same coupling with none of the
    # typing, and inventing our own would be a third spelling of a field that
    # already has two.
    "unstable_end_turn_token_usage",
] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
h2 = "0.4.19"
http-body-util = "0.1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"
flate2 = "1"
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
httpdate = "1"
# Pure-Rust decoding and re-encoding for inbound images. Only the four
# formats the gateway normalizes are compiled in; everything else is refused
# before decode.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Magic-byte content sniffing for fetched media: the sniffed type always wins
# over a sender's declared MIME type or file name, and a maintained matcher
# table is preferred over a hand-rolled one.
infer = "0.19"
ipnet = "2.12"
# Test-only: a progressive JPEG encoder, which `image` lacks, for the decode
# bound fixtures.
jpeg-encoder = "0.6"
k8s-openapi = { version = "0.28", features = ["earliest"] }
kube = { version = "4.2.1", default-features = false, features = [
    "client",
    "ring",
    "rustls-tls",
    "ws",
] }
libc = "0.2"
rusqlite = { version = "=0.41.1", default-features = false, features = ["libsqlite3-sys", "bundled", "limits"] }
# CMAEG's bounded metrics facade and pull-format renderer; the service owns its
# private Axum listener, so the exporter's extra servers and push client stay off.
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Keep service Rust allocations independent of the build toolchain's libc allocator.
mimalloc = "0.1.52"
# Byte-weighted, time-bounded cache for derived media; only the synchronous
# cache is needed, so the async runtime integration stays off.
moka = { version = "0.12", default-features = false, features = ["sync"] }
mongodb = { version = "3", default-features = false, features = [
    "bson-3",
    "compat-3-3-0",
    "rustls-tls",
    # Required to accept a mongodb+srv:// URI, which resolves its host list over
    # DNS rather than naming servers directly. Hosted deployments hand out that
    # form, and without this the driver rejects the connection string outright
    # at startup — a failure that only appears against a real cluster, since a
    # direct mongodb:// URI needs no resolver.
    "dns-resolver",
] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    # CMAEG talks to cleartext Kubernetes `.svc` providers with HTTP/2 prior
    # knowledge; reqwest's HTTP/2 feature is required for that transport.
    "http2",
    "rustls-tls",
    "stream",
] }
ring = "0.17.14"
# The CMAEG media job's seccomp filters (Apache-2.0 OR BSD-3-Clause), compiled
# from typed rules into the BPF program the job installs before executing FFmpeg.
seccompiler = "0.5"
base64 = "0.22"
dashmap = "6"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
serde_json = "1"
similar = "2.7"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "process",
] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bridges `log` records (reqwest logs through `log`) into tracing, as the
# gateway's own logger does, so leak tests see every HTTP client record.
tracing-log = "0.2"
unicode-normalization = "0.1"
url = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# This maintained Utoipa fork replaces the archived `paste` macro dependency
# that cargo-deny rejects while preserving the handler-derived Axum integration.
utoipa = { package = "meteroid-utoipa", version = "5.6", features = ["axum_extras"] }
utoipa-axum = { package = "meteroid-utoipa-axum", version = "0.2" }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
vt100 = "0.15"
zeroize = "1.9.0"

layer2-core = { path = "crates/layer2-core" }
layer3-adapter = { path = "crates/layer3-adapter" }
layer1-public = { path = "crates/layer1-public" }

# Debug codecs are 10-50x slower; the test-enforced decode wall time and
# realistic fixtures need release-grade codecs. The test profile inherits these
# overrides; release builds are unaffected.
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.bytemuck]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.pxfm]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
