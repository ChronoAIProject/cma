[package]
name = "cma-am-auth"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = ["tokio/test-util", "tracing-subscriber/json"]

[dependencies]
cma-service-auth = { path = "../cma-service-auth" }
base64 = { workspace = true }
bson = "3"
futures-util = { workspace = true }
http-body = { workspace = true }
layer1-public = { workspace = true }
ring = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
cmaeg-core = { path = "../cmaeg-core" }
axum = { workspace = true }
httpdate = { workspace = true }
layer2-core = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
layer1-public = { workspace = true, features = ["test-support"] }
layer2-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["io-std", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { workspace = true, features = ["json"] }
metrics-exporter-prometheus = { workspace = true }
