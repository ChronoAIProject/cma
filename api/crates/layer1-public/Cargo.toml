[package]
name = "layer1-public"
version.workspace = true
edition.workspace = true
publish = false

[features]
qualification-hooks = ["layer2-core/qualification-hooks"]
# Enables deterministic public-boundary synchronization used only by CMA's
# composed WebSocket tests. It is absent from ordinary and release builds.
test-support = []

[dependencies]
metrics = { workspace = true }
# For the terminal plane's raw input, which arrives base64-encoded because a
# JSON string cannot carry an arbitrary control sequence.
base64 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
layer2-core = { workspace = true }
# Parses JSON media types for the profile extractor that inspects one buffered
# body twice: once structurally for a safe field path and once through Serde's
# authoritative request type.
mime = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Serializes continuation links with the same form encoding axum accepts.
serde_urlencoded = "0.7"
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
# Builds public Trigger and badge URLs without hand-joining path or query text.
url = { workspace = true }
# For its CSPRNG-backed v4 generator, which is what an attach ticket is drawn
# from. Already a workspace dependency.
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["json"] }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
layer2-core = { workspace = true, features = ["test-support"] }
# Route contract tests compose an isolated adapter; production still depends only on core.
layer3-adapter = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Applies the projection's patches with an independent RFC 6902 implementation,
# so the canonical starting document is a proven wire contract rather than an
# example that only this crate understands.
json-patch = { version = "4.2", default-features = false }
# Drives the actual router in path-precedence tests.
tower = { version = "0.5", features = ["util"] }
