[package]
name = "cma"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
governor = { workspace = true }
ipnet = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
layer1-public = { workspace = true }
layer2-core = { workspace = true }
layer3-adapter = { workspace = true }
mongodb = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# For its CSPRNG-backed v4 generator, which is what session cookies, OAuth
# state and PKCE verifiers are drawn from. Already a workspace dependency.
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Drives the composed REST router in public error-contract tests.
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
