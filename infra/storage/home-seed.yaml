# Operator initialization before enabling CHRONO_SANDBOX_HOME_*.
# The seed contains only the pinned image's public home files and empty journals.
# Create home-template.yaml after this Pod succeeds; pin the ready snapshot UID
# in the API ConfigMap. Then remove the completed seed Pod and its source PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cma-home-v1
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-balanced
  csi.storage.k8s.io/fstype: xfs
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: cma-home-v1
driver: pd.csi.storage.gke.io
deletionPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cma-home-seed-v1
  namespace: chrono-bot
spec:
  accessModes: [ReadWriteOncePod]
  storageClassName: cma-home-v1
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: cma-home-seed-v1
  namespace: chrono-bot
  labels:
    app.kubernetes.io/part-of: cma
    cma/purpose: home-seed
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 600
  runtimeClassName: gvisor
  nodeSelector:
    sandbox.gke.io/runtime: gvisor
  tolerations:
    - key: sandbox.gke.io/runtime
      operator: Equal
      value: gvisor
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: seed
      image: us-central1-docker.pkg.dev/example-project-01/example-registry-02/cma-runtime@sha256:9e0281826070abd4e3b65e053737f12184d1adbc08cb8d9582d933069ce1a983
      command: [sh, -eu, -c]
      args:
        - |
          test ! -e /seed/home
          test ! -e /seed/state
          test ! -e /seed/transfer
          mkdir -m 0700 /seed/home /seed/state /seed/transfer
          cp -a /home/cma/. /seed/home/
          test -s /seed/home/.codex/skills/nyxid/SKILL.md
          test -s /seed/home/.codex/skills/ornn-agent-manual-cli/SKILL.md
          test ! -e /seed/home/.codex/auth.json
          test ! -e /seed/home/.nyxid/access_token
          test -z "$(ls -A /seed/state)"
          test -z "$(ls -A /seed/transfer)"
          sync
          echo 'CMA home seed format 1 initialized from the credential-free runtime image'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi
      volumeMounts:
        - name: seed
          mountPath: /seed
  volumes:
    - name: seed
      persistentVolumeClaim:
        claimName: cma-home-seed-v1
