apiVersion: v1
kind: Service
metadata:
  name: cmaeg
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cmaeg
    app.kubernetes.io/part-of: cma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cmaeg
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
# Metrics remain on the pod's private port 9091, outside the public Service.
