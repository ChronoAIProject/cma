# WS5, lead instruction 2026-11-15 17:23 SGT: apply with S2 EG=2.
# EG retains the #2065 CPU and scaling policy; the production ceiling is four.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cma-event-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 500m CPU: provisional idle margin above the observed 396m peak.
          # Keep the production 250m request for matched N=1/N=2 comparisons.
          averageUtilization: 200
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
