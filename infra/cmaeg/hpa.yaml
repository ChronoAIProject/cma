# Apply only in S3 after both ownership and capacity gates pass.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cma-event-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 500m CPU: provisional idle margin above the observed 396m peak.
          # Keep the production 250m request for matched N=1/N=2 comparisons.
          averageUtilization: 200
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
