apiVersion: v1
kind: ConfigMap
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
data:
  # Desired activation state: deploy compatible readers with prior values first,
  # wait for predecessor Pods to drain, then apply these native messaging gates.
  CMAEG_MULTI_CONSUMER_WRITES_ENABLED: "true"
  # Explicit record IDs only. Empty preserves all existing ingress paths.
  CMAEG_ROUTED_CHANNEL_RECORDS: ""
  # Keep recovery and selected records after stopping admission, until retained work expires.
  CMAEG_ROUTED_RECOVERY_ENABLED: "true"
  CMAEG_ROUTED_ADMISSION_ENABLED: "true"
  CMAEG_DYNAMIC_SOURCES_WRITES_ENABLED: "true"
  # Compatible readers are deployed; each delivery still requires owner commit.
  CMAEG_OUTBOUND_MESSAGES_WRITES_ENABLED: "true"
  # Source opt-ins remain explicit; activate after serving and rollback readers are compatible.
  CMAEG_LARK_RESOURCE_WRITES_ENABLED: "true"
  # Separate exact-message write authority, after compatible reader rollout.
  CMAEG_LARK_MESSAGE_EFFECTS_WRITES_ENABLED: "true"
  CMAEG_RELAY_RAW_VERIFICATION_WRITES_ENABLED: "true"
  # Upgrade retained message-context readers before accepting owner opt-ins.
  CMAEG_NATIVE_TELEGRAM_MESSAGE_EVENTS_WRITES_ENABLED: "true"
  # Compatible native app readers deployed for owner testing; connected acceptance remains unverified.
  CMAEG_NATIVE_LARK_WRITES_ENABLED: "true"
  CMAEG_NATIVE_LARK_INTAKE_ENABLED: "true"
  # Compatible retained readers support native resource locators; owner app setup remains explicit.
  CMAEG_NATIVE_LARK_MEDIA_ENABLED: "true"
  # Compatible #1158 readers and shared Custom acceptance verified; native owner testing is enabled.
  CMAEG_NATIVE_LARK_OUTBOUND_MEDIA_ENABLED: "true"
  # Native single-attachment Telegram edits are enabled after compatible reader rollout.
  CMAEG_NATIVE_TELEGRAM_MEDIA_EDITS_ENABLED: "true"
  # Native single-attachment Discord edits are enabled after compatible reader rollout.
  CMAEG_NATIVE_DISCORD_MEDIA_EDITS_ENABLED: "true"
  # Enable only after every retained card reader accepts native media controls.
  CMAEG_NATIVE_DISCORD_MEDIA_CONTROLS_ENABLED: "false"
  # Requires separately migrated persistent fence storage and runtime grants.
  CMAEG_NATIVE_TELEGRAM_TOPIC_LIFECYCLE_ENABLED: "false"
  CMAEG_NATIVE_DISCORD_THREAD_LIFECYCLE_ENABLED: "false"
  # Bounded original Discord history is enabled; source consent remains required.
  CMAEG_NATIVE_DISCORD_CONVERSATION_HISTORY_ENABLED: "true"
  # Bounded original Lark/Feishu history is enabled; source consent remains required.
  CMAEG_NATIVE_LARK_CONVERSATION_HISTORY_ENABLED: "true"
  CMAEG_NATIVE_LARK_MIXED_HISTORY_ENABLED: "false"
  # Native Lark/Feishu cards, buttons and choices are enabled for opted-in sources.
  CMAEG_NATIVE_LARK_CONTROLS_ENABLED: "true"
  # Native Lark/Feishu forms require the native controls gate and source consent.
  CMAEG_NATIVE_LARK_FORMS_ENABLED: "true"
  CMAEG_NATIVE_LARK_MESSAGE_EFFECTS_ENABLED: "true"
  CMAEG_NATIVE_LARK_RECEIVED_REACTIONS_ENABLED: "true"
  # Compatible readers and Custom acceptance verified; enable owner Meta setup/testing.
  CMAEG_NATIVE_WHATSAPP_WRITES_ENABLED: "true"
  CMAEG_NATIVE_WHATSAPP_MEDIA_ENABLED: "true"
  # Compatible serving and rollback readers permit private native controls for owner testing.
  CMAEG_NATIVE_WHATSAPP_INTERACTIONS_ENABLED: "true"
  # Independent native image/document/audio/sticker/video reply uploads; live Meta acceptance remains unverified.
  CMAEG_NATIVE_WHATSAPP_OUTBOUND_MEDIA_ENABLED: "true"
  # Native WhatsApp received reactions enabled after compatible reader rollout.
  CMAEG_NATIVE_WHATSAPP_REACTIONS_ENABLED: "true"
  # Exact received-message reaction scopes enabled after compatible #1158 reader rollout.
  CMAEG_NATIVE_TELEGRAM_RECEIVED_REACTIONS_ENABLED: "true"
  CMAEG_NATIVE_DISCORD_RECEIVED_REACTIONS_ENABLED: "true"
  # Approved-template native replies enabled for owner testing; connected Meta acceptance remains unverified.
  CMAEG_NATIVE_WHATSAPP_TEMPLATES_ENABLED: "true"
  # Existing-group owner opt-ins and intake/sends enabled after separate compatible-reader rollout.
  # Coexistence incoming edits/revokes use existing interaction storage and proof.
  CMAEG_NATIVE_WHATSAPP_MESSAGE_EVENTS_ENABLED: "true"
  # Reader-first bounded native context snapshots; deploy all readers before activation.
  CMAEG_NATIVE_QUOTED_CONTEXT_ENABLED: "false"
  CMAEG_NATIVE_WHATSAPP_FORMS_ENABLED: "false"
  CMAEG_NATIVE_WHATSAPP_FLOW_WRITES_ENABLED: "false"
  CMAEG_NATIVE_WHATSAPP_GROUPS_WRITES_ENABLED: "true"
  CMAEG_NATIVE_WHATSAPP_GROUPS_ENABLED: "true"
  # Only explicitly authored native sources are discovered; existing relay sources stay unchanged.
  CMAEG_NATIVE_DISCORD_WRITES_ENABLED: "true"
  CMAEG_NATIVE_DISCORD_ENABLED: "true"
  # Discover explicit native Discord sources without editing record canary lists.
  CMAEG_NATIVE_DISCORD_DISCOVERY_ENABLED: "true"
  CMAEG_DISCORD_INTERACTIONS_ENABLED: "true"
  # Retained message-event readers deployed; native platform acceptance remains owner-led.
  # Owner-selected reaction intents and durable confirmed outbound target receipts.
  CMAEG_DISCORD_REACTIONS_ENABLED: "true"
  CMAEG_DISCORD_MESSAGE_EVENTS_ENABLED: "true"
  CMAEG_DISCORD_FORMS_ENABLED: "true"
  # Upgrade all card-edit readers before starting native replacement chains.
  CMAEG_DISCORD_CARD_EDITS_ENABLED: "true"
  CMAEG_DISCORD_CARD_EFFECTS_ENABLED: "true"
  # Enable new multi-select cards only after every serving and rollback reader is compatible.
  CMAEG_DISCORD_MULTISELECT_ENABLED: "true"
  # Deploy form authority/submission readers before issuing native Lark/Feishu forms.
  CMAEG_LARK_FORMS_ENABLED: "true"
  # Explicit canonical channel record IDs; selected records also require durable routed recovery.
  CMAEG_NATIVE_DISCORD_CHANNEL_RECORDS: ""
  CMAEG_THREAD_CONTRACT_WRITES_ENABLED: "true"
  CMAEG_NATIVE_BOT_MENTIONS_WRITES_ENABLED: "true"
  CMAEG_MONGODB_DATABASE: "chrono-bot"
  CMAEG_MONGODB_AUTHORITY_MODE: "shared-schema"
  CMAEG_LISTEN: "0.0.0.0:8090"
  CMAEG_METRICS_LISTEN: "0.0.0.0:9091"
  CMAEG_PUBLIC_URL: "https://bot-gateway.chrono-ai.fun"
  CMAEG_PUBLIC_API_URL: "https://bot.chrono-ai.fun/event-gateway"
  # First upgrade uses a reviewed temporary false override until all old Pods drain.
  CMAEG_ADVERTISE_PUBLIC_API_URL: "true"
  # Existing Nyx ChannelPointers and sealed records bind this exact authority.
  # The cma-api Service aliases canonical Agent Manager Pods without rewriting
  # those identities. Provider dispatch below uses the canonical Service DNS.
  CMAEG_CMA_BASE_URL: "http://example-host-01.example-namespace.svc"
  CMAEG_NYXID_BASE_URL: "https://nyx-api.chrono-ai.fun"
  CMAEG_TOOLS_NYXID_SLUG: "cmaeg"
  # Native inbox dispatch uses the CMA Responses v2 durable GET replay contract.
  # Do not add this to nyxbot: its deployed API has no verified durable GET replay.
  # Recovery reads do not enable the durable dispatcher or retry a turn POST.
  CMAEG_PROVIDERS: >-
    [{"slug":"cma_codex","base_url":"http://example-host-01.example-namespace.svc","kind":"responses_http","paths":{"agent_card":"/.well-known/agent-card.json","binding":"/api/v1/cmaeg/bindings/{binding_id}","conversation":"/api/v1/cmaeg/bindings/{binding_id}/conversations/{conversation_id}","responses":"/api/v2/responses","recovery":{"response":"/api/v2/responses/{response_id}","events":"/api/v2/responses/{response_id}/events"}},"max_inflight":256},{"slug":"nyxbot","base_url":"https://nyx-api.chrono-ai.fun","kind":"responses_http","paths":{"agent_card":"/api/v1/nyxbot/agent-card","binding":"/api/v1/nyxbot/bindings/{binding_id}","conversation":"/api/v1/nyxbot/bindings/{binding_id}/conversations/{conversation_id}","responses":"/api/v1/nyxbot/responses"},"max_inflight":256}]
  CMAEG_MEDIA_TOOL_PROVIDERS: "cma_codex"
  CMAEG_NON_HUMAN_PROVIDERS: "cma_codex"
  CMAEG_MEDIA_ENABLED: "true"
  CMAEG_MEDIA_MAX_BYTES: "20971520"
  CMAEG_MEDIA_INFLIGHT_BYTES: "67108864"
  CMAEG_MEDIA_RESPONSE_BYTES: "25165824"
  CMAEG_MEDIA_MAX_JOBS: "6"
  CMAEG_MEDIA_CACHE_BYTES: "33554432"
  CMAEG_MEDIA_RATE_PER_MINUTE: "60"
  CMAEG_MEDIA_DOWNLOAD_BYTES_PER_HOUR: "268435456"
  CMAEG_MEDIA_LINK_TTL_SECONDS: "120"
  CMAEG_MEDIA_PREPARE_BUDGET_MS: "15000"
  CMAEG_MEDIA_FFMPEG_DIR: ""
  CMAEG_MEDIA_VIDEO_FRAMES: "6"
  CMAEG_STT_MAX_SECONDS: "600"
  CMAEG_STT_MAX_BYTES: "20971520"
  CMAEG_STT_RATE_PER_MINUTE: "20"
  CMAEG_STT_CHANNEL_SECONDS_PER_HOUR: "3600"
  CMAEG_STT_SECONDS_PER_HOUR: "36000"
  CMAEG_STT_EAGER_MAX_SECONDS: "300"
  CMAEG_STT_URL: ""
  CMAEG_STT_MODEL: "gpt-transcribe"
  CMAEG_STT_FORMATS: "mp3,mp4,mpeg,mpga,m4a,wav,webm"
  CMAEG_STT_TIMEOUT_MS: "30000"
  CMAEG_PROVIDER_CONNECT_TIMEOUT_MS: "2000"
  CMAEG_PROVIDER_REQUEST_TIMEOUT_MS: "30000"
  CMAEG_PROVIDER_MAX_INFLIGHT: "256"
  CMAEG_CHANNEL_CACHE_TTL_MS: "60000"
  CMAEG_CHANNEL_NEGATIVE_TTL_MS: "10000"
  CMAEG_CHANNEL_CACHE_MAX: "50000"
  CMAEG_RESTORE_RATE_PER_MINUTE: "10"
  CMAEG_RESTORE_TIMEOUT_MS: "800"
  CMAEG_JWKS_TTL_MS: "600000"
  CMAEG_INGRESS_MAX_BODY: "1048576"
  CMAEG_INGRESS_INFLIGHT: "256"
  CMAEG_ACCEPT_BUDGET_MS: "20000"
  CMAEG_TURN_TIMEOUT_MS: "600000"
  CMAEG_NYXID_REPLY_TIMEOUT_MS: "5000"
  # Keep complete replies off until retained runtime proxy compatibility is verified.
  # Complete ordinary exchanges: 15 s; non-routed tool wait: 18 s. Routed window stays 20 s.
  CMAEG_NYXID_COMPLETE_REPLIES: "false"
  CMAEG_NYXID_NATIVE_MEDIA_ENABLED: "true"
  # Enable only after all gateway replicas can read enriched relay message references.
  CMAEG_RELAY_TEXT_EDITS_ENABLED: "true"
  # Issue native Discord edit references only after every gateway reader is upgraded.
  CMAEG_NATIVE_DISCORD_EDITS_ENABLED: "true"
  CMAEG_NATIVE_DISCORD_MESSAGE_EFFECTS_ENABLED: "true"
  # Reader-first: effects-only media references require every retained reader.
  CMAEG_NATIVE_DISCORD_MEDIA_EFFECTS_ENABLED: "true"
  # Persist verified native thread metadata only after compatible readers are deployed.
  # Explicit bounded history reads still require source consent and an exact original thread.
  CMAEG_NATIVE_DISCORD_THREAD_HISTORY_ENABLED: "true"
  CMAEG_NATIVE_DISCORD_THREAD_METADATA_ENABLED: "true"
  # Enable new Lark/Feishu cards only after every interaction reader is upgraded.
  CMAEG_LARK_CARDS_ENABLED: "true"
  # Enable only after typed WhatsApp template replies are verified against NyxID.
  CMAEG_WHATSAPP_TEMPLATES_ENABLED: "true"
  # Reader-first rollout for actor-bound WhatsApp buttons and lists.
  CMAEG_WHATSAPP_INTERACTIONS_ENABLED: "true"
  # Enable named-card issuance only after all callback readers are upgraded.
  CMAEG_CONSUMER_INTERACTIONS_ENABLED: "true"
  CMAEG_ACK_TEXT: "Working on it…"
  CMAEG_HEARTBEAT_MS: "60000"
  CMAEG_FAILURE_TEXT: "Sorry, I couldn’t finish that request. Please try again."
  CMAEG_DRAIN_SECONDS: "600"
  CMAEG_BUSY_RETRY_MAX_MS: "180000"
  CMAEG_CONSOLE_ENABLED: "true"
  CMAEG_CONSOLE_CLIENT_ID: "85619590-ec86-40bb-a96b-657bb89b4aa8"
  CMAEG_CONSOLE_LOGIN_RATE_PER_MINUTE: "60"
  CMAEG_CONSOLE_SESSION_TTL_MS: "28800000"
  CMAEG_CONSOLE_SESSION_IDLE_MS: "1800000"
  CMAEG_CONSOLE_SESSIONS_MAX: "1000"
  CMAEG_CONSOLE_SESSIONS_PER_SUBJECT: "5"
  CMAEG_CONSOLE_INDEX_MAX_RECORDS: "100000"
  CMAEG_CONSOLE_INDEX_RESYNC_MS: "600000"
  CMAEG_CONSOLE_SUMMARY_CACHE_MAX: "2000"
  CMAEG_CONSOLE_CHANNEL_IDS_MAX: "20000"
  CMAEG_CONSOLE_ACTIVITY_PER_CHANNEL: "100"
  CMAEG_CONSOLE_ACTIVITY_MAX_BYTES: "33554432"
  CMAEG_CONSOLE_PRODUCERS_PER_CHANNEL: "32"

  # Issue new native Telegram effect references only after every reader is upgraded.
  CMAEG_TELEGRAM_MESSAGE_EFFECTS_ENABLED: "true"
  # Reader-first effects-only authority for one confirmed native upload message.
  CMAEG_TELEGRAM_MEDIA_EFFECTS_ENABLED: "true"
