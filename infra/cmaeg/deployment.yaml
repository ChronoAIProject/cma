apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  # Captured live annotations retain earlier builds after image-only rollouts.
  # The container digest below identifies the running artifact.
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "4c61e77e6efbe4e02c6769a378c9e13794f1a14c"
    cma.chronoai.dev/ci-accepted-attempt: "1"
    cma.chronoai.dev/ci-archive-sha256: "sha256:ade9d5e12b1c972581657493ab93556cc0e3bee2de0fc543c0ec6c6a620dd979"
    cma.chronoai.dev/ci-artifact: "13425821517"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "4c61e77e6efbe4e02c6769a378c9e13794f1a14c"
    cma.chronoai.dev/ci-publication-sha256: "sha256:99cf0eb3ed7a7ad9b6b6b6767e7be939919d7e1b4b746ba7e5b1215cf3911188"
    cma.chronoai.dev/ci-run: "42043986725"
    cma.chronoai.dev/cmaeg-image-digest: "sha256:60971f2bffaa1b1337716cb0dbbf28984e6cc9bcf5db80969273377c1a60e3a9"
    cma.chronoai.dev/domain-migration-stage: "console-oauth-origin"
    cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
    cma.chronoai.dev/image-digest: "sha256:60971f2bffaa1b1337716cb0dbbf28984e6cc9bcf5db80969273377c1a60e3a9"
    cma.chronoai.dev/image-source: "4c61e77e6efbe4e02c6769a378c9e13794f1a14c"
    cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
    cma.chronoai.dev/source-tree: "f6bf104c2ebadc7f3a722b5cd86b8181bf2da686"
spec:
  replicas: 1
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "4c61e77e6efbe4e02c6769a378c9e13794f1a14c"
        cma.chronoai.dev/ci-accepted-attempt: "1"
        cma.chronoai.dev/ci-archive-sha256: "sha256:ade9d5e12b1c972581657493ab93556cc0e3bee2de0fc543c0ec6c6a620dd979"
        cma.chronoai.dev/ci-artifact: "13425821517"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "4c61e77e6efbe4e02c6769a378c9e13794f1a14c"
        cma.chronoai.dev/ci-publication-sha256: "sha256:99cf0eb3ed7a7ad9b6b6b6767e7be939919d7e1b4b746ba7e5b1215cf3911188"
        cma.chronoai.dev/ci-run: "42043986725"
        cma.chronoai.dev/cmaeg-image-digest: "sha256:60971f2bffaa1b1337716cb0dbbf28984e6cc9bcf5db80969273377c1a60e3a9"
        cma.chronoai.dev/domain-migration-stage: "console-oauth-origin"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/image-digest: "sha256:60971f2bffaa1b1337716cb0dbbf28984e6cc9bcf5db80969273377c1a60e3a9"
        cma.chronoai.dev/image-source: "4c61e77e6efbe4e02c6769a378c9e13794f1a14c"
        cma.chronoai.dev/operator-config-reload: "owner-keys-owner-reload-3d11ffa7964f-40959177691"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/source-tree: "f6bf104c2ebadc7f3a722b5cd86b8181bf2da686"
        cma.chronoai.dev/thread-contract-writes: "v1"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Thirty seconds of routing propagation, 660 seconds of connection drain,
      # and 45 seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 735
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-cmaeg@sha256:2400d8b818527e2352ae0a25f44a4f5e01f3d027702f0768c562df07ab9d31c9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_OWNER_KEY_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-owner-keys
                  key: CMAEG_OWNER_KEY_SERVICE_ID
                  optional: true
            - name: CMAEG_OWNER_KEY_CUTOVER_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-owner-keys
                  key: CMAEG_OWNER_KEY_CUTOVER_ID
                  optional: true
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 30
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
