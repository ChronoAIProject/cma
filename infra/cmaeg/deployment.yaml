apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "4f03c35a80322673ec00df7a3b6b9399015f5a68"
    cma.chronoai.dev/ci-archive-sha256: "sha256:9414524cd09fd430eb8906b1527071c2b955a5704483375d1b640b62cf8d98b2"
    cma.chronoai.dev/ci-artifact: "13635949764"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "4f03c35a80322673ec00df7a3b6b9399015f5a68"
    cma.chronoai.dev/ci-publication-sha256: "sha256:86f7fa7b7860f836f21d37e97e60ee963018ef37eb368768563548c71695d2b4"
    cma.chronoai.dev/ci-run: "42526770281"
    cma.chronoai.dev/image-digest: "sha256:2400d8b818527e2352ae0a25f44a4f5e01f3d027702f0768c562df07ab9d31c9"
    cma.chronoai.dev/image-source: "4f03c35a80322673ec00df7a3b6b9399015f5a68"
    cma.chronoai.dev/source-tree: "9ef67d581d98201ae6c3a7fbe831da4d013476aa"
spec:
  replicas: 1
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/thread-contract-writes: "v1"
        cma.chronoai.dev/operator-config-reload: "cmaeg-four-platform-4db8af3b-40699201203"
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "4f03c35a80322673ec00df7a3b6b9399015f5a68"
        cma.chronoai.dev/image-digest: "sha256:2400d8b818527e2352ae0a25f44a4f5e01f3d027702f0768c562df07ab9d31c9"
        cma.chronoai.dev/ci-archive-sha256: "sha256:9414524cd09fd430eb8906b1527071c2b955a5704483375d1b640b62cf8d98b2"
        cma.chronoai.dev/image-source: "4f03c35a80322673ec00df7a3b6b9399015f5a68"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/ci-artifact: "13635949764"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "4f03c35a80322673ec00df7a3b6b9399015f5a68"
        cma.chronoai.dev/ci-publication-sha256: "sha256:86f7fa7b7860f836f21d37e97e60ee963018ef37eb368768563548c71695d2b4"
        cma.chronoai.dev/ci-run: "42526770281"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/source-tree: "9ef67d581d98201ae6c3a7fbe831da4d013476aa"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Thirty seconds of routing propagation, 660 seconds of connection drain,
      # and 45 seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 735
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-cmaeg@sha256:2400d8b818527e2352ae0a25f44a4f5e01f3d027702f0768c562df07ab9d31c9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 30
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
