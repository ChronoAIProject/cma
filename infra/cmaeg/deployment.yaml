apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "0ced1d6cf7d1c2a212b6daeca84aefa2e60d6c48"
    cma.chronoai.dev/ci-archive-sha256: "sha256:2e8ff8cd2b45e6b0ad84a1a6a0488ac7bcc0f2851a0ab0cad4f6e2a546d9ccbe"
    cma.chronoai.dev/ci-artifact: "12689857419"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "0ced1d6cf7d1c2a212b6daeca84aefa2e60d6c48"
    cma.chronoai.dev/ci-publication-sha256: "sha256:994e0eb447eba7a816fceff6544c7967941720a194278a4617e3c580f48cf9ad"
    cma.chronoai.dev/ci-run: "40401725379"
    cma.chronoai.dev/image-digest: "sha256:6adcecfcdccf6b86d2ccfe3f6edb0d9ebdab8e187fb3dd912a2472ffbf30c8d6"
    cma.chronoai.dev/image-source: "dc595e845658aa5f783f833310f949ca95269d99"
    cma.chronoai.dev/source-tree: "66e33b9bb1e13048d2411267cbdf96e1231372b0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/thread-contract-writes: "v1"
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "0ced1d6cf7d1c2a212b6daeca84aefa2e60d6c48"
        cma.chronoai.dev/image-digest: "sha256:6adcecfcdccf6b86d2ccfe3f6edb0d9ebdab8e187fb3dd912a2472ffbf30c8d6"
        cma.chronoai.dev/ci-archive-sha256: "sha256:2e8ff8cd2b45e6b0ad84a1a6a0488ac7bcc0f2851a0ab0cad4f6e2a546d9ccbe"
        cma.chronoai.dev/image-source: "dc595e845658aa5f783f833310f949ca95269d99"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/ci-artifact: "12689857419"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "0ced1d6cf7d1c2a212b6daeca84aefa2e60d6c48"
        cma.chronoai.dev/ci-publication-sha256: "sha256:994e0eb447eba7a816fceff6544c7967941720a194278a4617e3c580f48cf9ad"
        cma.chronoai.dev/ci-run: "40401725379"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/source-tree: "66e33b9bb1e13048d2411267cbdf96e1231372b0"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Five seconds of routing propagation, 600 seconds of application drain,
      # and ten seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 615
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/example-project-01/example-registry-02/cma-cmaeg@sha256:6adcecfcdccf6b86d2ccfe3f6edb0d9ebdab8e187fb3dd912a2472ffbf30c8d6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
