apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "cfc26556676bb6c43287fcf9eae5d0e1b532cbed"
    cma.chronoai.dev/ci-archive-sha256: "sha256:987038c97196728457dc50fd87a342049f39a87c50eedc26fc9b39b766d8cd4c"
    cma.chronoai.dev/ci-artifact: "12757901163"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "cfc26556676bb6c43287fcf9eae5d0e1b532cbed"
    cma.chronoai.dev/ci-publication-sha256: "sha256:4b560cd7babd3cec7d2cb75929f28cbcc4b2f1a8244ddf3e495a8abfb7050b9c"
    cma.chronoai.dev/ci-run: "40553789782"
    cma.chronoai.dev/image-digest: "sha256:9ad0de9e7c9aaa7964e70a6be8ffcc2220175f7a1f921aa1c5421de322f00bc9"
    cma.chronoai.dev/image-source: "eb1f88cfb777293a9e919956f254739f3aab9256"
    cma.chronoai.dev/source-tree: "79d5fb424c580aabe1359fb4acdc5204cc7e0526"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/thread-contract-writes: "v1"
        cma.chronoai.dev/operator-config-reload: "pr1156-media-cfc265566-40553789782-9ad0de9e7c9a"
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "cfc26556676bb6c43287fcf9eae5d0e1b532cbed"
        cma.chronoai.dev/image-digest: "sha256:9ad0de9e7c9aaa7964e70a6be8ffcc2220175f7a1f921aa1c5421de322f00bc9"
        cma.chronoai.dev/ci-archive-sha256: "sha256:987038c97196728457dc50fd87a342049f39a87c50eedc26fc9b39b766d8cd4c"
        cma.chronoai.dev/image-source: "eb1f88cfb777293a9e919956f254739f3aab9256"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/ci-artifact: "12757901163"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "cfc26556676bb6c43287fcf9eae5d0e1b532cbed"
        cma.chronoai.dev/ci-publication-sha256: "sha256:4b560cd7babd3cec7d2cb75929f28cbcc4b2f1a8244ddf3e495a8abfb7050b9c"
        cma.chronoai.dev/ci-run: "40553789782"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/source-tree: "79d5fb424c580aabe1359fb4acdc5204cc7e0526"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Five seconds of routing propagation, 600 seconds of application drain,
      # and ten seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 615
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/example-project-01/example-registry-02/cma-cmaeg@sha256:9ad0de9e7c9aaa7964e70a6be8ffcc2220175f7a1f921aa1c5421de322f00bc9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
