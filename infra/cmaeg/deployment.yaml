apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "0d1772cfcbda4b55edba6f872495413ec9d6e72d"
    cma.chronoai.dev/ci-archive-sha256: "sha256:f1d2a86df0b89e39dbf14ae3b4ab4efa71b21cc167f1dd34a358f5a27d1a4ea1"
    cma.chronoai.dev/ci-artifact: "12821784343"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "615c6f23bbf3b9ea250bc77d72888aa19727b8b7"
    cma.chronoai.dev/ci-publication-sha256: "sha256:023e22a19c42cf9736bbc1c8dc21f7727da75cfdebaad61b77a5ecf975bf6baa"
    cma.chronoai.dev/ci-run: "40699201203"
    cma.chronoai.dev/image-digest: "sha256:03df804694cd5f43f637a44ebaa6002c988c4dbaaeb37beeee5e906943b79130"
    cma.chronoai.dev/image-source: "615c6f23bbf3b9ea250bc77d72888aa19727b8b7"
    cma.chronoai.dev/source-tree: "674ab5a55000aa49433715f0668df743488fe2fb"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/thread-contract-writes: "v1"
        cma.chronoai.dev/operator-config-reload: "cmaeg-four-platform-4db8af3b-40699201203"
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "0d1772cfcbda4b55edba6f872495413ec9d6e72d"
        cma.chronoai.dev/image-digest: "sha256:03df804694cd5f43f637a44ebaa6002c988c4dbaaeb37beeee5e906943b79130"
        cma.chronoai.dev/ci-archive-sha256: "sha256:f1d2a86df0b89e39dbf14ae3b4ab4efa71b21cc167f1dd34a358f5a27d1a4ea1"
        cma.chronoai.dev/image-source: "615c6f23bbf3b9ea250bc77d72888aa19727b8b7"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/ci-artifact: "12821784343"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "615c6f23bbf3b9ea250bc77d72888aa19727b8b7"
        cma.chronoai.dev/ci-publication-sha256: "sha256:023e22a19c42cf9736bbc1c8dc21f7727da75cfdebaad61b77a5ecf975bf6baa"
        cma.chronoai.dev/ci-run: "40699201203"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/source-tree: "674ab5a55000aa49433715f0668df743488fe2fb"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Five seconds of routing propagation, 600 seconds of application drain,
      # and ten seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 615
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-cmaeg@sha256:03df804694cd5f43f637a44ebaa6002c988c4dbaaeb37beeee5e906943b79130
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
