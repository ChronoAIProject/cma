apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "f308d88f23754c2c55aef5a51372fd534c2a89d9"
    cma.chronoai.dev/ci-archive-sha256: "sha256:e27ce9a5cfc6669db4666e709042a1c67ee00c91788bfb81d11ab348f4a7043a"
    cma.chronoai.dev/ci-artifact: "12725863125"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "f308d88f23754c2c55aef5a51372fd534c2a89d9"
    cma.chronoai.dev/ci-publication-sha256: "sha256:6c5d679b9d6da4d968a73901c2bb325b7ac5e8fee41de30e2fde90d6487d33c0"
    cma.chronoai.dev/ci-run: "40486174299"
    cma.chronoai.dev/image-digest: "sha256:f68aab5c8bc4596970f08faeca33e25d189f33fedb5b050eccaa9558a0a9c501"
    cma.chronoai.dev/image-source: "994fec4810c30d045857315eec562fa6cbbf168a"
    cma.chronoai.dev/source-tree: "b28be90a87e6749a0a434447e0bcb65978427b69"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/thread-contract-writes: "v1"
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "f308d88f23754c2c55aef5a51372fd534c2a89d9"
        cma.chronoai.dev/image-digest: "sha256:f68aab5c8bc4596970f08faeca33e25d189f33fedb5b050eccaa9558a0a9c501"
        cma.chronoai.dev/ci-archive-sha256: "sha256:e27ce9a5cfc6669db4666e709042a1c67ee00c91788bfb81d11ab348f4a7043a"
        cma.chronoai.dev/image-source: "994fec4810c30d045857315eec562fa6cbbf168a"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/ci-artifact: "12725863125"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "f308d88f23754c2c55aef5a51372fd534c2a89d9"
        cma.chronoai.dev/ci-publication-sha256: "sha256:6c5d679b9d6da4d968a73901c2bb325b7ac5e8fee41de30e2fde90d6487d33c0"
        cma.chronoai.dev/ci-run: "40486174299"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/source-tree: "b28be90a87e6749a0a434447e0bcb65978427b69"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Five seconds of routing propagation, 600 seconds of application drain,
      # and ten seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 615
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-cmaeg@sha256:f68aab5c8bc4596970f08faeca33e25d189f33fedb5b050eccaa9558a0a9c501
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
