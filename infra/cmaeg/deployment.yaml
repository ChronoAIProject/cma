    cma.chronoai.dev/ci-publication-sha256: "sha256:196f843e350aba93539e162dbb705ab1aa3bcf5974293d04e15b7c29e7cc7ce7"
    cma.chronoai.dev/ci-run: "40445812082"
    cma.chronoai.dev/image-digest: "sha256:391de8b3f0d8bc04415e2effb00d6584dc65a4b4a31085001fe0739c95481403"
    cma.chronoai.dev/image-source: "32ac7cf32a2edadd1fb632c7b44e0867492520c7"
    cma.chronoai.dev/source-tree: "a28acd8a66ee111d602e5be031902a71b5bd6c59"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/thread-contract-writes: "v1"
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "b761d1dea26384d8fe494a44f9fe64f62367a6a2"
        cma.chronoai.dev/image-digest: "sha256:391de8b3f0d8bc04415e2effb00d6584dc65a4b4a31085001fe0739c95481403"
        cma.chronoai.dev/ci-archive-sha256: "sha256:ab916a56e8c9826bb35a8213726b868b01474e00c3dcc53a4616f10a741c6fa7"
        cma.chronoai.dev/image-source: "32ac7cf32a2edadd1fb632c7b44e0867492520c7"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/ci-artifact: "12709275440"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "b761d1dea26384d8fe494a44f9fe64f62367a6a2"
        cma.chronoai.dev/ci-publication-sha256: "sha256:196f843e350aba93539e162dbb705ab1aa3bcf5974293d04e15b7c29e7cc7ce7"
        cma.chronoai.dev/ci-run: "40445812082"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/source-tree: "a28acd8a66ee111d602e5be031902a71b5bd6c59"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Five seconds of routing propagation, 600 seconds of application drain,
      # and ten seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 615
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-cmaeg@sha256:391de8b3f0d8bc04415e2effb00d6584dc65a4b4a31085001fe0739c95481403
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
