apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "83e15b3321cfc569ec547d976570f3ce630bae34"
    cma.chronoai.dev/ci-archive-sha256: "sha256:ff4d779689b7f6acbfa0bddb0ebac25feef21afe15bda23d50c7a94e8f0856fa"
    cma.chronoai.dev/ci-artifact: "12842954147"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "83e15b3321cfc569ec547d976570f3ce630bae34"
    cma.chronoai.dev/ci-publication-sha256: "sha256:e30338f75407d890153f3be34b535bf4c40ffecdad95a1b23517b2469b39d4db"
    cma.chronoai.dev/ci-run: "40746713632"
    cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
    cma.chronoai.dev/image-digest: "sha256:9f446fcb6d88124cffb07ba7e39081606215aaa75a9cb14d34a09b06bf5e61fe"
    cma.chronoai.dev/image-source: "089b0ecec9591d4895e9af08951a48bb781c9add"
    cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
    cma.chronoai.dev/source-tree: "5d1ea195f526317849264debd6f68a8c697a1247"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-event-gateway
  template:
    metadata:
      annotations:
        cma.chronoai.dev/authoring-activation: "76bcae97d-20261026"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "83e15b3321cfc569ec547d976570f3ce630bae34"
        cma.chronoai.dev/ci-archive-sha256: "sha256:ff4d779689b7f6acbfa0bddb0ebac25feef21afe15bda23d50c7a94e8f0856fa"
        cma.chronoai.dev/ci-artifact: "12842954147"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "83e15b3321cfc569ec547d976570f3ce630bae34"
        cma.chronoai.dev/ci-publication-sha256: "sha256:e30338f75407d890153f3be34b535bf4c40ffecdad95a1b23517b2469b39d4db"
        cma.chronoai.dev/ci-run: "40746713632"
        cma.chronoai.dev/gateway-domain-phase: "eg-canonical"
        cma.chronoai.dev/image-digest: "sha256:9f446fcb6d88124cffb07ba7e39081606215aaa75a9cb14d34a09b06bf5e61fe"
        cma.chronoai.dev/image-source: "089b0ecec9591d4895e9af08951a48bb781c9add"
        cma.chronoai.dev/operator-config-reload: "native-controls-83e15b332-40746713632-9f446fcb6d88"
        cma.chronoai.dev/portal-auth: "agent-manager-shared-login"
        cma.chronoai.dev/source-tree: "5d1ea195f526317849264debd6f68a8c697a1247"
        cma.chronoai.dev/thread-contract-writes: "v1"
      labels:
        app.kubernetes.io/name: cma-event-gateway
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cmaeg-ksa
      automountServiceAccountToken: false
      # Five seconds of routing propagation, 600 seconds of application drain,
      # and ten seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 615
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-event-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmaeg
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-cmaeg@sha256:9f446fcb6d88124cffb07ba7e39081606215aaa75a9cb14d34a09b06bf5e61fe
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-event-gateway
          volumeMounts:
            - name: media-jobs
              mountPath: /var/cmaeg/media
          env:
            - name: CMAEG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-auth
                  key: CMAEG_MONGODB_URI
            - name: CMAEG_NYXID_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_ID
            - name: CMAEG_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-agent-manager
                  key: CHRONO_NYXID_CLIENT_SECRET
            - name: CMAEG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-master-keys
                  key: CMAEG_MASTER_KEYS
            - name: CMAEG_CMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_SERVICE_TOKEN
            - name: CMAEG_CMA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_ID
            - name: CMAEG_CMA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-event-gateway-cma-service-token
                  key: CMAEG_CMA_CLIENT_SECRET
            - name: CMAEG_STT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cmaeg-stt
                  key: CMAEG_STT_API_KEY
                  optional: true
            - name: CMAEG_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cmaeg-console-oauth
                  key: CMAEG_CONSOLE_CLIENT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
      volumes:
        - name: media-jobs
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
