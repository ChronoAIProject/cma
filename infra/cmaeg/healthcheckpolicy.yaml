apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cma-event-gateway
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
spec:
  targetRef:
    group: ""
    kind: Service
    name: cma-event-gateway
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8090
        # Keep infrastructure probes on the root path. Public NyxID probes use
        # /event-gateway/v1/readyz -> the application's /v1/readyz alias.
        requestPath: /readyz
