# Kubernetes Secret references only. Populate values out of band; the Deployment
# injects them through secretKeyRef environment variables. Never value them in Git.
apiVersion: v1
kind: Secret
metadata:
  name: cma-event-gateway-master-keys
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: cma-event-gateway-cma-service-token
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-event-gateway
    app.kubernetes.io/part-of: cma
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: cmaeg-stt
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cmaeg
    app.kubernetes.io/part-of: cma
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: cmaeg-console-oauth
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cmaeg
    app.kubernetes.io/part-of: cma
type: Opaque
stringData: {}
# Required keys, populated out of band:
#   CMAEG_MASTER_KEYS         In cma-event-gateway-master-keys. One kid:base64key[,kid:base64key]
#                             line, each key 32 bytes. Keep stable across restarts.
#   CMAEG_CMA_SERVICE_TOKEN   In cma-event-gateway-cma-service-token. Inbound rekey bearer.
#                             Also the outbound CMA bearer in legacy static mode.
#   CMAEG_CMA_CLIENT_ID       In cma-event-gateway-cma-service-token. Dedicated NyxID account.
#   CMAEG_CMA_CLIENT_SECRET   In cma-event-gateway-cma-service-token. Exchanges renewable
#                             outbound CMA tokens with openid roles scopes.
#                             Its role grants only
#                             cma:provider:bindings. Keep the same account subject.
#   CMAEG_CONSOLE_CLIENT_SECRET   In cmaeg-console-oauth; NyxID OAuth client secret for the console
# Optional compatibility inputs, unused by this Kubernetes deployment:
#   CMAEG_MASTER_KEYS_FILE         Alternative file source; mutually exclusive
#                                 with CMAEG_MASTER_KEYS.
#   CMAEG_CMA_SERVICE_TOKEN_FILE   Alternative file source; mutually exclusive
#                                 with CMAEG_CMA_SERVICE_TOKEN.

---
# CMAEG_MONGODB_URI, CMAEG_NYXID_CLIENT_ID, CMAEG_NYXID_CLIENT_SECRET,
# cookie-key (32 raw bytes). Shared-schema mode uses the existing chrono-bot URI;
# isolated mode requires this identity to have only eg_* database grants.
apiVersion: v1
kind: Secret
metadata:
  name: cma-event-gateway-auth
  namespace: chrono-bot
type: Opaque
stringData: {}

#   CMAEG_MONGODB_URI          Event Gateway configured database URI.
#   CMAEG_NYXID_CLIENT_ID      Independent NyxID confidential client.
#   CMAEG_NYXID_CLIENT_SECRET  Independent client secret.
# Optional keys, populated out of band only when speech-to-text is enabled:
#   CMAEG_STT_API_KEY         In cmaeg-stt. Platform speech-to-text key, sent only
#                             to CMAEG_STT_URL; never a tenant key.
