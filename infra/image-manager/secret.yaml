# Provision out of band. Shared-schema mode uses the existing chrono-bot URI;
# isolated mode requires exclusive im_* grants for this credential.
#   CMA_IM_MONGODB_URI         Image Manager configured database URI.
#   CMA_IM_NYXID_CLIENT_ID      Independent NyxID confidential client.
#   CMA_IM_NYXID_CLIENT_SECRET  Independent client secret.
# cookie-key: 32 random raw bytes.
apiVersion: v1
kind: Secret
metadata:
  name: cma-image-manager
  namespace: chrono-bot
type: Opaque
stringData: {}
