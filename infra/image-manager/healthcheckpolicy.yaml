apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cma-image-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-image-manager
    app.kubernetes.io/part-of: cma
spec:
  targetRef:
    group: ""
    kind: Service
    name: cma-image-manager
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /readyz
