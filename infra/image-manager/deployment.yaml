apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-image-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-image-manager
    app.kubernetes.io/part-of: cma
spec:
  # Activation requires a published image digest, migrated DB and service identities.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-image-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cma-image-manager
        app.kubernetes.io/part-of: cma
    spec:
      serviceAccountName: cma-image-manager
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cma-image-manager
          image: asia-southeast1-docker.pkg.dev/example-project-02/example-registry-01/cma-image-manager:unreleased
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cma-image-manager
          env:
            - name: CMA_IM_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cma-image-manager
                  key: CMA_IM_MONGODB_URI
            - name: CMA_IM_NYXID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cma-image-manager
                  key: CMA_IM_NYXID_CLIENT_ID
            - name: CMA_IM_NYXID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cma-image-manager
                  key: CMA_IM_NYXID_CLIENT_SECRET
          volumeMounts:
            - name: cookie-key
              mountPath: /var/run/cma-image-manager
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      volumes:
        - name: cookie-key
          secret:
            secretName: cma-image-manager
            items:
              - key: cookie-key
                path: cookie-key
