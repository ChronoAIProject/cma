# Apply only in S3 after both ownership and capacity gates pass.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cma-agent-manager
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
