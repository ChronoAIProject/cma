        cma.chronoai.dev/runtime-image-digest: "sha256:a8f9bd81ef1d9a79eacbd2b91bebc51c0dbd8d8399462229d50a938327eb1f9e"
        cma.chronoai.dev/runtime-image-source: "61c7411f410af0be18db669acb23b6729107ede5"
        cma.chronoai.dev/runtime-source-tree: "f9b1dad06484a10614e0d64de0630c3590d200eb"
      labels:
        app.kubernetes.io/name: cma-agent-manager
        app.kubernetes.io/part-of: cma
    spec:
      # Shutdown drains HTTP for up to 30s, then background workers for up to
      # 30s. Leave another five seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 65
      # The sandbox key is delivered by the platform's secret provider, which
      # identifies the workload by its service account. Running as "default"
      # would present the wrong principal and the mount would be refused
      # however correct the provider configuration is, so the token is mounted
      # deliberately rather than switched off.
      serviceAccountName: chrono-bot-ksa
      automountServiceAccountToken: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-agent-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Secret volumes are owned by root; without an fsGroup the mounted key
        # is unreadable to a non-root container no matter what mode it carries.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-api@sha256:ea095113f2902c8d91a01c388509f5a319e0048407da7b063800bbdd9d4ca5b8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-agent-manager
            - secretRef:
                name: cma-agent-manager
          env:
            # Keep interactive IO schedulable when one async task performs CPU
            # work. The one-CPU quota otherwise selects a single Tokio worker.
            - name: TOKIO_WORKER_THREADS
              value: "2"
            - name: CHRONO_AGENT_SANDBOX_API_SERVER
              valueFrom:
                configMapKeyRef:
                  name: chrono-pod-configmap
                  key: CHRONO_POD_API_SERVER
                  optional: false
            - name: CHRONO_AGENT_SANDBOX_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: chrono-pod-configmap
                  key: CHRONO_POD_NAMESPACE
                  optional: false
            - name: CHRONO_AGENT_SANDBOX_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: chrono-pod-configmap
                  key: CHRONO_POD_CA_FILE
                  optional: false
            # Production opts into one prepared default hierarchy at the
            # Deployment layer while the shared ConfigMap keeps its safe
            # default of zero for environments that do not opt in.
            - name: CHRONO_NATIVE_PREPARED_TARGET
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              # Four lifecycle sweeps can each hold bounded upload buffers.
              # All restore downloads share a four-part (128 MiB) buffer cap.
              memory: 1Gi
          # Startup validates MongoDB schema/indexes and composes provider
          # authorities before binding. The existing 30-minute budget is
          # finite; readiness separately checks the composed dependencies.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            # Longer than the API's two-second store-ping deadline.
            timeoutSeconds: 3
          volumeMounts:
            - name: chrono-pod-configmap
              mountPath: /etc/chrono-pod
              readOnly: true
            - name: agent-sandbox-control
              mountPath: /var/run/cma-agent-sandbox
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Read-only so a compromised process cannot rewrite the credential
            # it authenticates with.
            - name: opensandbox-api-key
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: chrono-pod-configmap
          configMap:
            name: chrono-pod-configmap
            optional: false
            items:
              - key: ca.crt
                path: ca.crt
        - name: agent-sandbox-control
          secret:
            secretName: cma-agent-sandbox-control
            optional: false
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        # The OpenSandbox API key arrives as a file rather than an environment
        # variable, keeping it out of the pod spec and the process environment.
        # It is delivered by the cluster's secret provider straight from the
        # secret manager, so no Kubernetes Secret holds it and nothing here
        # carries a value.
        #
        # The SecretProviderClass below must resolve CMA's OWN key,
        # opensandbox-chrono-bot-api-key. Provider classes in several namespaces
        # resolve different underlying secrets, so copying this block between
        # namespaces can silently change which key is delivered. Verify the
        # class it binds to before changing this line.
        - name: opensandbox-api-key
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: cma-opensandbox-api-key
