apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
  annotations:
    cma.chronoai.dev/api-image-digest: "sha256:94d69dac3edfedb74d6c8edeb22b4fdb561c395a88df071e8c51b0f6e35dabac"
    cma.chronoai.dev/build-mode: "github-ci-artifact"
    cma.chronoai.dev/candidate: "2f857d2c59c40745f478a72395fb8f7be223eaf3"
    cma.chronoai.dev/ci-artifact: "12443437007"
    cma.chronoai.dev/ci-attempt: "1"
    cma.chronoai.dev/ci-head: "decab62ad019e783b695f8541dfe51326c7df78c"
    cma.chronoai.dev/ci-publication-sha256: "sha256:a99db95b029af8ad9f88086c5ad817d648fb09039c38b0d6c1e8e3b7a7719d9a"
    cma.chronoai.dev/ci-run: "39812982584"
    cma.chronoai.dev/image-digest: "sha256:94d69dac3edfedb74d6c8edeb22b4fdb561c395a88df071e8c51b0f6e35dabac"
    cma.chronoai.dev/image-source: "2b360268881624f2b767499878d1d167f59c9c1d"
    cma.chronoai.dev/source-tree: "d90bd6860a12f3babe988f8d5a3cb8d63765cd86"
spec:
  replicas: 1
  # Quota reservations and rate counters are process-local. Keep one replica
  # and no rollout overlap until those authorities have shared coordination.
  # Durable worker leases and resume cursors survive the brief Recreate gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-agent-manager
  template:
    metadata:
      annotations:
        cma.chronoai.dev/allocation-provider: "agent-sandbox"
        cma.chronoai.dev/api-image-digest: "sha256:94d69dac3edfedb74d6c8edeb22b4fdb561c395a88df071e8c51b0f6e35dabac"
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "2f857d2c59c40745f478a72395fb8f7be223eaf3"
        cma.chronoai.dev/ci-artifact: "12443437007"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "decab62ad019e783b695f8541dfe51326c7df78c"
        cma.chronoai.dev/ci-publication-sha256: "sha256:a99db95b029af8ad9f88086c5ad817d648fb09039c38b0d6c1e8e3b7a7719d9a"
        cma.chronoai.dev/ci-run: "39812982584"
        cma.chronoai.dev/image-digest: "sha256:94d69dac3edfedb74d6c8edeb22b4fdb561c395a88df071e8c51b0f6e35dabac"
        cma.chronoai.dev/image-source: "2b360268881624f2b767499878d1d167f59c9c1d"
        cma.chronoai.dev/runtime-image: "sha256:f6e40d8af124308cd06c58b7f82b0d60a176a78aa5c2f05d2ce6cbfb72442c58"
        cma.chronoai.dev/source-tree: "d90bd6860a12f3babe988f8d5a3cb8d63765cd86"
      labels:
        app.kubernetes.io/name: cma-agent-manager
        app.kubernetes.io/part-of: cma
    spec:
      # Shutdown drains HTTP for up to 30s, then background workers for up to
      # 30s. Leave another five seconds for process and kubelet teardown.
      terminationGracePeriodSeconds: 65
      # The sandbox key is delivered by the platform's secret provider, which
      # identifies the workload by its service account. Running as "default"
      # would present the wrong principal and the mount would be refused
      # however correct the provider configuration is, so the token is mounted
      # deliberately rather than switched off.
      serviceAccountName: chrono-bot-ksa
      automountServiceAccountToken: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-agent-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Secret volumes are owned by root; without an fsGroup the mounted key
        # is unreadable to a non-root container no matter what mode it carries.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-api@sha256:94d69dac3edfedb74d6c8edeb22b4fdb561c395a88df071e8c51b0f6e35dabac
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-agent-manager
            - secretRef:
                name: cma-agent-manager
          env:
            # Production opts into one prepared default hierarchy at the
            # Deployment layer while the shared ConfigMap keeps its safe
            # default of zero for environments that do not opt in.
            - name: CHRONO_NATIVE_PREPARED_TARGET
              value: "1"
            - name: CHRONO_AGENT_SANDBOX_API_SERVER
              valueFrom:
                configMapKeyRef:
                  name: chrono-pod-configmap
                  key: CHRONO_POD_API_SERVER
                  optional: true
            - name: CHRONO_AGENT_SANDBOX_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: chrono-pod-configmap
                  key: CHRONO_POD_NAMESPACE
                  optional: true
            - name: CHRONO_AGENT_SANDBOX_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: chrono-pod-configmap
                  key: CHRONO_POD_CA_FILE
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              # Four lifecycle sweeps can each hold bounded upload buffers.
              # All restore downloads share a four-part (128 MiB) buffer cap.
              memory: 1Gi
          # Startup validates MongoDB schema/indexes and composes provider
          # authorities before binding. The existing 30-minute budget is
          # finite; readiness separately checks the composed dependencies.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            # Longer than the API's two-second store-ping deadline.
            timeoutSeconds: 3
          volumeMounts:
            - name: chrono-pod-configmap
              mountPath: /etc/chrono-pod
              readOnly: true
            - name: agent-sandbox-control
              mountPath: /var/run/cma-agent-sandbox
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Read-only so a compromised process cannot rewrite the credential
            # it authenticates with.
            - name: opensandbox-api-key
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: chrono-pod-configmap
          configMap:
            name: chrono-pod-configmap
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: agent-sandbox-control
          secret:
            secretName: cma-agent-sandbox-control
            optional: true
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        # The OpenSandbox API key arrives as a file rather than an environment
        # variable, keeping it out of the pod spec and the process environment.
        # It is delivered by the cluster's secret provider straight from the
        # secret manager, so no Kubernetes Secret holds it and nothing here
        # carries a value.
        #
        # The SecretProviderClass below must resolve CMA's OWN key,
        # opensandbox-chrono-bot-api-key. Provider classes in several namespaces
        # resolve different underlying secrets, so copying this block between
        # namespaces can silently change which key is delivered. Verify the
        # class it binds to before changing this line.
        - name: opensandbox-api-key
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: cma-opensandbox-api-key
