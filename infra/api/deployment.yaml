apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrono-bot-api
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: chrono-bot-api
    app.kubernetes.io/part-of: chrono-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chrono-bot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrono-bot-api
        app.kubernetes.io/part-of: chrono-bot
    spec:
      # The sandbox key is delivered by the platform's secret provider, which
      # identifies the workload by its service account. Running as "default"
      # would present the wrong principal and the mount would be refused
      # however correct the provider configuration is, so the token is mounted
      # deliberately rather than switched off.
      serviceAccountName: chrono-bot-ksa
      automountServiceAccountToken: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: chrono-bot-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Secret volumes are owned by root; without an fsGroup the mounted key
        # is unreadable to a non-root container no matter what mode it carries.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/chrono-bot-api:9b523f3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chrono-bot-api
            - secretRef:
                name: chrono-bot-api
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Read-only so a compromised process cannot rewrite the credential
            # it authenticates with.
            - name: opensandbox-api-key
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # The OpenSandbox API key arrives as a file rather than an environment
        # variable, keeping it out of the pod spec and the process environment.
        # It is delivered by the cluster's secret provider straight from the
        # secret manager, so no Kubernetes Secret holds it and nothing here
        # carries a value.
        #
        # The SecretProviderClass below must resolve chrono-bot's OWN key,
        # opensandbox-chrono-bot-api-key. Several namespaces define a class of
        # the same name over a different underlying secret, so copying this
        # block between namespaces silently changes which key is delivered with
        # no visible difference. Verify the class it binds to before changing
        # this line.
        - name: opensandbox-api-key
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: opensandbox-api-key
