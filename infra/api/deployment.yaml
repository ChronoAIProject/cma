        cma.chronoai.dev/runtime-build-mode: "github-ci-artifact"
        cma.chronoai.dev/runtime-candidate: "58caace0ac3aafe7ddd0ba19b30cac07b29601cb"
        cma.chronoai.dev/runtime-ci-archive-sha256: "sha256:871ba54c60865a059af01f8fd46e62aba8c103133a317b3830339a1988d38771"
        cma.chronoai.dev/runtime-ci-attempt: "1"
