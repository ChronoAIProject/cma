        cma.chronoai.dev/image-source: "eb2bb1627f3957caec9f7cedc9e2af69298cd138"
        cma.chronoai.dev/runtime-image: "sha256:a8f9bd81ef1d9a79eacbd2b91bebc51c0dbd8d8399462229d50a938327eb1f9e"
        cma.chronoai.dev/source-tree: "d1274f06fcfc987099517dada4a88ff21b6ccc36"
