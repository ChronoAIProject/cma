spec:
  replicas: 1
  # Quota reservations and rate counters are process-local. Keep one replica
  # and no rollout overlap until those authorities have shared coordination.
  # Durable worker leases and resume cursors survive the brief Recreate gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-agent-manager
  template:
    metadata:
      annotations:
        cma.chronoai.dev/allocation-provider: "agent-sandbox"
        cma.chronoai.dev/api-image-digest: "sha256:72e1d882d2fe1eb32264c2958ebfe6f350723c57a8bc2a81ed1c1e59c13cec2b"
        cma.chronoai.dev/runtime-ci-artifact: "12804797246"
