spec:
  replicas: 1
  minReadySeconds: 30
  # Shared request budgets and transactional visitor quotas permit overlap.
  # The NEG readiness gate must be healthy before the old endpoint is removed.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-agent-manager
  template:
    metadata:
      annotations:
        cma.chronoai.dev/allocation-provider: "agent-sandbox"
        cma.chronoai.dev/api-image-digest: "sha256:3b2eae1d7cde8b7a154a551c3a24891cb53e11808d464e8119328001578a2a20"
