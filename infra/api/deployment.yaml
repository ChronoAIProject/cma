apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrono-bot-api
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: chrono-bot-api
    app.kubernetes.io/part-of: chrono-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chrono-bot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrono-bot-api
        app.kubernetes.io/part-of: chrono-bot
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: chrono-bot-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Secret volumes are owned by root; without an fsGroup the mounted key
        # is unreadable to a non-root container no matter what mode it carries.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/chrono-bot-api:2e7b976
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chrono-bot-api
            - secretRef:
                name: chrono-bot-api
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Read-only so a compromised process cannot rewrite the credential
            # it authenticates with.
            - name: opensandbox-api-key
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # The OpenSandbox API key arrives as a file rather than an environment
        # variable, keeping it out of the pod spec and the process environment.
        # The Secret is populated out of band; nothing here carries a value.
        - name: opensandbox-api-key
          secret:
            secretName: chrono-bot-opensandbox
            items:
              - key: api-key
                path: opensandbox-api-key
            # Group-readable, paired with fsGroup above. Never world-readable.
            defaultMode: 0440
