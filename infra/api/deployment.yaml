        cma.chronoai.dev/image-source: "d06f8fc45593d0fe4a3801abf036272839ae36f5"
        cma.chronoai.dev/runtime-image: "sha256:a431fc69c34e0f304b15136382a91403153d7506fc24d6a934ef705dd3c43c33"
        cma.chronoai.dev/source-tree: "486aedfa84f1f0bfb91892c8f477f936fdcec38d"
