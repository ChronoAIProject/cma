# Identity the control plane runs as.
#
# Not cosmetic: the cluster's secret provider decides whether to hand over the
# OpenSandbox key by looking at which service account the pod runs as. Running
# as "default" presents the wrong principal and the mount is refused however
# correct the provider configuration is.
#
# The binding from this account to the secret it may read lives in the cloud
# project's IAM policy, not here. That half cannot be expressed in a Kubernetes
# manifest, so this file declares the account and the deployment's dependency
# on it, and the grant remains an infrastructure concern.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chrono-bot-ksa
  namespace: chrono-bot
  annotations:
    iam.gke.io/gcp-service-account: example-sa-01@example-project-02.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
# Mounting is decided per pod rather than here, so an account that exists for
# secret delivery does not hand a cluster token to every workload naming it.
automountServiceAccountToken: false
---
# The provider's HTTP API cannot compare metadata while deleting. CMA reads
# only the BatchSandbox named by a durable cleanup debt, verifies its canonical
# ownership labels, and deletes it with UID and resourceVersion preconditions.
# Discovery uses the same namespaced API with an exact three-label selector.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cma-batchsandbox-reclaimer
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
rules:
  # Only the infra-owned CRDs are consumed; the upstream controller owns Pods.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools", "sandboxclaims"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes"]
    verbs: ["get", "list", "delete"]
  # Home PVCs outlive runtimes. Native pool adoption patches the original PVC
  # only after the controller observes its conversion to an explicit mount.
  # Allocation identity and exact UID/resourceVersion guard adoption/cleanup.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Snapshot export attempts are exact, namespaced Pods. CMA verifies the
  # recorded Pod UID before observing or streaming and deletes only that UID.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # kube-rs delivers native warm Pod assignment over WebSocket exec stdin.
    verbs: ["get", "create"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cma-batchsandbox-reclaimer
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
subjects:
  - kind: ServiceAccount
    name: chrono-bot-ksa
    namespace: chrono-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cma-batchsandbox-reclaimer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cma-runtime
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-runtime
    app.kubernetes.io/part-of: cma
automountServiceAccountToken: false
---
# Direct runtime control is reachable only from Agent Manager. This policy
# selects cold and pooled CMA Pods. Claimed warm Pods keep the template's
# control-plane label and upstream tracking label; their controller does not
# retain runtime-name. The tracking label excludes retained OpenSandbox Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cma-agent-sandbox-control
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  podSelector:
    matchLabels:
      cma/control-plane: chrono-bot-prod
    matchExpressions:
      - key: agents.x-k8s.io/sandbox-name-hash
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cma-agent-manager
      ports:
        - protocol: TCP
          port: 9090
