apiVersion: v1
kind: Service
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cma-agent-manager
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Existing sealed ChannelPointers pin this exact Service DNS authority. Keep
# their origin valid while the canonical workload and Service use the new name.
# This alias serves cluster traffic only. Do not attach a standalone NEG: an
# unused alias NEG can satisfy the shared Pod readiness gate without checking
# the canonical public backend. Remove stale NEG annotations during migration.
apiVersion: v1
kind: Service
metadata:
  name: cma-api
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cma-agent-manager
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
