# Public routing for the control plane.
#
# The gateway itself is shared infrastructure and lives outside this
# repository; these routes attach to it and are CMA's own, which is why
# they are declared here. They were previously applied by hand, so the address
# the service answers on had no source of truth and could drift silently from
# the origin and redirect URI the code is configured with.
#
# The hostname is deliberately not the name of an agent kernel. Layer 3 treats
# kernels as interchangeable, so a public URL naming one would be wrong the
# first time a session runs another.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  parentRefs:
    - name: chronoai-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - bot-api.chrono-ai.fun
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: cma-agent-manager
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  parentRefs:
    - name: chronoai-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - bot.chrono-ai.fun
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/event-gateway
      backendRefs:
        - group: ""
          kind: Service
          name: cma-agent-manager
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/image-manager
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: cma-image-manager
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/agent-manager
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - group: ""
          kind: Service
          name: cma-agent-manager
          port: 80
          weight: 1
    # /api/v1/telemetry/browser follows this public API prefix: anonymous,
    # <=256-byte fixed categories, in-process budget; never expose /metrics here.
    # Keep the browser on one origin without placing the web pod in the API's
    # trusted-proxy chain. API, auth, and exact discovery matches win over `/`,
    # so GFE forwards the original client chain straight to the control plane.
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: Exact
            value: /openapi.json
        - path:
            type: Exact
            value: /agent-manager/openapi.json
        - path:
            type: Exact
            value: /.well-known/agent-card.json
      backendRefs:
        - group: ""
          kind: Service
          name: cma-agent-manager
          port: 80
          weight: 1
    # Image Manager remains optional; this discovery route does not enable it.
    - matches:
        - path:
            type: Exact
            value: /image-manager/openapi.json
      backendRefs:
        - group: ""
          kind: Service
          name: cma-image-manager
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: cma-web
          port: 80
          weight: 1
---
# Plain HTTP is redirected rather than served. A terminal session carries the
# owner's delegated credential, so there is no version of this worth answering
# without TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cma-http-redirect
  namespace: chrono-bot
  labels:
    app.kubernetes.io/part-of: cma
spec:
  parentRefs:
    - name: chronoai-gateway
      namespace: gateway-infra
      sectionName: http
  hostnames:
    - bot.chrono-ai.fun
    - bot-api.chrono-ai.fun
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Additive Nyxid entry. Keep the old routes during the staged domain migration.
# Public URL, OAuth and callback cutover: docs/CMA_Domain_Migration.md.
apiVersion: gateway.networking.k8s.io/v1
