# How the OpenSandbox API key reaches the control plane.
#
# The key is read straight from the cloud project's secret manager and mounted
# as a file. No Kubernetes Secret ever holds it, so it cannot be read back out
# of the cluster, and rotation happens at the source without a redeploy.
#
# The resource named below is chrono-bot's OWN key. Several namespaces define a
# provider class under this same name over a different underlying secret — the
# neighbouring product's key among them — so the name alone does not identify
# what gets delivered. Any change to resourceName is a change of identity and
# should be reviewed as one.
#
# Reading it also requires an IAM grant to the service account in
# serviceaccount.yaml. That grant lives in the cloud project and cannot be
# expressed here; without it this class resolves and the mount still fails.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: opensandbox-api-key
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: chrono-bot-api
    app.kubernetes.io/part-of: chrono-bot
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/example-project-02/secrets/opensandbox-chrono-bot-api-key/versions/latest"
        path: "opensandbox-api-key"
