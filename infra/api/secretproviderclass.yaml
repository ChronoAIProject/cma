# How the OpenSandbox API key reaches the control plane.
#
# The key is read straight from the cloud project's secret manager and mounted
# as a file. No Kubernetes Secret ever holds it, so it cannot be read back out
# of the cluster. Source rotation may refresh the projected file, but CMA reads
# provider keys only at startup; adopting a new value requires a controlled pod
# restart after the projection has been verified.
#
# The resource named below is CMA's OWN key. Several namespaces define provider
# classes over different underlying secrets — the neighbouring product's key
# among them — so the class's namespace and resource path are both part of its
# identity. Any change to resourceName should be reviewed as one.
#
# Reading it also requires an IAM grant to the service account in
# serviceaccount.yaml. That grant lives in the cloud project and cannot be
# expressed here; without it this class resolves and the mount still fails.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cma-opensandbox-api-key
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-api
    app.kubernetes.io/part-of: cma
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/chronoai-501608/secrets/opensandbox-chrono-bot-api-key/versions/latest"
        path: "opensandbox-api-key"
