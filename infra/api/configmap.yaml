apiVersion: v1
kind: ConfigMap
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
data:
  # Measured reporting is independent of allocated billing. Enable only after
  # monitoring service-account GET reachability and reader/schema readiness.
  CHRONO_USAGE_METRICS_ENABLED: "false"
  # Per-server reporting pool, 1..16. Independent of the general Mongo pool.
  CHRONO_USAGE_REPORTING_MONGO_MAX_POOL_SIZE: "4"
  CHRONO_USAGE_METRICS_CLUSTER: "example-cluster-01"
  # Empty selects the fixed monitoring/tenant-0 Kubernetes API proxy GET route.
  # An internal read gateway may instead provide /select/0/prometheus/.
  CHRONO_USAGE_METRICS_URL: ""
  CHRONO_USAGE_METRICS_WORKERS: "2"
  CHRONO_USAGE_METRICS_QUEUE: "8"
  CHRONO_USAGE_METRICS_SOURCE_CALLS: "2"
  CHRONO_USAGE_METRICS_SOURCE_SECONDS: "5"
  CHRONO_USAGE_METRICS_REPORT_SECONDS: "60"
  CHRONO_USAGE_METRICS_REPORT_MIB: "256"
  CHRONO_USAGE_METRICS_TENANT_MIB: "512"
  CHRONO_USAGE_METRICS_GLOBAL_MIB: "2048"
  # Full provider API base, verified against NyxID's existing Lago installation.
  # Recording remains active even while billing delivery is disabled.
  CHRONO_USAGE_BILLING_ENABLED: "false"
  CHRONO_USAGE_LAGO_API_URL: ""
  CHRONO_USAGE_LAGO_PLAN_CODE: "starter"
  # NyxID prepaid Sandbox lifecycle admission is independently gated and off
  # until the producer contract is deployed and acceptance-tested.
  CHRONO_NYXID_SANDBOX_BILLING_ENABLED: "false"
  CHRONO_NYXID_SANDBOX_BILLING_BASE_URL: ""
  CHRONO_NYXID_SANDBOX_BILLING_PRODUCER_ID: ""
  # Names an out-of-band Secret/env key; the credential value is never checked in.
  CHRONO_NYXID_SANDBOX_BILLING_CREDENTIAL_REF: ""
  # Set both refs to select renewable OAuth credentials; values live in the Secret.
  CHRONO_NYXID_SANDBOX_BILLING_CLIENT_ID_REF: ""
  CHRONO_NYXID_SANDBOX_BILLING_CLIENT_SECRET_REF: ""
  CHRONO_SANDBOX_PROVIDER: "agent-sandbox"
  CHRONO_RETAIN_OPENSANDBOX: "true"
  CHRONO_AGENT_SANDBOX_ENABLED: "true"
  # Both exact production image pools passed runtime and desktop acceptance.
  # Prepared hierarchies hold native Claims/PVCs but receive no owner key or prompt.
  CHRONO_NATIVE_PREPARED_TARGET: "2"
  # Keep separate prepared capacity for Omarchy with Codex.
  CHRONO_NATIVE_MACHINE_PREPARED_TARGET: "2"
  # Verified remote microvm path; exec reaches the guest's loopback runtime.
  # Native Pod lifecycle and persistent homes remain controller-owned.
  CHRONO_AGENT_SANDBOX_RUNTIME_TRANSPORT: "kubernetes-exec"
  CHRONO_AGENT_SANDBOX_CONTROL_KEY_FILE: "/var/run/cma-agent-sandbox/control-key"
  # Remote example-registry-01 admission requires microvm or gvisor; use its existing class.
  CHRONO_AGENT_SANDBOX_RUNTIME_CLASS: "microvm"
  # Existing remote runtime identity; Pod templates disable API token automount.
  CHRONO_AGENT_SANDBOX_SERVICE_ACCOUNT: "default"
  CHRONO_AGENT_SANDBOX_IMAGE_PULL_SECRETS: ""
  # Operator-reviewed ingress AND egress JSON for controller-managed Template policy.
  # Empty preserves controller defaults; fill only after actual network canary proof.
  CHRONO_AGENT_SANDBOX_TEMPLATE_NETWORK_POLICY: ""
  # Deployment env refs take the API and namespace from example-namespace-02.
  # Metadata mode uses the annotated KSA's short-lived Google identity; the
  # projected CA verifies the remote cluster, and no static token is mounted.
  CHRONO_AGENT_SANDBOX_NAMESPACE: ""
  CHRONO_AGENT_SANDBOX_API_SERVER: ""
  CHRONO_AGENT_SANDBOX_AUTH_MODE: "google-metadata"
  CHRONO_AGENT_SANDBOX_CA_FILE: "/etc/example-registry-01/ca.crt"
  CHRONO_AGENT_SANDBOX_TOKEN_FILE: ""
  # Native CRDs own empty VCT PVCs; the runtime image initializes their layout.
  # Existing hyperdisk class supports the microvm pool's N4 nodes; keep 64 GiB.
  # Empty-home RWOP allocation and same-PVC suspend/resume passed in production.
  # Retained historical allocations keep their persisted policy and authority.
  CHRONO_AGENT_SANDBOX_HOME_MODE: "native_vct_full_home_v2"
  CHRONO_AGENT_SANDBOX_HOME_STORAGE_CLASS: "home-a"
  CHRONO_AGENT_SANDBOX_HOME_CAPACITY_GIB: "64"
  CHRONO_AGENT_SANDBOX_HOME_TEMPLATE: ""
  CHRONO_AGENT_SANDBOX_HOME_TEMPLATE_UID: ""
  # Preserve the active production Bridge gates recorded on 2026-09-22.
  # Additional gates still require their own canary verification.
  # New file admissions only; supporting readers/workers must precede enablement.
  CHRONO_V2_UI_TRANSPORT_ENABLED: "true"
  CHRONO_AGENT_LOG_ADMISSION_AGENTS: ""
  # Independent pending-approval reader; also requires trusted cohort membership.
  CHRONO_AGENT_APPROVAL_BOUNDED_READS_ENABLED: "false"
  # Qualify ordinary CloseProcess retry publication separately from fleet admission.
  CHRONO_AGENT_CLOSE_RETRY_BOUNDED_ENABLED: "false"
  CHRONO_AGENT_PARENT_NOT_READY_PACING_ENABLED: "false"
  # Independent fleet mode: 0 disables; stable percentage stages require rollout.
  CHRONO_AGENT_LOG_FLEET_PERCENT: "0"
  # Qualify title reads separately after the admission/public-window cohort.
  CHRONO_AGENT_TITLE_BOUNDED_READS_ENABLED: "false"
  # Response projection uses a proven target-turn window; independent rollout.
  CHRONO_AGENT_RESPONSE_BOUNDED_READS_ENABLED: "false"
  CHRONO_AGENT_USAGE_BOUNDED_READS_ENABLED: "false"
  CHRONO_AGENT_TRANSCRIPT_BOUNDED_READS_ENABLED: "false"
  CHRONO_RESPONSE_PAGED_EVENTS_ENABLED: "false"
  CHRONO_TASK_EXPERIENCE_POLICY: '{"mode":"disabled","accounts":[],"capabilities":[]}'
  # Independent placement rollout selections; these do not attest continuity.
  # Admission-only protocol selector. Requires a compatible worker/rollback floor.
  CHRONO_TRIGGER_COMMAND_ADMISSION_ENABLED: "false"
  # Saving any nonempty budget policy requires compatible serving/rollback readers.
  # Release operators enable writes only after establishing that reader baseline.
  CHRONO_MODEL_BUDGET_WRITES_ENABLED: "false"
  # Request model policies need a later reader baseline even if foundation writes are on.
  CHRONO_MODEL_REQUEST_BUDGET_WRITES_ENABLED: "false"
  # Bounded policy pinned before each Sandbox/Workspace provisioning effect.
  CHRONO_INSTALL_COMMAND_TIMEOUT_SECONDS: "600"
  CHRONO_INSTALL_TOTAL_TIMEOUT_SECONDS: "1800"
  CHRONO_CLONE_DEPTH: "50"
  CHRONO_SERVER_BIND: "0.0.0.0:8080"
  # Production must remain provider-authenticated. The trusted identity below
  # is read only in explicit local-development trusted mode.
  CHRONO_AUTH_MODE: "provider"
  # Resource server audience for service-scoped NyxID agent key introspection.
  CHRONO_NYXID_SERVICE_ID: "b48c8aff-02a6-43b6-87b5-98d3e66c1a06"
  # Existing NyxID signed service identity; enable the CMA catalog connection's
  # jwt propagation with a stable service audience across browser-domain changes.
  CHRONO_NYXID_PROXY_ENABLED: "true"
  CHRONO_NYXID_PROXY_ISSUER: "https://nyx-api.chrono-ai.fun"
  CHRONO_NYXID_PROXY_JWKS_URL: "https://nyx-api.chrono-ai.fun/.well-known/jwks.json"
  # Retain existing NyxID per-user connection audiences during the browser migration.
  CHRONO_NYXID_PROXY_AUDIENCE: "https://bot.chrono-ai.fun"
  # Request-bound read proofs require coordinated NyxID issuance activation.
  # Existing browser and ordinary API-key authentication do not use this flag.
  CHRONO_NYXID_RESOURCE_REQUEST_ENABLED: "false"
  CHRONO_TRUSTED_SUBJECT: "local-developer"
  # Browser auth callbacks and host-only cookies use the app origin; the
  # Gateway routes API/auth/discovery paths directly to this control plane.
  CHRONO_SERVER_PUBLIC_URL: "https://cma.nyxid.ai"
  # Production canonical endpoint migration, revision 2, for the reviewed cohort.
  # Admission remains idle-only and preserves each original conversation and key.
  CHRONO_AGENT_ACCESS_TRANSPORT_MIGRATION: |-
    {
      "revision": 2,
      "origin": "https://cma.nyxid.ai",
      "agents": [
        "agt_0a51a71d6472407ba348d95667b398d7",
        "agt_11ff774135ef4cae8c616c217970679f",
        "agt_25cc51b830394cb9bec4c903b4ebf44f",
        "agt_2c794569d3da4637a268b7d5b6715b86",
        "agt_2eab281da9514c30b5f9e8ebc2a6dc22",
        "agt_2ebe77cd820846029e2d2d2b4e4ec382",
        "agt_31ec2a5057bb48229687f0f2c909bfeb",
        "agt_3b309a2ff542453986c0c0751bb2ac02",
        "agt_49a4fceab4a14b4ea43a61cfaf4092a0",
        "agt_4a1b83d7d96b42239f53bce21f70ad2a",
        "agt_4ebc258f15c44fa5809f475b74ec4621",
        "agt_58169ac362804179ab66dc31e3c0aba9",
        "agt_5d5ca5d23cda4adfbcee159ce8bc3fa7",
        "agt_6a07684f2abc401d8658ac52abb4702c",
        "agt_7d85da52a2864950a029ec4358a41ab2",
        "agt_88faf0ed40dc473d81953bf269659a80",
        "agt_8b84e9bd01764311822bdae7c57255e3",
        "agt_90c5559ba2f44d3e87541a80c849b37b",
        "agt_90e02debb7a64ec88e06cc1ad46f871c",
        "agt_948864dfe0884562994c1683fc42dab2",
        "agt_a22c107abf1d42188fc5b6367952e40d",
        "agt_a343480ecaf44847a12cda06d1c9d279",
        "agt_aa59f8bf671d416eb4ff22a66e7c6054",
        "agt_c1e6ff80871c494c84f2ae7129f501c9",
        "agt_c64f64774bfa4fc39c2cce83fa9b2344",
        "agt_d7c5c21ce89144cc8d310a0ed0b67122",
        "agt_f1f123e65941453f9302d3b1d2c71548"
      ]
    }
  # Preserve the enabled relay across ordinary ConfigMap deployments.
  # Readers supporting provider_tool_relays must be serving before activation.
  CHRONO_PROVIDER_TOOL_RELAY: |-
    {
      "bindings": [
        "bnd_214077f7250c4fb3988a846b2abf4ef9",
        "bnd_378dcd9c84b94ee28fe8fc6144406280",
        "bnd_4d903b4a1f164fe7b9718b176227bb69",
        "bnd_77fe02e529054f0086ce5d50a63bfe47",
        "bnd_8bb7a632a28a44488f0cc00b5c1315ec",
        "bnd_9b809bd2011f43a1b448f57b294355b7",
        "bnd_bec6a57b32554c6eaa3532820d53e39e",
        "bnd_d064c508e2b0445c94e96dd62dae527e",
        "bnd_f77188cb5dbe4c28afeb93ac0aaca29c"
      ],
      "from_endpoint": "https://bot-gateway.chrono-ai.fun/mcp",
      "upstream": "https://cma.nyxid.ai/event-gateway/mcp"
    }
  # Historical signing authority validates retained keys without contacting this host.
  CHRONO_AGENT_ACCESS_RETAINED_ORIGINS: "https://bot.chrono-ai.fun"
  # Agent Manager resolves selected immutable versions through the separate
  # Image Manager service using the caller's delegated NyxID credential.
  CHRONO_IMAGE_MANAGER_BASE_URL: "http://cma-image-manager"
  CHRONO_SERVER_CORS_ORIGIN: "https://bot.chrono-ai.fun,https://cma.nyxid.ai"
  # Continuously refilled process-local budgets, also the maximum burst.
  # Admission protects authentication work; health has a separate budget.
  CHRONO_SERVER_RATE_ADMISSION_PER_MINUTE: "6000"
  CHRONO_SERVER_RATE_HEALTH_PER_MINUTE: "120"
  CHRONO_SERVER_RATE_DEFAULT_PER_MINUTE: "600"
  CHRONO_SERVER_RATE_CREATE_PER_MINUTE: "10"
  CHRONO_SERVER_RATE_INPUT_PER_MINUTE: "120"
  # Separate policy activation after exact-route classification review.
  CHRONO_SERVER_RATE_RESPONSE_INPUT_ENABLED: "false"
  # GFE appends upstream then forwarding-rule addresses. Trust the chain only
  # from an official GFE TCP peer and skip its rightmost load-balancer token.
  CHRONO_SERVER_TRUSTED_PROXY_CIDRS: "35.191.0.0/16,130.211.0.0/22,2600:2d00:1:1::/64"
  CHRONO_SERVER_TRUSTED_PROXY_HOPS: "1"
  # Advance past Cloudflare only for an exact reviewed range and matching
  # CF-Connecting-IP. Worker/Pseudo-IPv4/malformed/direct-origin requests retain
  # the GFE-observed key. This complete build-pinned official set was retrieved
  # from https://www.cloudflare.com/ips-v4 and /ips-v6 on 2026-08-29.
  # Compare both directions before release: additions degrade to edge sharing;
  # removals/reassignments are security alerts requiring code/config review.
  CHRONO_SERVER_CLOUDFLARE_PROXY_CIDRS: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
  CHRONO_NYXID_BASE_URL: "https://nyx-api.chrono-ai.fun"
  CHRONO_NYXID_PUBLIC_URL: "https://nyxid.ai"
  # Keep generation replacement disabled until compatible serving/rollback readers are deployed.
  CHRONO_CMAEG_BINDING_PREPARATION_ENABLED: "false"
  CHRONO_CMAEG_BASE_URL: "http://cma-event-gateway"
  CHRONO_CMAEG_PUBLIC_URL: "https://bot-gateway.chrono-ai.fun"
  CHRONO_CMAEG_PUBLIC_API_URL: "https://cma.nyxid.ai/event-gateway"
  # Deploy compatibility readers before switching the advertised public API base.
  CHRONO_CMAEG_PUBLIC_API_ALIASES: "https://bot.chrono-ai.fun/event-gateway"
  CHRONO_BOT_FATHER_BINDING_ID: "bnd_77fe02e529054f0086ce5d50a63bfe47"
  CHRONO_BOT_FATHER_TELEGRAM_USERNAME: "CMA_Trureturing_Bot"
  # Provider-issued OAuth client identifier, not a secret or a chosen name.
  CHRONO_NYXID_CLIENT_ID: "c0cd33d2-27ba-4b8d-b38e-562364fadb72"
  # Must match the database authorized by the Secret's connection URI.
  CHRONO_MONGODB_DATABASE: "chrono-bot"
  # Shared database deployment; each service retains its own schema and collections.
  CHRONO_MONGODB_AUTHORITY_MODE: "shared-schema"
  # Agent Manager also owns model_budget_reservations. Isolated deployments must
  # include it in scoped schema/runtime grants before this image is activated.
  # Private model_budget settings have no manifest defaults; keep general rollout
  # disabled pending request-level enforcement. See CMA_Model_Budget_Controls.md.
  # CMA auxiliary requests also require privately approved request_models bounds;
  # no model/rate is enabled by default. See CMA_Model_Request_Reservations.md.
  # Admin Operations settings supply all platform/owner/turn controls, including
  # explicit period, thresholds, reserve, lag, call limit and IANA day timezone.
  # TTL applies to existing Activity records; lowering it can remove history.
  CHRONO_ACTIVITY_RETENTION_DAYS: "90"
  # Canonical platform origin for scoped runtime service proxying.
  CHRONO_PLATFORM_BASE_URL: "https://nyx-api.chrono-ai.fun"
  # Durable personal documents use the existing S3-backed storage service.
  # Objects live only under documents/<owner-hash>/<document-id>/<source-hash>.md.
  # Activate in a later train only after compatible readers are the rollback floor.
  CHRONO_DOCUMENT_REVOCATION_RESERVE_ENABLED: "false"
  # Off until capacity-owner headroom and all admission writers are verified.
  CHRONO_SANDBOX_GLOBAL_LIMIT: "0"
  CHRONO_DOCUMENT_BUCKET: "chrono-platform-bot"
  CHRONO_STORAGE_CLIENT_ID: "sa_a91005afad2304c1b0023b21"
  # Agent model calls use the scoped AgentKey through this platform proxy.
  CHRONO_UPSTREAM_BASE_URL: "https://nyx-api.chrono-ai.fun/api/v1/proxy/s/chrono-llm-public"
  CHRONO_UPSTREAM_WIRE_API: "responses"
  # In-cluster provider authority and the namespace granted by its scoped Role.
  CHRONO_SANDBOX_BASE_URL: "http://example-host-02.example-namespace.svc.cluster.local"
  CHRONO_SANDBOX_NAMESPACE: "chrono-bot"
  # Seed UID is captured only after the credential-free initializer succeeds.
  # Existing live ephemeral runtimes keep their binding until normal revival.
  CHRONO_SANDBOX_HOME_STORAGE_CLASS: "cma-home-v1"
  CHRONO_SANDBOX_HOME_CAPACITY_GIB: "64"
  CHRONO_SANDBOX_HOME_TEMPLATE: "cma-home-seed-v1"
  CHRONO_SANDBOX_HOME_TEMPLATE_UID: "e50503f6-9498-4105-a81a-5d9c34ffa810"
  # Single latest released runtime for new allocations, managed resume and
  # manual/daily updates. Prewarm this exact image before release promotion.
  # Active work finishes before an admitted update; deployment never rotates it.
  # API/Web rollback retains this runtime pointer and the original user PVCs.
  CHRONO_SANDBOX_IMAGE: "asia-southeast1-docker.pkg.dev/example-project-02/example-registry-01/cma-runtime@sha256:e1d2accb555dbfe92eee9e736a968e50125f08c64c21247a6b590117d95b7c1f"
  # Verified Omarchy target; production proved device-free graphics, native/manual
  # control and retained-home revival. See docs/Omarchy_Runtime_Prototype.md.
  CHRONO_MACHINE_SANDBOX_IMAGE: "asia-southeast1-docker.pkg.dev/example-project-02/example-registry-01/cma-runtime-omarchy@sha256:7eae22a35310f291454d170e489e5f0a9dd9fa6e78a45873b9d09fd179a7863b"
  # Keep two unclaimed native CMA runtimes ready for immediate SandboxClaim
  # admission. The target is persisted by Agent Manager and reconciled through
  # SandboxTemplate/SandboxWarmPool/SandboxClaim CRDs only.
  CHRONO_NATIVE_WARM_POOL_TARGET: "2"
  # Independent machine capacity; promote with the verified Omarchy image pin.
  CHRONO_NATIVE_MACHINE_WARM_POOL_TARGET: "2"
  # Native warm pools are managed by immutable image/resources/home policy.
  # Agent Manager persists the default target before serving and reconciles it
  # through SandboxTemplate/SandboxWarmPool/SandboxClaim CRDs. Retained pools
  # and claimed Sandboxes keep their original policy across image rollouts.
  # Seed system Profiles only while an operator-selected default still names one.
  # Custom published defaults prevent removed system catalogue entries returning.
  CHRONO_SANDBOX_CPU: "1"
  CHRONO_SANDBOX_MEMORY: "1Gi"
  # New Agent Manager environments and their native warm pool. Retained system
  # Profiles above and existing Sandbox reservations keep their recorded values.
  CHRONO_AGENT_MANAGER_SANDBOX_CPU: "2"
  CHRONO_AGENT_MANAGER_SANDBOX_MEMORY: "8Gi"
  CHRONO_DESKTOP_VERIFIED_RUNTIME_IMAGE: ""
  CHRONO_DEFAULT_AGENT_MODEL: "gpt-6"
  CHRONO_DEFAULT_AGENT_EFFORT: "high"
  # Read-only Secret Manager projection, resolved once at startup.
  CHRONO_SANDBOX_API_KEY_FILE: "/var/secrets/opensandbox-api-key"
  # Provider ownership label. Other control planes must use distinct values;
  # untagged or foreign runtime resources are never adopted or deleted.
  CHRONO_DEPLOYMENT_ID: "chrono-bot-prod"
  # AgentKey service floor. Public skill material is served by ornn-api.
  CHRONO_BASELINE_SERVICES: "chrono-llm-public,ornn-api"
  RUST_LOG: "info"
