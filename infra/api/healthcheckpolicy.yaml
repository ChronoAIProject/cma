# What the load balancer probes to decide the control plane is healthy.
#
# Without this the balancer probes "/", which this service does not serve — it
# answers 404 there, quite correctly — so every backend is marked unhealthy and
# the gateway returns 503 while the pods are perfectly fine. That failure is
# unusually misleading: the deployment is Ready, the endpoints are Ready, the
# routes are Accepted, and the service is still unreachable from outside.
#
# The Gateway probes readiness directly. GKE network endpoint groups can keep a
# Kubernetes-unready pod attached, so a liveness-only load-balancer check could
# continue routing external traffic after this instance loses its session
# store. Kubelet liveness remains process-only in deployment.yaml.
#
# The neighbouring control planes each declare one of these; CMA simply
# lacked it.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  targetRef:
    group: ""
    kind: Service
    name: cma-agent-manager
  default:
    config:
      type: HTTP
      httpHealthCheck:
        # The container port, not the Service port: the balancer talks to pods
        # directly rather than through the Service's cluster IP.
        port: 8080
        requestPath: /ready
