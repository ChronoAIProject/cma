# What the load balancer probes to decide the control plane is healthy.
#
# Without this the balancer probes "/", which this service does not serve — it
# answers 404 there, quite correctly — so every backend is marked unhealthy and
# the gateway returns 503 while the pods are perfectly fine. That failure is
# unusually misleading: the deployment is Ready, the endpoints are Ready, the
# routes are Accepted, and the service is still unreachable from outside.
#
# The Gateway probes the cheap process liveness path. A busy but healthy process
# must stay registered while Mongo-backed readiness is waiting; otherwise a
# short pool stall ejects the only backend and produces "no healthy upstream".
# Kubelet readiness still gates the canonical endpoint and fails closed when the
# cached dependency check is stale or unavailable.
#
# The neighbouring control planes each declare one of these; CMA simply
# lacked it.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: cma-agent-manager
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-agent-manager
    app.kubernetes.io/part-of: cma
spec:
  targetRef:
    group: ""
    kind: Service
    name: cma-agent-manager
  default:
    config:
      type: HTTP
      httpHealthCheck:
        # The container port, not the Service port: the balancer talks to pods
        # directly rather than through the Service's cluster IP.
        port: 8080
        requestPath: /livez
        # HealthCheckPolicy exposes the provider's bounded edge probe budget;
        # its CRD does not accept interval, timeout, or threshold overrides.
        # The kubelet liveness probe below has an explicit two-second timeout
        # and three-failure budget so local process health remains bounded too.
