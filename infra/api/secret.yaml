apiVersion: v1
kind: Secret
metadata:
  name: cma-api
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-api
    app.kubernetes.io/part-of: cma
type: Opaque
stringData: {}
# Keys required by api/, populated out of band. Never valued in this repository.
#
#   CHRONO_NYXID_CLIENT_SECRET   OAuth client secret for the NyxID broker client
#   CHRONO_MONGODB_URI           MongoDB connection string, including credentials.
#                                It must resolve to a replica set or mongos; a
#                                standalone cannot provide the transactions the
#                                session store requires. On the first cutover,
#                                the database role needs createCollection,
#                                renameCollectionSameDB, collMod, listCollections,
#                                find, insert, update, remove, dropCollection and
#                                createIndex on CHRONO_MONGODB_DATABASE. Those
#                                CRUD actions must also be allowed in transactions;
#                                insert covers the durable cutover-provenance
#                                marker. The old session collection names become
#                                read-only views; do not replace them with writable
#                                collections.
#   CHRONO_AUTH_ENCRYPTION_KEY    Standard-base64 encoding of exactly 32 random
#                                 bytes used only to encrypt recoverable auth
#                                 tokens, PKCE verifiers and provider key values
#                                 at rest. Rotating it requires an explicit data
#                                 migration; changing it alone makes existing
#                                 encrypted records unreadable and fails closed.
#   CHRONO_STORAGE_CLIENT_SECRET Secret half of this service's machine identity
#                                on the identity platform. Tokens for storing
#                                session context are minted from it and expire,
#                                so this is a credential to mint with, never a
#                                token to present. Never the OpenSandbox key and
#                                never an end user's token. Absent it, context
#                                storage stays switched off rather than failing
#                                on first write.
#   CHRONO_GITHUB_CAPABILITY_SIGNING_KEY_ID
#                                Stable identifier for the current Trigger
#                                runtime-policy signer. It must be set together
#                                with the PKCS#8 key below. Rotations retain the
#                                former public key in the ConfigMap until no
#                                runtime can still receive policy signed by it.
#   CHRONO_GITHUB_CAPABILITY_SIGNING_KEY_PKCS8
#                                Standard-base64 Ed25519 PKCS#8 private key used
#                                only by the control plane to sign short-lived
#                                Launch-scoped GitHub policy. It is never passed
#                                to a sandbox and must rotate as a signing key,
#                                not as a session credential.
#
# Neither the ordinary nor Trigger-native OpenSandbox API key belongs here.
# The checked-in Deployment currently mounts only the ordinary authority and
# keeps the Trigger tuple empty. Activation must add a distinct read-only CSI
# projection named by CHRONO_TRIGGER_SANDBOX_API_KEY_FILE, backed by its own
# SecretProviderClass and narrowly scoped identity; it must never place either
# value in a pod spec, `kubectl describe`, or a crash dump of the process
# environment. CMA resolves configured files once at startup, so a source
# rotation takes effect only after the projection is verified and the pod is
# restarted under a controlled rollout.
#
# Sponsorship encryption, operational-HMAC, and audit-HMAC material also never
# belong in this Kubernetes Secret or in environment values. The ConfigMap
# declares only CHRONO_SPONSORSHIP_ENCRYPTION_KEYRING_FILE,
# CHRONO_SPONSORSHIP_OPERATIONAL_KEYRING_FILE, and
# CHRONO_SPONSORSHIP_AUDIT_HMAC_KEY_FILE, all empty while sponsorship is
# dormant. Activation requires three distinct read-only file projections
# backed by separately reviewed Secret Manager resources and IAM; no such
# resources are named by the checked-in manifests today.
