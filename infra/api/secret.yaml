apiVersion: v1
kind: Secret
metadata:
  name: cma-api
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-api
    app.kubernetes.io/part-of: cma
type: Opaque
stringData: {}
# Keys required by api/, populated out of band. Never valued in this repository.
#
#   CHRONO_NYXID_CLIENT_SECRET   OAuth client secret for the NyxID broker client.
#   CHRONO_MONGODB_URI           MongoDB credentials for a replica set or mongos.
#                                Startup and mutations require transactions,
#                                majority reads/writes, collection validators,
#                                and indexes in CHRONO_MONGODB_DATABASE.
#                                This is a clean-schema launch; no legacy
#                                collection migration or cutover flag is read.
#   CHRONO_AUTH_ENCRYPTION_KEY    Standard-base64 encoding of exactly 32 random
#                                bytes for recoverable auth material at rest.
#                                Rotation requires an explicit data migration;
#                                replacing it alone makes old records unreadable.
#   CHRONO_STORAGE_CLIENT_SECRET Secret half of CMA's storage machine identity.
#                                Used with CHRONO_STORAGE_CLIENT_ID to mint
#                                short-lived platform tokens for the existing
#                                CHRONO_CHECKPOINT_BUCKET. Required at startup;
#                                never an AgentKey or the OpenSandbox API key.
#
# The OpenSandbox API key is not an environment variable or a Kubernetes
# Secret value here. CHRONO_SANDBOX_API_KEY_FILE names the separate read-only
# CSI projection backed by the narrowly scoped SecretProviderClass. CMA reads
# the file once at startup; verify a rotated projection before a controlled
# restart. Never expose either credential class in manifests or process dumps.

---
# Set data.control-key out of band before enabling agent-sandbox. The dedicated
# signing key is retained for existing runtimes across control-plane restarts.
apiVersion: v1
kind: Secret
metadata:
  name: cma-agent-sandbox-control
  namespace: chrono-bot
type: Opaque
