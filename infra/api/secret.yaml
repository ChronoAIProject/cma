apiVersion: v1
kind: Secret
metadata:
  name: chrono-bot-api
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: chrono-bot-api
    app.kubernetes.io/part-of: chrono-bot
type: Opaque
stringData: {}
# Keys required by api/, populated out of band. Never valued in this repository.
#
#   CHRONO_NYXID_CLIENT_SECRET   OAuth client secret for the NyxID broker client
#   CHRONO_NYXID_WEBHOOK_SECRET  HMAC key verifying NyxID revocation webhooks
#   CHRONO_MONGODB_URI           MongoDB connection string, including credentials
#
# The OpenSandbox API key is deliberately NOT here. It is delivered as a mounted
# file at CHRONO_SANDBOX_API_KEY_FILE rather than an environment variable, so it
# never appears in a pod spec, a `kubectl describe`, or a crash dump of the
# process environment. See infra/api/deployment.yaml for the volume.
