apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
