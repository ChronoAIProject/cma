apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        chrono.ai/goal-build: "goal-20261015-5bf5098f"
        cma.chronoai.dev/build-mode: "local-production-test"
        cma.chronoai.dev/candidate: "5bf5098f8ac828c17c57a0b039d72af1a2dc1ffb"
