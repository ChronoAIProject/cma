apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "587b55b56a0765bec7e8c8df6614ad869f2f7850"
        cma.chronoai.dev/ci-artifact: "12268028279"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "5c7a0dba0d10b6327b8bb0dd3547f5a4a59ef39e"
        cma.chronoai.dev/ci-publication-sha256: "sha256:0a7c130ccca97c95a5c514b3413e61630a5a46229bd50f0cce6e6b686f35b01c"
        cma.chronoai.dev/ci-run: "39431220872"
        cma.chronoai.dev/image-digest: "sha256:50c3ced2c65495e22626fb0c6912a16563606336f27669bcc98fbe2fcb62409a"
        cma.chronoai.dev/image-source: "daabacde059aa455b26591f8eeff821ae4393fdd"
        cma.chronoai.dev/source-tree: "255e33efbe141a2c4a941790db1eba99f72c4cf4"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-web@sha256:50c3ced2c65495e22626fb0c6912a16563606336f27669bcc98fbe2fcb62409a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-web
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
