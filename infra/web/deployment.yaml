        cma.chronoai.dev/image-source: "fa1e3f13a2583723aadc9c1412b0f21177e58f06"
        cma.chronoai.dev/local-build: "goal-20261015-fa1e3f13"
        cma.chronoai.dev/observed-image-provenance-sha256: "957d3f0a98c7715b4d7ce12aa621275328a3239a83891a61e34fb9423c7dda2e"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
