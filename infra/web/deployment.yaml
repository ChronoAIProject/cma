apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "0922e36fc6401e4a7561b6d00d2013c101566b09"
        cma.chronoai.dev/ci-artifact: "12177560261"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "59e8049117b31795aecb6fa6cbca79b17cdcb88c"
        cma.chronoai.dev/ci-publication-sha256: "sha256:10faf85a6985349e2805916a9e847b7f87453a106e807d2d338284f5d0f4db5a"
        cma.chronoai.dev/ci-run: "39230836093"
        cma.chronoai.dev/image-digest: "sha256:81b4ec834cdf420bae838577809017bc2843bd71d303ca6bd3960c090ed8fa27"
        cma.chronoai.dev/image-source: "45755edf40eab6f8f2ce8253f42eeba873235f6e"
        cma.chronoai.dev/source-tree: "06bc6c0d438a59bca892966c3a40ef0ca83f351f"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/example-project-01/example-registry-02/cma-web@sha256:81b4ec834cdf420bae838577809017bc2843bd71d303ca6bd3960c090ed8fa27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-web
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
