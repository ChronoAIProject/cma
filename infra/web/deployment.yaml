apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "65c5da162cdab49a82aa967304bd5cebbf01b6ea"
        cma.chronoai.dev/ci-artifact: "12180762967"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "65c5da162cdab49a82aa967304bd5cebbf01b6ea"
        cma.chronoai.dev/ci-publication-sha256: "sha256:04733c30a37ce6a553755957fae22c0cd0298a724d7d45ea6e50843f8f11eb7c"
        cma.chronoai.dev/ci-run: "39240312924"
        cma.chronoai.dev/image-digest: "sha256:6c75ebcf827929568a58a4115c9cab66ea87aa2386a3b74b64f1b197b6168a2b"
        cma.chronoai.dev/image-source: "a59a2e86cb418f1959aa98a540f934d1b806220d"
        cma.chronoai.dev/source-tree: "3f84bf93d9017f1800074c02cdb13f77474d2ec8"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-web@sha256:6c75ebcf827929568a58a4115c9cab66ea87aa2386a3b74b64f1b197b6168a2b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-web
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
