apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "60a81ec0100cd552aec6fffb138c6ea3dcf42195"
        cma.chronoai.dev/ci-artifact: "12276579572"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "3d3d4925e9eec0b09484a433aa355b89b986d5ec"
        cma.chronoai.dev/ci-publication-sha256: "sha256:f1e7d7259e0a3eadb781d8bf580115699f210daa4f4e31647d22f4d23d367c51"
        cma.chronoai.dev/ci-run: "39448356610"
        cma.chronoai.dev/image-digest: "sha256:6e435fcd7e4157523e1dd23a713da74d10a380bce30d7f9f9be0a0810e4ccdc3"
        cma.chronoai.dev/image-source: "f828dfe96140f592dd71ab843c5b9d8a1e2f4433"
        cma.chronoai.dev/source-tree: "42e71d3f1d69767857737987d8e698374d00c840"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-web@sha256:6e435fcd7e4157523e1dd23a713da74d10a380bce30d7f9f9be0a0810e4ccdc3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-web
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
