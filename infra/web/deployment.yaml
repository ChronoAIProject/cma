apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        cma.chronoai.dev/candidate: "04ccbd6a3adb9ec2c2f46ab9d2b01ae93c6f7b9f"
        cma.chronoai.dev/image-source: "993591d35f937e26cdc3c2756a596dc4132e6282"
        cma.chronoai.dev/ci-run: "38539408542"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/example-project-01/example-registry-02/cma-web@sha256:38f1c94685325465e4391b8aa0b1e9bd78cfae7367b8de921e6fddd6d103e43c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-web
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
