          command: ["/bin/sh", "-c"]
          args:
            - >-
              for file in /usr/share/nginx/html/assets/*; do
                [ -e "$file" ] || continue;
                name="${file##*/}";
                [ -e "/compat/assets/$name" ] || cp -R "$file" "/compat/assets/$name";
              done
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: web-assets-compat
              mountPath: /compat
        - name: web-assets-legacy
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-web@sha256:50c3ced2c65495e22626fb0c6912a16563606336f27669bcc98fbe2fcb62409a
          command: ["/bin/sh", "-c"]
          args:
            - >-
              for file in /usr/share/nginx/html/assets/*; do
                [ -e "$file" ] || continue;
                name="${file##*/}";
                [ -e "/compat/assets/$name" ] || cp -R "$file" "/compat/assets/$name";
              done
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: web-assets-compat
              mountPath: /compat
      containers:
        - name: web
