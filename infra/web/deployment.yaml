apiVersion: apps/v1
kind: Deployment
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cma-web
  template:
    metadata:
      annotations:
        cma.chronoai.dev/build-mode: "github-ci-artifact"
        cma.chronoai.dev/candidate: "748593eb9f8e34d095d249a49988c3b3c8b213aa"
        cma.chronoai.dev/ci-artifact: "12026843338"
        cma.chronoai.dev/ci-attempt: "1"
        cma.chronoai.dev/ci-head: "fd5bd7fdb155c019644bd257e61192167f5cbf0c"
        cma.chronoai.dev/ci-publication-sha256: "sha256:e1b7d24f4df356258a9ebffc0f16b989a8cda21f138cb762936d7dbf39da20e9"
        cma.chronoai.dev/ci-run: "38855337933"
        cma.chronoai.dev/image-digest: "sha256:e6f644310848f1a14fcdb6945a682f8b28b6189a1cb1668e144d8e19427ff3e9"
        cma.chronoai.dev/image-source: "526aa01ced6213d5f3ef704ed368fea466f14526"
        cma.chronoai.dev/source-tree: "a0c4f67a55a01c8430049c52b2a5a06ae5fba8ee"
      labels:
        app.kubernetes.io/name: cma-web
        app.kubernetes.io/part-of: cma
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cma-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/cma-web@sha256:e6f644310848f1a14fcdb6945a682f8b28b6189a1cb1668e144d8e19427ff3e9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cma-web
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
