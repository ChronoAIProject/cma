# How long the load balancer will wait on this service.
#
# The frontend is served from here, and so is everything it calls: its bundle
# uses same-origin paths, and nginx in this image proxies `/api/` to the
# control plane with an hour's read timeout and buffering off. So the browser's
# long-lived connections are this service's connections, whatever they reach.
#
# Without this the balancer's default of 30 seconds bounds them, and it bounds
# the whole response rather than the time to first byte. Measured against
# production before this file existed: the conversation surface's event stream
# was cut at exactly 30 seconds, every time, with an HTTP/2 INTERNAL_ERROR,
# while the same stream read directly from the control plane's own hostname —
# which has had this policy all along — ran indefinitely.
#
# That failure does not look like a timeout. A client resumes on its cursor and
# reconnects, so the conversation eventually repaints and nothing is lost from
# the record; what is lost is everything that is not in the record. A message
# being typed and the agent's reasoning are liveness, deliberately never
# durable, so each cut discards them and the surface goes quiet for the length
# of the reconnect. It reads as an agent that keeps stalling.
#
# nginx allowing an hour is meaningless while the balancer cuts first, which is
# the same trap the neighbouring policy documents. The value matches it rather
# than being chosen independently, so both halves of one product behave alike.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: chrono-bot-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: chrono-bot-web
    app.kubernetes.io/part-of: chrono-bot
spec:
  targetRef:
    group: ""
    kind: Service
    name: chrono-bot-web
  default:
    timeoutSec: 660
