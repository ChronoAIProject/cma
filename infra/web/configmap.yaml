apiVersion: v1
kind: ConfigMap
metadata:
  name: chrono-bot-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: chrono-bot-web
    app.kubernetes.io/part-of: chrono-bot
data:
  # Origin of the chrono-bot control plane API. Consumed by web/ at build time.
  CHRONO_API_BASE_URL: "https://codex-api.chrono-ai.fun"
  # Origin permitted to embed the terminal surface.
  CHRONO_PUBLIC_ORIGIN: "https://codex.chrono-ai.fun"
