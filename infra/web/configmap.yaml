apiVersion: v1
kind: ConfigMap
metadata:
  name: cma-web
  namespace: chrono-bot
  labels:
    app.kubernetes.io/name: cma-web
    app.kubernetes.io/part-of: cma
data:
  # Origin of the CMA control plane API. Consumed by web/ at build time.
  CHRONO_API_BASE_URL: "https://bot-api.chrono-ai.fun"
  # Origin permitted to embed the terminal surface.
  CHRONO_PUBLIC_ORIGIN: "https://cma.nyxid.ai"
