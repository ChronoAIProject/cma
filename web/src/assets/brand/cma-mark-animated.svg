<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="CMA">
  <!--
    The animated mark. The geometry is cma-mark.svg exactly; only the timing
    lives here, so the two can never drift into being different logos.

    Animated in CSS rather than SMIL because CSS honours the visitor's motion
    preference and SMIL cannot read one. The media query below is evaluated
    against the person viewing, including when this file is loaded through an
    <img>, which is how the product uses it.

    The order is the reading order of the mark: the arc is drawn, the strokes
    beneath it follow, the lenses arrive last, and a highlight passes over them
    on a long loop. The loop is slow and low-contrast on purpose — this sits
    under a sign-in button somebody is trying to read, not in a title sequence.
  -->
  <style>
    .cma-arc,
    .cma-teeth {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: cma-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .cma-teeth {
      animation-delay: 0.72s;
      animation-duration: 0.86s;
    }

    .cma-lens {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: cma-lens-in 0.42s cubic-bezier(0.34, 1.4, 0.64, 1) 1.42s forwards;
    }

    .cma-lens--right {
      animation-delay: 1.53s;
    }

    .cma-bridge {
      opacity: 0;
      animation: cma-fade-in 0.3s linear 1.78s forwards;
    }

    /* The highlight the clip path exists for: a band crossing both lenses. */
    .cma-sweep {
      opacity: 1;
      animation: cma-sweep 4.6s cubic-bezier(0.5, 0, 0.5, 1) 2.4s infinite;
    }

    @keyframes cma-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes cma-lens-in {
      from {
        opacity: 0;
        transform: scale(0.42);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes cma-fade-in {
      to {
        opacity: 1;
      }
    }

    /*
      Off-glass at both ends, so the band is only ever seen crossing. It rests
      out of frame for most of the cycle rather than easing in place, which
      would read as a flicker.
    */
    @keyframes cma-sweep {
      0% {
        transform: translateX(-24px);
      }

      34%,
      100% {
        transform: translateX(64px);
      }
    }

    /*
      Reduced motion is the finished mark, not a slower one. Somebody who has
      asked for less movement is asking to be shown the result.
    */
    @media (prefers-reduced-motion: reduce) {
      .cma-arc,
      .cma-teeth {
        stroke-dashoffset: 0;
        animation: none;
      }

      .cma-lens,
      .cma-bridge {
        opacity: 1;
        animation: none;
      }

      .cma-sweep {
        animation: none;
        opacity: 0;
      }
    }
  </style>

  <clipPath id="lenses">
    <rect x="30" y="38" width="17" height="12" rx="4"></rect>
    <rect x="53" y="38" width="17" height="12" rx="4"></rect>
  </clipPath>

  <!--
    The highlight is a gradient rather than a flat bar. A hard-edged white
    rectangle crossing the lenses does not read as light on glass, it reads as
    a rendering fault — which is exactly how it looked when it was one.
  -->
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
  </linearGradient>

  <path class="cma-arc" pathLength="100" d="M71 71 A30 30 0 1 0 29 71" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"></path>
  <path class="cma-teeth" pathLength="100" d="M71 71 L61 59 L50 71 L39 59 L29 71" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
  <rect class="cma-lens" x="30" y="38" width="17" height="12" rx="4" fill="currentColor"></rect>
  <rect class="cma-lens cma-lens--right" x="53" y="38" width="17" height="12" rx="4" fill="currentColor"></rect>
  <path class="cma-bridge" d="M46 44 L54 44" fill="none" stroke="currentColor" stroke-width="4"></path>
  <g clip-path="url(#lenses)">
    <rect class="cma-sweep" x="14" y="34" width="11" height="20" fill="url(#sweep)" transform="skewX(-18)"></rect>
  </g>
</svg>
