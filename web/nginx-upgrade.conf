# Maps the client's Upgrade header onto the Connection header the upstream
# needs. Lives in its own file because `map` is only valid in the http context,
# which is where conf.d files are included.
#
# Without this, a proxied WebSocket handshake is forwarded as a plain request
# and the terminal never attaches.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
