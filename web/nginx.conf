# Serves the built app and proxies the control-plane API on the same origin.
#
# Same-origin is deliberate: it means the bundle needs no build-time or runtime
# knowledge of where the API lives, the browser sends the session cookie without
# any cross-site exemption, and the terminal WebSocket needs no CORS handling.

# Browser-storage retirement counters. Each exact URI maps to a complete fixed
# JSON record; no request variable is interpolated into the record. The custom
# access log below therefore contains only the three bounded metric dimensions.
# Short outcome suffixes keep keys within the production image's fixed map hash
# bucket; the fixed values retain the full outcome names consumed by metrics.
map $uri $browser_compatibility_counter {
    default "";
    /__bc/v1/appearance/canonical/ro    '{"key":"appearance","generation":"canonical","outcome":"read-ok"}';
    /__bc/v1/appearance/canonical/rb    '{"key":"appearance","generation":"canonical","outcome":"read-blocked"}';
    /__bc/v1/appearance/canonical/wo    '{"key":"appearance","generation":"canonical","outcome":"write-ok"}';
    /__bc/v1/appearance/canonical/wb    '{"key":"appearance","generation":"canonical","outcome":"write-blocked"}';
    /__bc/v1/appearance/historical-key/fu    '{"key":"appearance","generation":"historical-key","outcome":"fallback-used"}';
    /__bc/v1/terminal-theme/canonical/ro    '{"key":"terminal-theme","generation":"canonical","outcome":"read-ok"}';
    /__bc/v1/terminal-theme/canonical/rb    '{"key":"terminal-theme","generation":"canonical","outcome":"read-blocked"}';
    /__bc/v1/terminal-theme/canonical/wo    '{"key":"terminal-theme","generation":"canonical","outcome":"write-ok"}';
    /__bc/v1/terminal-theme/canonical/wb    '{"key":"terminal-theme","generation":"canonical","outcome":"write-blocked"}';
    /__bc/v1/terminal-theme/historical-key/fu    '{"key":"terminal-theme","generation":"historical-key","outcome":"fallback-used"}';
    /__bc/v1/terminal-theme/historical-id/n    '{"key":"terminal-theme","generation":"historical-id","outcome":"normalized"}';
    /__bc/v1/view-mode/canonical/ro    '{"key":"view-mode","generation":"canonical","outcome":"read-ok"}';
    /__bc/v1/view-mode/canonical/rb    '{"key":"view-mode","generation":"canonical","outcome":"read-blocked"}';
    /__bc/v1/view-mode/canonical/wo    '{"key":"view-mode","generation":"canonical","outcome":"write-ok"}';
    /__bc/v1/view-mode/canonical/wb    '{"key":"view-mode","generation":"canonical","outcome":"write-blocked"}';
    /__bc/v1/view-mode/historical-key/fu    '{"key":"view-mode","generation":"historical-key","outcome":"fallback-used"}';
    /__bc/v1/pending-turn/canonical/ro    '{"key":"pending-turn","generation":"canonical","outcome":"read-ok"}';
    /__bc/v1/pending-turn/canonical/rb    '{"key":"pending-turn","generation":"canonical","outcome":"read-blocked"}';
    /__bc/v1/pending-turn/canonical/wo    '{"key":"pending-turn","generation":"canonical","outcome":"write-ok"}';
    /__bc/v1/pending-turn/canonical/wb    '{"key":"pending-turn","generation":"canonical","outcome":"write-blocked"}';
    /__bc/v1/pending-turn/canonical/co    '{"key":"pending-turn","generation":"canonical","outcome":"clear-ok"}';
    /__bc/v1/pending-turn/canonical/cb    '{"key":"pending-turn","generation":"canonical","outcome":"clear-blocked"}';
    /__bc/v1/pending-turn/historical-key/c    '{"key":"pending-turn","generation":"historical-key","outcome":"consumed"}';
    /__bc/v1/pending-turn/historical-key/co    '{"key":"pending-turn","generation":"historical-key","outcome":"clear-ok"}';
    /__bc/v1/pending-turn/historical-key/cb    '{"key":"pending-turn","generation":"historical-key","outcome":"clear-blocked"}';
    /__bc/v1/rail-collapsed/canonical/ro    '{"key":"rail-collapsed","generation":"canonical","outcome":"read-ok"}';
    /__bc/v1/rail-collapsed/canonical/rb    '{"key":"rail-collapsed","generation":"canonical","outcome":"read-blocked"}';
    /__bc/v1/rail-collapsed/canonical/wo    '{"key":"rail-collapsed","generation":"canonical","outcome":"write-ok"}';
    /__bc/v1/rail-collapsed/canonical/wb    '{"key":"rail-collapsed","generation":"canonical","outcome":"write-blocked"}';
    /__bc/v1/rail-collapsed/historical-key/fu    '{"key":"rail-collapsed","generation":"historical-key","outcome":"fallback-used"}';
}

# escape=none is safe because the map values above are fixed JSON literals.
# Default escaping would turn their quotes into \x22 and break structured logs.
log_format browser_compatibility escape=none '$browser_compatibility_counter';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Served entirely by the public web tier. Unknown tuples, query strings,
    # non-POST methods, and declared/chunked request bodies are rejected and do
    # not enter the compatibility counter log.
    location ^~ /__bc/v1/ {
        set $browser_compatibility_loggable 0;
        if ($browser_compatibility_counter = "") {
            return 404;
        }
        if ($request_method != POST) {
            return 405;
        }
        if ($args != "") {
            return 404;
        }
        if ($content_length !~ "^(0)?$") {
            return 413;
        }
        if ($http_transfer_encoding != "") {
            return 413;
        }
        set $browser_compatibility_loggable 1;

        access_log /dev/stdout browser_compatibility if=$browser_compatibility_loggable;
        log_not_found off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Hashed assets are immutable; the entry document never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # One block for the whole API, including the terminal WebSocket.
    #
    # A separate trailing-slash location for the terminal would make nginx
    # 301-redirect the slash-less collection path, which breaks POST. The
    # upgrade headers are harmless on ordinary requests: with no Upgrade header
    # the map yields "close", so this stays a plain proxy until a handshake
    # actually asks for an upgrade.
    location /api/ {
        proxy_pass http://cma-api:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A terminal is idle far longer than a normal request.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://cma-api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Discovery documents are interfaces too. Keep them on the browser origin
    # in fallback deployments instead of letting the SPA catch their paths.
    location = /openapi.json {
        proxy_pass http://cma-api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/agent-card.json {
        proxy_pass http://cma-api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any unmatched path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
