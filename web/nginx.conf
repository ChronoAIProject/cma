# Serves the built app and proxies the control-plane API on the same origin.
#
# Same-origin is deliberate: it means the bundle needs no build-time or runtime
# knowledge of where the API lives, and the browser sends the authentication
# cookie without any cross-site exemption.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed assets are immutable; the entry document never is.
    location /assets/ {
        # Compress static bundles, including the lazily loaded tokenizer worker.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Public service discovery and protocol traffic. The exact portal page
    # /event-gateway and its browser login proxy below keep their own routes.
    location = /event-gateway/openapi.json {
        proxy_pass http://cma-event-gateway:80/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/event-gateway/(?:v1|mcp|docs)(?:/|$) {
        rewrite ^/event-gateway/(.*)$ /$1 break;
        proxy_pass http://cma-event-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    # These browser handlers retain their original path to select the exact
    # configured origin and form action. Never infer authority from Host.
    location ~ ^/event-gateway/(?:connect|legacy-console)(?:/|$) {
        proxy_pass http://cma-event-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    location /api/event-gateway/ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/image-manager/ {
        proxy_pass http://cma-image-manager:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/agent-manager/ {
        proxy_pass http://cma-agent-manager:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Stream bounded binary uploads to the API without buffering file data on web disk.
    location ~ ^/api/(?:agent-manager/)?v1/agents/[^/]+/attachments$ {
        client_max_body_size 20m;
        client_body_timeout 45s;
        proxy_request_buffering off;
        rewrite ^/api/agent-manager/(.*)$ /api/$1 break;
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # The whole API shares one same-origin HTTP proxy.
    location /api/ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Discovery documents are interfaces too. Keep them on the browser origin
    # in fallback deployments instead of letting the SPA catch their paths.
    location = /agent-manager/openapi.json {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /image-manager/openapi.json {
        proxy_pass http://cma-image-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/agent-card.json {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any unmatched path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
