# Serves the built app and proxies the control-plane API on the same origin.
#
# Same-origin is deliberate: it means the bundle needs no build-time or runtime
# knowledge of where the API lives, and the browser sends the authentication
# cookie without any cross-site exemption.

# Require both parts of a WebSocket upgrade and normalize the upstream headers.
map $http_connection $desktop_connection_upgrade_token {
    default 0;
    ~*(^|,)[[:blank:]]*upgrade[[:blank:]]*(,|$) 1;
}

map "$http_upgrade:$desktop_connection_upgrade_token" $desktop_websocket_upgrade {
    default "";
    "websocket:1" websocket;
}

map $desktop_websocket_upgrade $desktop_websocket_connection {
    default "";
    websocket upgrade;
}

server {
    listen 8080;
    server_name _;

    # Browser login URLs use the 4 KiB public navigation budget (API_Overview).
    # Pin the fallback hop's 8 KiB request-line ceiling explicitly.
    large_client_header_buffers 4 8k;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed assets are immutable; the entry document never is.
    location /assets/ {
        # Current image bytes take precedence over the retained-assets mount.
        root /usr/share/nginx/current;
        # Compress static bundles, including the lazily loaded tokenizer worker.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @retained_assets;
    }

    # Older open tabs still need chunks supplied by the compatibility volume.
    location @retained_assets {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @missing_asset;
    }

    # A transient miss during rollout must not become a cached blank page.
    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # The pre-module diagnostic bootstrap is unversioned and must revalidate.
    location = /browser-telemetry.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Anonymous Agent Manager readiness must never fall through to index.html.
    # Preserve the upstream JSON and status, including 503 while not ready.
    location = /ready {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Public service discovery and protocol traffic. The exact portal page
    # /event-gateway and its browser login proxy below keep their own routes.
    location = /event-gateway/openapi.json {
        proxy_pass http://cma-event-gateway:80/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/event-gateway/(?:v1|mcp|docs)(?:/|$) {
        rewrite ^/event-gateway/(.*)$ /$1 break;
        proxy_pass http://cma-event-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    # These browser handlers retain their original path to select the exact
    # configured origin and form action. Never infer authority from Host.
    location ~ ^/event-gateway/(?:connect|legacy-console)(?:/|$) {
        proxy_pass http://cma-event-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    location /api/event-gateway/ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/image-manager/ {
        proxy_pass http://cma-image-manager:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/agent-manager/ {
        proxy_pass http://cma-agent-manager:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Stream bounded binary uploads to the API without buffering file data on web disk.
    location ~ ^/api/(?:agent-manager/)?v1/agents/[^/]+/attachments$ {
        client_max_body_size 20m;
        client_body_timeout 45s;
        proxy_request_buffering off;
        rewrite ^/api/agent-manager/(.*)$ /api/$1 break;
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Files use base64 JSON: 32 MiB of bytes plus encoding and metadata fits
    # within 43 MiB. The API enforces the exact decoded limit and authorization.
    location ~ ^/api/(?:agent-manager/)?v1/agents/[^/]+/files$ {
        client_max_body_size 43m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        rewrite ^/api/agent-manager/(.*)$ /api/$1 break;
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Only the established desktop socket routes forward a WebSocket upgrade.
    location ~ ^/api/v1/agents/[^/]+/desktop/ws$ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $desktop_websocket_upgrade;
        proxy_set_header Connection $desktop_websocket_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/agent-manager/v1/agents/[^/]+/desktop/ws$ {
        rewrite ^/api/agent-manager/(.*)$ /api/$1 break;
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $desktop_websocket_upgrade;
        proxy_set_header Connection $desktop_websocket_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The whole API shares one same-origin HTTP proxy.
    location /api/ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Discovery documents are interfaces too. Keep them on the browser origin
    # in fallback deployments instead of letting the SPA catch their paths.
    location = /agent-manager/openapi.json {
        # Keep discovery in bounded memory; larger documents apply backpressure.
        proxy_buffer_size 8k;
        proxy_buffers 16 16k;
        proxy_max_temp_file_size 0;
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /image-manager/openapi.json {
        proxy_pass http://cma-image-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/agent-card.json {
        proxy_pass http://cma-agent-manager:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any unmatched path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
