name: "Rust archive"
on:
  workflow_call: {}
permissions:
  contents: "read"
jobs:
  build:
    name: "Build shared Rust test archive"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: 33554432
    defaults:
      run:
        working-directory: "api"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Prepare Backend capacity"
        working-directory: "."
        run: "sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/scripts/backend-capacity.py || echo \"::warning::Backend capacity preparation unavailable\""
      -
        name: "Read pinned Rust toolchain"
        id: "toolchain"
        working-directory: "."
        run: "python3 -c 'import os,tomllib; v=tomllib.load(open(\"api/rust-toolchain.toml\",\"rb\"))[\"toolchain\"][\"channel\"]; open(os.environ[\"GITHUB_OUTPUT\"],\"a\").write(\"channel=\"+v+\"\\n\")'"
      -
        uses: "dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca"
        with:
          toolchain: "${{ steps.toolchain.outputs.channel }}"
          components: "rustfmt, clippy"
      -
        uses: "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0"
        with:
          workspaces: "api"
          save-if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
      -
        name: "Install pinned nextest"
        uses: "taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f"
        with:
          tool: "cargo-nextest@0.9.151"
          fallback: "none"
      -
        name: "Archive workspace tests"
        run: "cargo nextest archive --workspace --locked --archive-file \"$RUNNER_TEMP/backend-tests.tar.zst\""
      -
        name: "Upload Backend test archive"
        # Pinned: consumers verify the SHA-256 digest this version records.
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "rust-tests-${{ github.sha }}"
          path: "${{ runner.temp }}/backend-tests.tar.zst"
          overwrite: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: "error"
