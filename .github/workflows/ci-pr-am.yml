name: "2 Agent Manager"
on:
  pull_request:
    branches:
      - "develop"
      - "main"
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "edited"
      - "labeled"
      - "unlabeled"
concurrency:
  group: "pr-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: "read"
  actions: "read"
  issues: "read"
jobs:
  changes:
    name: "2.1 Select changes"
    uses: "./.github/workflows/ci-track-selection.yml"
  rust-test-build:
    name: "2.2 Rust test archive"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.approval_contract == 'true'"
    uses: "./.github/workflows/ci-rust-archive.yml"
  approval-contract:
    name: "2.4 External approval contract"
    permissions:
      contents: "read"
      actions: "read"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.approval_contract == 'true'"
    uses: "./.github/workflows/ci-approval-contract.yml"
  am:
    name: "2.3 Agent Manager checks"
    # A called workflow cannot hold more than this: its Rust jobs restore the
    # shared test archive through the artifacts API.
    permissions:
      contents: "read"
      actions: "read"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.am == 'true'"
    uses: "./.github/workflows/ci-rust.yml"
    with:
      track: "am"
      packages: "${{ needs.changes.outputs.am_packages }}"
  am-images:
    name: "2.7 Agent Manager image"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"api\"]"
  runtime-images:
    name: "2.8 Runtime image"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"runtime\"]"
  omarchy:
    name: "2.9 Omarchy image"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-omarchy.yml"
  two-am-features:
    name: "2.10 Two Agent Managers"
    needs:
      - "changes"
      - "am-images"
      - "runtime-images"
      - "omarchy"
    if: "!cancelled() && needs.changes.outputs.two_am_features == 'true'"
    permissions:
      contents: "read"
      actions: "read"
    uses: "./.github/workflows/ci-two-am.yml"
    with:
      am_image_result: "${{ needs.am-images.result }}"
      runtime_image_result: "${{ needs.runtime-images.result }}"
      omarchy_image_result: "${{ needs.omarchy.result }}"
  gate-am:
    name: "CI / Agent Manager"
    needs:
      - "changes"
      - "rust-test-build"
      - "approval-contract"
      - "am"
      - "am-images"
      - "runtime-images"
      - "omarchy"
      - "two-am-features"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py am --split"
