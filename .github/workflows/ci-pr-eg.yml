name: "3 Event Gateway"
on:
  pull_request:
    branches:
      - "develop"
      - "main"
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "edited"
      - "labeled"
      - "unlabeled"
concurrency:
  group: "pr-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: "read"
  actions: "read"
  issues: "read"
jobs:
  changes:
    name: "3.1 Select changes"
    uses: "./.github/workflows/ci-track-selection.yml"
  rust-test-build:
    name: "3.2 Rust test archive"
    needs:
      - "changes"
    if: "needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-rust-archive.yml"
  eg:
    name: "3.3 Event Gateway checks"
    # A called workflow cannot hold more than this: its Rust jobs restore the
    # shared test archive through the artifacts API.
    permissions:
      contents: "read"
      actions: "read"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-rust.yml"
    with:
      track: "eg"
      packages: "${{ needs.changes.outputs.eg_packages }}"
  eg-images:
    name: "3.4 Event Gateway image"
    needs:
      - "changes"
    if: "needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"cmaeg\"]"
  gate-eg:
    name: "CI / Event Gateway"
    needs:
      - "changes"
      - "rust-test-build"
      - "eg"
      - "eg-images"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py eg --split"
