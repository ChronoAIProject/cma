name: "Repository checks"
on:
  workflow_call: {}
permissions:
  contents: "read"
jobs:
  structure:
    name: "Repository structure"
    runs-on: "ubuntu-latest"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
      -
        uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1" # v6
        with:
          python-version: "3.12"
      -
        name: "Install selector parsers"
        run: "python3 -m pip install --disable-pip-version-check -r .github/scripts/ci_tracks/requirements.txt"
      -
        name: "Track selection and workflow regressions"
        run: |
          python3 -B -m unittest discover -s .github/scripts/ci_tracks -p "test_*.py"
          python3 -B -m unittest discover -s .github/scripts -p 'mongo_flaky_retry_tests.py'
          ruby .github/scripts/ci-tracks-workflow-tests.rb
          python3 -B .github/scripts/omarchy-ci-scan-tests.py
      -
        name: "Staging publication and deployment contracts"
        run: |
          python3 -m venv "$RUNNER_TEMP/staging-cd-tests"
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B -m unittest discover -s .github/scripts -p 'staging_cd_*_tests.py'
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B .github/scripts/release_candidate_packet_tests.py
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B .github/scripts/data_qualification_tests.py
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B -m unittest discover -s .github/scripts -p 'ci_retry_tests.py'
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B -m unittest discover -s .github/scripts -p 'ci_artifact_download_tests.py'
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B -m unittest discover -s .github/scripts -p 'runtime_image_*tests.py'
          "$RUNNER_TEMP/staging-cd-tests/bin/python" -B .github/scripts/image-secret-gate-tests.py
          ruby .github/scripts/staging_cd_workflows_tests.rb
      -
        name: "Omarchy package bundle regressions"
        run: "python3 -B .github/scripts/omarchy-package-bundle-tests.py"
      -
        name: "Omarchy package bundle retention regressions"
        run: "ruby .github/scripts/omarchy-package-retention-tests.rb"
      -
        name: "Omarchy package bundle is never deleted"
        run: "ruby .github/scripts/omarchy-package-retention.rb"
      -
        name: "Source file size validator regressions"
        run: ".github/scripts/check-file-size-tests.sh"
      -
        name: "Source files stay within size limits"
        run: ".github/scripts/check-file-size.sh"
      -
        name: "Pinned image pull retry regressions"
        run: "bash .github/scripts/pull-pinned-image-tests.sh"
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: 26
      -
        name: "Synthetic authority and observer regressions"
        run: "node --test .github/scripts/staging-authority.test.mjs .github/scripts/public-journey-evidence.test.mjs .github/scripts/connection-journey-evidence.test.mjs .github/scripts/connection-campaign.test.mjs .github/scripts/deployment-observer.test.mjs"
      -
        name: "Agent-log activation evidence regressions"
        run: "node --test .github/scripts/agent-log-activation-evidence.test.mjs"
      -
        name: "TC-117 evidence consistency regressions"
        run: "node --test .github/scripts/visitor-abuse-campaign.test.mjs .github/scripts/visitor-abuse-authority.test.mjs .github/scripts/visitor-abuse-consistency.test.mjs"
      -
        name: "Synthetic home restore evidence regressions"
        run: "node --test .github/scripts/home-backup/*.test.mjs"
      -
        name: "Desktop qualification runner regressions"
        run: "node --test .github/scripts/desktop-replica-contract.test.mjs .github/scripts/desktop-replica-results.test.mjs"
      -
        name: "Audit exception policy regressions"
        run: "node --test .github/scripts/audit-policy.test.mjs"
      -
        name: "Resource revocation trace contract regressions"
        run: "node --test .github/scripts/resource-revocation-contracts.test.mjs"
      -
        name: "Public repository boundary regressions"
        run: "ruby .github/scripts/check-public-tree-tests.rb"
      -
        name: "Public repository boundary"
        run: "ruby .github/scripts/check-public-tree.rb"
      -
        name: "Nightly smoke workflow regressions"
        run: "ruby .github/scripts/nightly-staging-workflow-tests.rb"
      -
        name: "Root contains only permitted entries"
        run: |
          allowed=".git .github api web CLAUDE.md AGENTS.md CONTRIBUTING.md README.md LICENSE NOTICE .gitignore .dockerignore"
          fail=0
          shopt -s dotglob nullglob
          for entry in *; do
            case " $allowed " in
              *" $entry "*) ;;
              *) echo "::error::disallowed root entry: $entry"; fail=1 ;;
            esac
          done
          exit $fail
      -
        name: "Layer dependency rule"
        run: |
          # Inspect production dependencies only. CMA's integration tests run
          # the compiled gateway against disposable fixtures, so their
          # dev-dependencies may include sibling gateway crates without
          # introducing a runtime layer dependency.
          production_dependencies() {
            awk '
              /^\[dependencies\]$/ { in_dependencies=1; next }
              /^\[/ { in_dependencies=0 }
              in_dependencies { print }
            ' "$1"
          }
          fail=0
          production_dependencies api/crates/layer1-public/Cargo.toml | grep -q 'layer3-adapter' \
            && { echo "::error::layer1-public must not depend on layer3-adapter"; fail=1; }
          production_dependencies api/crates/layer2-core/Cargo.toml | grep -q 'layer1-public' \
            && { echo "::error::layer2-core must not depend on layer1-public"; fail=1; }
          production_dependencies api/crates/layer3-adapter/Cargo.toml | grep -qE 'layer1-public|layer2-core' \
            && { echo "::error::layer3-adapter must not depend on layer1 or layer2"; fail=1; }
          production_dependencies api/crates/cma/Cargo.toml | grep -q 'layer4-runtime' \
            && { echo "::error::control plane must not depend on layer4-runtime"; fail=1; }
          for manifest in api/crates/layer1-public/Cargo.toml \
            api/crates/layer2-core/Cargo.toml api/crates/layer3-adapter/Cargo.toml \
            api/crates/layer4-runtime/Cargo.toml api/crates/cma/Cargo.toml; do
            production_dependencies "$manifest" | grep -qE 'cmaeg(-core)?' \
              && { echo "::error::$manifest must not depend on CMAEG crates"; fail=1; }
          done
          for manifest in api/crates/cmaeg*/Cargo.toml; do
            production_dependencies "$manifest" | grep -qE 'layer1-public|layer2-core|layer3-adapter|layer4-runtime|(^|[^[:alnum:]_-])cma([^[:alnum:]_-]|$)' \
              && { echo "::error::$manifest must not depend on control-plane or layer crates"; fail=1; }
          done
          exit $fail
      -
        name: "Layer 2 is protocol- and kernel-agnostic"
        run: |
          hits=$(grep -rniE 'agui|\ba2a\b|\bmcp\b|codex|claude[_-]?code' api/crates/layer2-core/src || true)
          if [ -n "$hits" ]; then
            echo "::error::protocol or kernel name found in layer2-core:"; echo "$hits"; exit 1
          fi
      -
        name: "Image Manager has no Agent or Gateway dependencies"
        run: |
          if grep -qE 'layer[1-4]-|cmaeg|path *=.*["/]cma["/]|cma-agent-manager' api/crates/cma-image-manager/Cargo.toml; then
            echo '::error::Image Manager cannot depend on Agent or Gateway implementation crates'
            exit 1
          fi
  secrets:
    name: "Secret scanning"
    runs-on: "ubuntu-latest"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
      -
        name: "gitleaks"
        run: |
          # Download outside the working tree: the gitleaks binary itself
          # contains the annotation strings the next step forbids.
          # An HTTP error must fail here, not as an unreadable archive; only
          # the pinned release bytes may scan the repository.
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 30 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --status
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          bash .github/scripts/scan-secret-history-tests.sh "$RUNNER_TEMP/gitleaks"
          bash .github/scripts/scan-secret-history.sh "$RUNNER_TEMP/gitleaks"
      -
        name: "Verify frozen image scanner and reject repository bypasses"
        run: |
          python3 -B .github/scripts/image-scanner-policy-tests.py
          python3 -B .github/scripts/image_scanner_policy.py
  scanner-tests:
    name: "Frozen image scanner tests (${{ matrix.shard }})"
    needs: ["secrets"]
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    outputs:
      shard_0: "${{ steps.tests.outputs.shard_0 }}"
      shard_1: "${{ steps.tests.outputs.shard_1 }}"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
        with:
          ref: "${{ github.sha }}"
      -
        name: "Install pinned image secret scanner"
        timeout-minutes: 5
        run: "bash .github/scripts/install-image-gitleaks.sh"
      -
        id: tests
        name: "Run frozen image scanner test shard"
        working-directory: ".github/scripts/image-secret-scanner"
        shell: bash
        env:
          SHARD: "${{ matrix.shard }}"
        run: |
          umask 077
          python3 -B ../ci_tracks/repo_secrets.py --shard "$SHARD"
          printf 'shard_%s=%s\n' "$SHARD" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  result:
    name: "Repo result"
    if: "always()"
    needs: ["structure", "secrets", "scanner-tests"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
        with:
          ref: "${{ github.sha }}"
      -
        name: "Validate repository job results"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/repo_secrets.py --check-gate"
