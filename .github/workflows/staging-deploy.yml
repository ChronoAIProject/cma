name: Staging deployment set

on:
  workflow_call:
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY:
        required: true
      CD_NYXID_CLIENT_ID:
        required: true
      CD_NYXID_CLIENT_SECRET:
        required: true
    inputs:
      release_set:
        required: true
        type: string
      started_at:
        required: true
        type: string
      mode:
        required: true
        type: string
      verify_web_at_deploy:
        type: boolean
        default: false
      evidence_suffix:
        type: string
        default: ''
      infra_ref:
        required: true
        type: string
      # Only an automatic promotion's first attempt may hand a transient
      # refusal before any change to its one re-admission and retry.
      retry_allowed:
        type: boolean
        default: false
    outputs:
      status:
        value: ${{ jobs.deploy.outputs.status }}
      component_result:
        value: ${{ jobs.deploy.outputs.component_result }}
      disposition:
        value: ${{ jobs.deploy.outputs.disposition }}
      retryable:
        value: ${{ jobs.deploy.outputs.retryable }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy set
    if: >-
      github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'release' && 50 || 20 }}
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      status: ${{ job.status }}
      component_result: ${{ steps.coordinate.outputs.component_result }}
      disposition: ${{ steps.release.outputs.disposition || steps.web-admission.outputs.disposition || steps.coordinate.outputs.disposition }}
      retryable: ${{ steps.coordinate.outputs.retryable }}
    env:
      CD_STARTED_AT: ${{ inputs.started_at }}
      CD_DEPLOY_MODE: ${{ inputs.mode }}
    environment: chrono-ai-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse an expired deployment before setup
        if: "!inputs.verify_web_at_deploy"
        run: python3 -B .github/scripts/staging_cd_clock.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify immutable published set
        id: release
        if: "!inputs.verify_web_at_deploy"
        env:
          GH_TOKEN: ${{ github.token }}
          CD_RESOLVE_MODE: verify
          CD_RELEASE_SET: ${{ inputs.release_set }}
        run: python3 -B .github/scripts/staging_cd_resolve.py
      # A set every member of which a newer final overtook deploys nothing:
      # the newer finals' runs own the deployment, so the remaining steps skip.
      - name: Restore public tool download cache
        id: public-tools-cache
        if: steps.release.outputs.disposition == ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      - name: Discard an incomplete public tool cache restore
        if: steps.release.outputs.disposition == '' && (steps.public-tools-cache.outcome != 'success' || steps.public-tools-cache.outputs.cache-hit != 'true')
        run: rm -rf -- "${RUNNER_TEMP:?}/cma-public-tool-cache"
      - name: Prepare isolated deployment tools
        if: steps.release.outputs.disposition == ''
        run: python3 -B .github/scripts/staging_cd_tools.py install
      # Minting a token is safe to repeat. Only the repeat may fail the job.
      - name: Create restricted infrastructure reader token
        id: infra-token
        if: steps.release.outputs.disposition == ''
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.CMA_INFRA_APP_ID }}
          private-key: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
          owner: ChronoAIProject
          repositories: cma-infra
          permission-contents: read
      - name: Retry restricted infrastructure reader token
        id: infra-token-retry
        if: steps.release.outputs.disposition == '' && steps.infra-token.outcome == 'failure'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.CMA_INFRA_APP_ID }}
          private-key: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
          owner: ChronoAIProject
          repositories: cma-infra
          permission-contents: read
      - name: Resolve infrastructure commit and mask private metadata
        id: private
        if: steps.release.outputs.disposition == ''
        env:
          CD_INFRA_TOKEN: ${{ steps.infra-token.outputs.token || steps.infra-token-retry.outputs.token }}
          CD_INFRA_REF: ${{ inputs.infra_ref }}
        run: python3 -B .github/scripts/staging_cd_checkout.py prepare-app
      # A checkout into the same path is safe to repeat; only the repeat may fail the job.
      - name: Check out resolved infrastructure commit
        id: infra-checkout
        if: steps.release.outputs.disposition == ''
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ChronoAIProject/cma-infra
          ref: ${{ steps.private.outputs.revision }}
          token: ${{ steps.infra-token.outputs.token || steps.infra-token-retry.outputs.token }}
          path: .github/.cd-private/${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          show-progress: false
      - name: Retry resolved infrastructure checkout
        if: steps.release.outputs.disposition == '' && steps.infra-checkout.outcome == 'failure'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ChronoAIProject/cma-infra
          ref: ${{ steps.private.outputs.revision }}
          token: ${{ steps.infra-token.outputs.token || steps.infra-token-retry.outputs.token }}
          path: .github/.cd-private/${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          show-progress: false
      - name: Install reviewed private controller requirements
        if: steps.release.outputs.disposition == ''
        run: python3 -B .github/scripts/staging_cd_tools.py requirements
      - name: Verify and admit the immutable Web set after setup
        id: web-admission
        if: inputs.verify_web_at_deploy && steps.release.outputs.disposition == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CD_RESOLVE_MODE: verify-web-at-deploy
          CD_RELEASE_SET: ${{ inputs.release_set }}
        run: python3 -B .github/scripts/staging_cd_resolve.py
      - name: Coordinate the immutable deployment set
        id: coordinate
        if: steps.release.outputs.disposition == '' && steps.web-admission.outputs.disposition == ''
        env:
          CD_RELEASE_SET: ${{ inputs.verify_web_at_deploy && steps.web-admission.outputs.release_set || steps.release.outputs.release_set }}
          CD_STARTED_AT: ${{ inputs.verify_web_at_deploy && steps.web-admission.outputs.started_at || inputs.started_at }}
          CD_INFRA_REF: ${{ steps.private.outputs.revision }}
          CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
          CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
          CD_RUNTIME_POINTER_PUBLICATION_ENABLED: ${{ vars.CMA_STAGING_RUNTIME_POINTER_PUBLICATION_ENABLED }}
          CD_RUNTIME_POINTER_PROOF_PUBLIC_KEY: ${{ vars.CMA_STAGING_RUNTIME_POINTER_PROOF_PUBLIC_KEY }}
          CD_RUNTIME_POINTER_READ_TOKEN: ${{ github.token }}
          CD_RUNTIME_POINTER_TOKEN: ${{ secrets.CD_RUNTIME_POINTER_TOKEN }}
          CD_RETRY_ALLOWED: ${{ inputs.retry_allowed }}
        run: '"$RUNNER_TEMP/cma-deploy-tools/venv/bin/python" -B .github/scripts/staging_cd_invoke.py'
      - name: Verified staging receipts ${{ steps.coordinate.outputs.controller_proof }}
        if: always() && !cancelled() && steps.coordinate.outputs.controller_proof != ''
        run: 'true'
      - name: Remove private checkout
        if: always()
        run: python3 -B .github/scripts/staging_cd_checkout.py cleanup
      - name: Remove isolated deployment tools
        if: always()
        run: python3 -B .github/scripts/staging_cd_tools.py cleanup
  report:
    name: Retain component deployment evidence
    needs: deploy
    if: always() && needs.deploy.outputs.component_result != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate the public component projection
        env:
          CD_COMPONENT_RESULT: ${{ needs.deploy.outputs.component_result }}
          CD_RELEASE_SET: ${{ inputs.release_set }}
        run: python3 -B .github/scripts/staging_cd_deploy_result.py
      # The same evidence may be uploaded again; overwrite replaces a partial first attempt.
      - name: Retain sanitized component deployment outcomes
        id: evidence
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-deployment-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.evidence_suffix }}
          path: ${{ runner.temp }}/public-deployment/deployment.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Retry retaining sanitized component deployment outcomes
        if: steps.evidence.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-deployment-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.evidence_suffix }}
          path: ${{ runner.temp }}/public-deployment/deployment.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
