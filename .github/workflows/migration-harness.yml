name: Migration harness
permissions: {contents: read}
concurrency: {group: 'migration-harness-${{ github.ref }}', cancel-in-progress: true}
jobs:
  contracts:
    name: Migration harness contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-migration-contracts
'on':
  pull_request:
    branches:
    - main
    paths:
    - .github/scripts/migration*
    - .github/scripts/test_migration*
    - .github/scripts/multi-am-features/owner/identity.py
    - .github/workflows/migration-harness.yml
    - .github/actions/ci-migration-contracts/**
  push:
    branches:
    - develop
    paths:
    - .github/scripts/migration*
    - .github/scripts/test_migration*
    - .github/scripts/multi-am-features/owner/identity.py
    - .github/workflows/migration-harness.yml
    - .github/actions/ci-migration-contracts/**
