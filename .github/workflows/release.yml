name: Release gate

# Additional gates that apply only to a release pull request into main, from
# develop or from a release/<name> branch cut from one develop commit.
# Everything in ci.yml also runs; this workflow adds the release requirements.
#
# The version is not decided here. This gate requires only that the pull
# request declare how far it moves the version and what to say about it;
# publish.yml computes the number and writes the tag once the merge has
# happened. Tagging beforehand put a version on a commit nobody had accepted
# yet, and left the tag and the images carrying its number made by two
# different hands, with nothing tying them together.

on:
  pull_request:
    # A pull request that gains or loses a release label, or has its body
    # rewritten, gets a different answer from this gate, so those events have
    # to re-run it. The default set would not.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: main accepts pull requests only from develop or a develop release branch
        # A release branch freezes one develop commit, so the release PR's head
        # stops moving while the merge queue keeps advancing develop. It must
        # be an exact develop snapshot: its head is a commit on develop's
        # first-parent history, which is also what prod-cd requires of the
        # released commit. Bound to the environment rather than interpolated.
        # A branch name is chosen by whoever opens the pull request, and ${{ }}
        # would splice it into the shell source before bash ever sees it.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo "::error::main only accepts release pull requests from this repository"
            exit 1
          fi
          if [ "$HEAD_REF" = "develop" ]; then
            exit 0
          fi
          if ! printf '%s' "$HEAD_REF" | grep -Eqx 'release/[0-9A-Za-z][0-9A-Za-z._-]{0,62}'; then
            echo "::error::main only accepts pull requests from develop or release/<name> (got '$HEAD_REF')"
            exit 1
          fi
          if ! printf '%s' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::invalid release head"
            exit 1
          fi
          # grep -c reads all of rev-list's output; an early-exiting grep -q
          # would break the pipe and fail it under pipefail.
          found=$(git rev-list --first-parent origin/develop | grep -cx "$HEAD_SHA" || true)
          if [ "$found" != "1" ]; then
            echo "::error::$HEAD_REF must point at a commit on develop's first-parent history; cut it from develop and add no commits"
            exit 1
          fi

  ancestry:
    name: develop contains main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: main is an ancestor of the release head
        # Every release leaves a merge commit on main that develop does not
        # have, so main ends one commit ahead and the next release PR reads
        # BEHIND. The prior publication's summary links the verified branch.
        # The head is the PR's own: develop, or a release branch cut from it.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::invalid release head"
            exit 1
          fi
          if git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            exit 0
          fi
          echo "::error::The release head does not contain main, so this cannot merge."
          echo "::error::Reconcile main through a back-merge PR, then cut the release again. See the last publication for the back-merge result."
          git log --oneline "$HEAD_SHA"..origin/main
          exit 1

  release-declaration:
    name: Release declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Exactly one release label declares the bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          declared=$(printf '%s' "$LABELS" | jq -r '.[] | select(startswith("release:"))')
          count=$(printf '%s' "$declared" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::label this pull request with exactly one of release:major, release:minor, release:patch — the merge derives the version from it (found ${count}: ${declared:-none})"
            exit 1
          fi
          case "$declared" in
            release:major|release:minor|release:patch) ;;
            *) echo "::error::unknown bump level '$declared'"; exit 1 ;;
          esac
      - name: Body carries the release notes
        # Bound to the environment rather than interpolated into the script.
        # A pull request body is text anyone with write access can compose, and
        # ${{ }} splices it into the shell source before bash ever sees it.
        env:
          BODY: ${{ github.event.pull_request.body }}
        # Discarded here — this gate only has to establish that the section
        # exists and is complete. publish.yml runs the same script on the same
        # body after the merge and keeps what it returns.
        run: printf '%s' "$BODY" | .github/release-notes.sh > /dev/null

