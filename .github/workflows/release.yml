name: Release gate

# Additional gates that apply only to a pull request from develop into main.
# Everything in ci.yml also runs; this workflow adds the release requirements.
#
# The version is not decided here. This gate requires only that the pull
# request declare how far it moves the version and what to say about it;
# publish.yml computes the number and writes the tag once the merge has
# happened. Tagging beforehand put a version on a commit nobody had accepted
# yet, and left the tag and the images carrying its number made by two
# different hands, with nothing tying them together.

on:
  pull_request:
    # A pull request that gains or loses a release label, or has its body
    # rewritten, gets a different answer from this gate, so those events have
    # to re-run it. The default set would not.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch
    runs-on: ubuntu-latest
    steps:
      - name: main accepts pull requests only from develop
        # Bound to the environment rather than interpolated. A branch name is
        # chosen by whoever opens the pull request, and ${{ }} would splice it
        # into the shell source before bash ever sees it.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main only accepts pull requests from develop (got '$HEAD_REF')"
            exit 1
          fi

  ancestry:
    name: develop contains main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: main is an ancestor of develop
        # Every release leaves a merge commit on main that develop does not
        # have, so main ends one commit ahead and the next release PR reads
        # BEHIND. publish.yml now opens the back-merge itself; this says so
        # early and in words when something has gone wrong anyway, rather than
        # letting an author find out from a merge button after every gate has
        # already run.
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/main origin/develop; then
            exit 0
          fi
          echo "::error::develop does not contain main, so this cannot merge."
          echo "::error::Merge origin/main into develop first — it carries no content,"
          echo "::error::only the merge commit from the last release."
          git log --oneline origin/develop..origin/main
          exit 1

  release-declaration:
    name: Release declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exactly one release label declares the bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          declared=$(printf '%s' "$LABELS" | jq -r '.[] | select(startswith("release:"))')
          count=$(printf '%s' "$declared" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::label this pull request with exactly one of release:major, release:minor, release:patch — the merge derives the version from it (found ${count}: ${declared:-none})"
            exit 1
          fi
          case "$declared" in
            release:major|release:minor|release:patch) ;;
            *) echo "::error::unknown bump level '$declared'"; exit 1 ;;
          esac
      - name: Body carries the release notes
        # Bound to the environment rather than interpolated into the script.
        # A pull request body is text anyone with write access can compose, and
        # ${{ }} splices it into the shell source before bash ever sees it.
        env:
          BODY: ${{ github.event.pull_request.body }}
        # Discarded here — this gate only has to establish that the section
        # exists and is complete. publish.yml runs the same script on the same
        # body after the merge and keeps what it returns.
        run: printf '%s' "$BODY" | .github/release-notes.sh > /dev/null

  no-coauthors:
    name: Commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: No Co-Authored-By trailers
        run: |
          base=$(git merge-base origin/main HEAD)
          if git log "$base"..HEAD --format='%B' | grep -qi '^Co-Authored-By:'; then
            echo "::error::Co-Authored-By trailers are not permitted"
            exit 1
          fi
