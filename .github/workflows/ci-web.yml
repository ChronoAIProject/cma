name: "Web track"
on:
  workflow_call: {}
permissions:
  contents: "read"
# Each job prepares its own checkout and dependencies. Jobs that run browser
# contracts also repeat the production build and the pinned browser install
# they consume; every other step runs exactly once, in exactly one job. The
# caller's `web` result fails when any job fails, so `CI / Web` still gates on
# all of them.
jobs:
  web:
    name: "Web checks"
    runs-on: "ubuntu-latest"
    defaults: &web_defaults
      run:
        working-directory: "web"
    steps:
      - &web_checkout
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      - &web_node
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "24.15.0"
          package-manager-cache: false
          cache: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'npm' || '' }}"
          cache-dependency-path: "web/package-lock.json"
      - &web_locate_npm_cache
        name: "Locate npm download cache"
        if: "github.event_name != 'push' || github.ref != 'refs/heads/develop'"
        id: npm-cache
        run: |
          directory=$(npm config get cache)
          architecture=$(node -p 'process.arch')
          printf 'directory=%s\narchitecture=%s\n' "$directory" "$architecture" >> "$GITHUB_OUTPUT"
      - &web_restore_npm_cache
        # Match setup-node's cache path and lockfile key so existing entries remain usable.
        name: "Restore npm download cache"
        if: "github.event_name != 'push' || github.ref != 'refs/heads/develop'"
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: node-cache-${{ runner.os }}-${{ steps.npm-cache.outputs.architecture }}-npm-${{ hashFiles('web/package-lock.json') }}
      - &web_install
        name: "Install (lockfile integrity)"
        run: "npm ci"
      -
        name: "Format"
        run: "npx prettier --check ."
      -
        name: "Lint"
        run: "npm run lint"
      -
        name: "Type check"
        run: "npm run typecheck"
      -
        name: "Tests and critical Agent browser coverage"
        run: >-
          npm run test -- --coverage.enabled --coverage.reporter=text-summary
          --coverage.include=src/auth/context.tsx
          --coverage.include=src/agent/transport/projection.ts
      -
        name: "Anonymous readiness proxy regressions"
        timeout-minutes: 5
        working-directory: "."
        run: "python3 web/scripts/readiness-proxy-tests.py"
      -
        name: "Dependency audit"
        run: |
          node --test ../.github/scripts/audit-policy.test.mjs
          node ../.github/scripts/audit-dependencies.mjs
      -
        name: "Web artifact identity contract"
        run: |
          python3 .github/scripts/web-build-identity-tests.py
          python3 .github/scripts/web-image-smoke-tests.py
          python3 .github/scripts/web-image-processes-tests.py
          python3 .github/scripts/web-image-evidence-tests.py
          ruby .github/scripts/web-build-contract.rb
        working-directory: "."
    timeout-minutes: 60
  web-journeys:
    name: "Web browser: harness and journeys"
    runs-on: "ubuntu-latest"
    defaults: *web_defaults
    steps:
      - *web_checkout
      - *web_node
      - *web_locate_npm_cache
      - *web_restore_npm_cache
      - *web_install
      -
        name: "Production build"
        env:
          CHRONO_BUILD_SHA: "${{ github.sha }}"
          CHRONO_BUILD_ARTIFACT: "promotable"
        run: "CHRONO_BUILD=\"git-${GITHUB_SHA:0:12}\" npm run build"
      -
        name: "Typecheck every harness entry point"
        working-directory: "web"
        run: "npm run e2e:typecheck"
      -
        name: "Fail-closed fixtures and cleanup mechanics"
        working-directory: "web"
        run: "npm run test -- e2e/environment.test.ts e2e/owner-mechanics.test.ts"
      -
        name: "Install pinned local browser"
        timeout-minutes: 10
        working-directory: "web"
        env:
          DEBUG: "pw:install"
        run: |
          node --test ../.github/scripts/install-contract-browser.test.mjs
          node ../.github/scripts/install-contract-browser.mjs
          node --test ../.github/scripts/install-contract-video.test.mjs
          node ../.github/scripts/install-contract-video.mjs
      -
        name: "Owner timing browser fixtures"
        timeout-minutes: 5
        run: 'CMA_TEST_CHROME="${CMA_E2E_BROWSER_PATH:?}" npm run e2e:owner-timing:test'
      -
        name: "Local browser guard mechanics"
        working-directory: "web"
        run: |
          node --test ../.github/scripts/agent-v2-ci.test.mjs ../.github/scripts/tree-row-menu-ci.test.mjs ../.github/scripts/new-agent-request-ci.test.mjs ../.github/scripts/lifecycle-browser-ci.test.mjs ../.github/scripts/channel-setup-ci.test.mjs ../.github/scripts/connection-journey-ui-ci.test.mjs
          npm run e2e:mechanics
      -
        name: "Local compiled connection journeys"
        timeout-minutes: 5
        run: "node node_modules/playwright/cli.js test --config e2e/connection-journey-ui.config.ts"
      -
        name: "CSS collisions"
        run: "npm run check:css"
      -
        name: "Computed styles"
        timeout-minutes: 5
        run: "npm run check:styles"
      -
        name: "Compiled web build identity"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
        run: "npx playwright test --config e2e/build-identity.config.ts"
      -
        name: "Desktop and conversation browser layout"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
        run: "npx playwright test --config e2e/desktop-conversation.config.ts"
      -
        name: "Local row menu pointer and keyboard contracts"
        id: row_menu
        timeout-minutes: 5
        env:
          CMA_ROW_MENU_EVIDENCE_DIR: "${{ runner.temp }}/cma-row-menu"
        run: "node node_modules/playwright/cli.js test --config e2e/tree-row-menu.config.ts"
      -
        name: "Row menu failure evidence"
        if: "failure() && steps.row_menu.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "row-menu-failure"
          path: "${{ runner.temp }}/cma-row-menu"
          retention-days: 1
      -
        name: "Local channel setup validation"
        id: channel_setup
        timeout-minutes: 5
        env:
          CMA_CHANNEL_SETUP_EVIDENCE_DIR: "${{ runner.temp }}/cma-channel-setup"
        run: "node node_modules/playwright/cli.js test --config e2e/channel-setup.config.ts"
      -
        name: "Channel setup failure evidence"
        if: "failure() && steps.channel_setup.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "channel-setup-failure"
          path: "${{ runner.temp }}/cma-channel-setup"
          retention-days: 1
      -
        name: "Local channel authoring contracts"
        id: channel_authoring
        timeout-minutes: 5
        shell: bash
        env:
          CMA_CHANNEL_SETUP_EVIDENCE_DIR: "${{ runner.temp }}/cma-channel-authoring"
        run: |
          node node_modules/playwright/cli.js test --config e2e/hmac-channel.config.ts
          node node_modules/playwright/cli.js test --config e2e/wh-eg-authoring.config.ts
      -
        name: "Channel authoring failure evidence"
        if: "failure() && steps.channel_authoring.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "channel-authoring-failure"
          path: "${{ runner.temp }}/cma-channel-authoring"
          retention-days: 1
      -
        name: "Local credential recovery contracts"
        id: credential_setup
        timeout-minutes: 5
        env:
          CMA_CREDENTIAL_EVIDENCE_DIR: "${{ runner.temp }}/cma-credential-setup"
        run: "node node_modules/playwright/cli.js test --config e2e/credential-setup-ci.config.ts"
      -
        name: "Credential recovery failure evidence"
        if: "failure() && steps.credential_setup.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "credential-recovery-failure"
          path: "${{ runner.temp }}/cma-credential-setup"
          retention-days: 1
    timeout-minutes: 60
  web-lifecycle:
    name: "Web browser: lifecycle and recovery"
    runs-on: "ubuntu-latest"
    defaults: *web_defaults
    steps:
      - *web_checkout
      - *web_node
      - *web_locate_npm_cache
      - *web_restore_npm_cache
      - *web_install
      -
        name: "Production build"
        env:
          CHRONO_BUILD_SHA: "${{ github.sha }}"
          CHRONO_BUILD_ARTIFACT: "promotable"
        run: "CHRONO_BUILD=\"git-${GITHUB_SHA:0:12}\" npm run build"
      -
        name: "Install pinned local browser"
        timeout-minutes: 10
        working-directory: "web"
        env:
          DEBUG: "pw:install"
        run: |
          node --test ../.github/scripts/install-contract-browser.test.mjs
          node ../.github/scripts/install-contract-browser.mjs
          node --test ../.github/scripts/install-contract-video.test.mjs
          node ../.github/scripts/install-contract-video.mjs
      -
        name: "Local Launch receipt recovery contracts"
        id: receipt_recovery
        timeout-minutes: 5
        env:
          CMA_RECEIPT_EVIDENCE_DIR: "${{ runner.temp }}/cma-receipt-recovery"
        run: "node node_modules/playwright/cli.js test --config e2e/review-receipt-recovery-ci.config.ts"
      -
        name: "Launch receipt recovery failure evidence"
        if: "failure() && steps.receipt_recovery.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "receipt-recovery-failure"
          path: "${{ runner.temp }}/cma-receipt-recovery"
          retention-days: 1
      -
        name: "Local resource lifecycle contracts"
        id: resource_lifecycle
        timeout-minutes: 8
        env:
          CMA_LIFECYCLE_EVIDENCE_DIR: "${{ runner.temp }}/cma-resource-lifecycle"
        run: |
          node node_modules/playwright/cli.js test --config e2e/resource-lifecycle.config.ts --list
          node node_modules/playwright/cli.js test --config e2e/resource-lifecycle.config.ts
      -
        name: "Resource lifecycle failure evidence"
        if: "failure() && steps.resource_lifecycle.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "resource-lifecycle-failure"
          path: "${{ runner.temp }}/cma-resource-lifecycle"
          retention-days: 1
      -
        name: "Local Sandbox status filter contracts"
        id: sandbox_status_filter
        timeout-minutes: 5
        env:
          CMA_SANDBOX_FILTER_EVIDENCE_DIR: "${{ runner.temp }}/cma-sandbox-filter"
        run: |
          node node_modules/playwright/cli.js test --config e2e/sandbox-status-filter.config.ts --list
          node node_modules/playwright/cli.js test --config e2e/sandbox-status-filter.config.ts
      -
        name: "Sandbox status filter failure evidence"
        if: "failure() && steps.sandbox_status_filter.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "sandbox-status-filter-failure"
          path: "${{ runner.temp }}/cma-sandbox-filter"
          retention-days: 1
      -
        name: "Local New agent request isolation"
        id: new_agent_request
        timeout-minutes: 5
        env:
          CMA_NEW_AGENT_REQUEST_EVIDENCE_DIR: "${{ runner.temp }}/cma-new-agent-request"
        run: "node node_modules/playwright/cli.js test --config e2e/new-agent-request.config.ts"
      -
        name: "New agent request failure evidence"
        if: "failure() && steps.new_agent_request.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "new-agent-request-failure"
          path: "${{ runner.temp }}/cma-new-agent-request"
          retention-days: 1
    timeout-minutes: 60
  web-design:
    name: "Web browser: design, shell and auth"
    runs-on: "ubuntu-latest"
    defaults: *web_defaults
    steps:
      - *web_checkout
      - *web_node
      - *web_locate_npm_cache
      - *web_restore_npm_cache
      - *web_install
      -
        name: "Production build"
        env:
          CHRONO_BUILD_SHA: "${{ github.sha }}"
          CHRONO_BUILD_ARTIFACT: "promotable"
        run: "CHRONO_BUILD=\"git-${GITHUB_SHA:0:12}\" npm run build"
      -
        name: "Install pinned local browser"
        timeout-minutes: 10
        working-directory: "web"
        env:
          DEBUG: "pw:install"
        run: |
          node --test ../.github/scripts/install-contract-browser.test.mjs
          node ../.github/scripts/install-contract-browser.mjs
          node --test ../.github/scripts/install-contract-video.test.mjs
          node ../.github/scripts/install-contract-video.mjs
      -
        name: "Local identity refresh recovery contracts"
        id: auth_refresh
        timeout-minutes: 5
        env:
          CMA_AUTH_REFRESH_EVIDENCE_DIR: "${{ runner.temp }}/cma-auth-refresh"
        run: "node node_modules/playwright/cli.js test --config e2e/auth-refresh-followup.config.ts"
      -
        name: "Identity refresh failure evidence"
        if: "failure() && steps.auth_refresh.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "auth-refresh-failure"
          path: "${{ runner.temp }}/cma-auth-refresh"
          retention-days: 1
      -
        name: "Design, shell and auth gate mechanics"
        timeout-minutes: 5
        run: "node --test ../.github/scripts/p1-browser-ci.test.mjs"
      -
        name: "Complete design browser contracts"
        id: p1_design
        timeout-minutes: 10
        run: "node ../.github/scripts/p1-browser-ci.mjs design"
      -
        name: "Design browser failure evidence"
        if: "failure() && steps.p1_design.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "p1-design-failure"
          path: "${{ runner.temp }}/cma-p1-browser/design"
          retention-days: 1
          if-no-files-found: "error"
      -
        name: "Complete design palette browser contracts"
        id: p1_palette
        timeout-minutes: 10
        run: "node ../.github/scripts/p1-browser-ci.mjs palette"
      -
        name: "Design palette browser failure evidence"
        if: "failure() && steps.p1_palette.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "p1-palette-failure"
          path: "${{ runner.temp }}/cma-p1-browser/palette"
          retention-days: 1
          if-no-files-found: "error"
      -
        name: "Complete shell browser contracts"
        id: p1_shell
        timeout-minutes: 10
        run: "node ../.github/scripts/p1-browser-ci.mjs shell"
      -
        name: "Shell browser failure evidence"
        if: "failure() && steps.p1_shell.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "p1-shell-failure"
          path: "${{ runner.temp }}/cma-p1-browser/shell"
          retention-days: 1
          if-no-files-found: "error"
      -
        name: "Complete auth browser contracts"
        id: p1_auth
        timeout-minutes: 10
        run: "node ../.github/scripts/p1-browser-ci.mjs auth"
      -
        name: "Auth browser failure evidence"
        if: "failure() && steps.p1_auth.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "p1-auth-failure"
          path: "${{ runner.temp }}/cma-p1-browser/auth"
          retention-days: 1
          if-no-files-found: "error"
    timeout-minutes: 60
  web-conversation:
    name: "Web browser: conversation and usage"
    runs-on: "ubuntu-latest"
    defaults: *web_defaults
    steps:
      - *web_checkout
      - *web_node
      - *web_locate_npm_cache
      - *web_restore_npm_cache
      - *web_install
      -
        name: "Production build"
        env:
          CHRONO_BUILD_SHA: "${{ github.sha }}"
          CHRONO_BUILD_ARTIFACT: "promotable"
        run: "CHRONO_BUILD=\"git-${GITHUB_SHA:0:12}\" npm run build"
      -
        name: "Install pinned local browser"
        timeout-minutes: 10
        working-directory: "web"
        env:
          DEBUG: "pw:install"
        run: |
          node --test ../.github/scripts/install-contract-browser.test.mjs
          node ../.github/scripts/install-contract-browser.mjs
          node --test ../.github/scripts/install-contract-video.test.mjs
          node ../.github/scripts/install-contract-video.mjs
      -
        name: "Local Agent v2 contracts"
        id: agent_v2
        timeout-minutes: 8
        env:
          CMA_AGENT_V2_OUTPUT_DIR: "${{ runner.temp }}/cma-agent-v2"
        run: |
          node -e 'console.log("Agent v2 browser:", process.env.CMA_E2E_BROWSER_PATH)'
          "$CMA_E2E_BROWSER_PATH" --version
          node node_modules/playwright/cli.js test --config e2e/agent-v2.config.ts
      -
        name: "Agent v2 failure evidence"
        if: "failure() && steps.agent_v2.outcome == 'failure'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "agent-v2-failure"
          path: "${{ runner.temp }}/cma-agent-v2"
          retention-days: 1
      -
        name: "Usage browser layouts and states"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
        run: "npx playwright test --config e2e/usage.config.ts"
      -
        name: "Measured Usage browser layouts and states"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
          CMA_E2E_MEASURED_USAGE: "true"
        run: "npx playwright test --config e2e/usage.config.ts account-usage.check.ts operations-usage.check.ts"
      -
        name: "Document navigation and creation recovery"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
        run: "npx playwright test --config e2e/documents.config.ts documents-unsaved.check.ts documents-legacy-history.check.ts documents-creation.check.ts"
    timeout-minutes: 60
  # CI / Web sees only this workflow's aggregate result. Require each named
  # Web job here, so a skipped, cancelled or removed job cannot pass.
  web-result:
    name: "Web result"
    if: "always()"
    needs:
      - "web"
      - "web-journeys"
      - "web-lifecycle"
      - "web-design"
      - "web-conversation"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Require every Web job to succeed"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/web_result.py"
