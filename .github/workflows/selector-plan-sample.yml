name: Measure a staging plan on a disposable runner
on:
  workflow_call:
    inputs:
      sample:
        type: string
        required: true
    outputs:
      digest:
        value: ${{ jobs.measure.outputs.digest }}
permissions:
  contents: read
jobs:
  measure:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2001
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Read repository Rust toolchain
        id: toolchain
        run: >-
          python3 -c 'import os,re,tomllib;
          value=tomllib.load(open("api/rust-toolchain.toml","rb"))["toolchain"]["channel"];
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",value);
          open(os.environ["GITHUB_OUTPUT"],"a").write("channel="+value+"\n")'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Install shared selector parsers
        run: |
          python3 -m venv "$RUNNER_TEMP/selector-venv"
          "$RUNNER_TEMP/selector-venv/bin/python" -m pip install -r .github/scripts/ci_tracks/requirements.txt
      - name: Restore only this benchmark's parent sample
        if: inputs.sample == 'warm'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/selector-benchmark
          key: selector-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-parent
          fail-on-cache-miss: true
      - name: Reconcile a bounded develop window with the shared planner
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          "$RUNNER_TEMP/selector-venv/bin/python" -B - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from ci_tracks.selection_cache import canonical, fingerprint
          from ci_tracks.git_comparison import check_sha
          from staging_cd_queue import git, release_queue

          root, sample = Path.cwd(), os.environ['SAMPLE']
          assert sample in {'parent', 'cold', 'warm'}
          head = check_sha(os.environ['BASE'])
          # Keep every sample on the same bounded history, even as the
          # original adoption commit recedes. Cold and warm compare the full
          # queue for this window. The parent sample omits only the tip.
          revisions = git(root, 'rev-list', '--first-parent', '--max-count=16', head).splitlines()
          assert 2 <= len(revisions) <= 16
          start = check_sha(revisions[-1])
          count = len(revisions)
          if sample == 'parent':
              head = check_sha(revisions[1])
              count -= 1
          directory = Path(os.environ['RUNNER_TEMP']) / 'selector-benchmark'
          os.environ['CD_SELECTOR_CACHE'] = json.dumps({'policy': fingerprint(root), 'directory': str(directory)})
          metrics = {}
          queue = release_queue(root, start, head, head, metrics)
          if sample == 'warm':
              assert metrics['hits'] == count - 1 and metrics['misses'] == 1 and metrics['input_hits'] == 1
          else:
              assert metrics['hits'] == 0 and metrics['misses'] == count
          print(json.dumps(metrics, sort_keys=True))
          digest = hashlib.sha256(canonical(queue)).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('digest=' + digest, file=output)
          PY
      - name: Save this sample under the PR run only
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/selector-benchmark
          key: selector-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.sample }}
