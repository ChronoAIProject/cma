name: Staging CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: read
    outputs:
      queue: ${{ steps.plan.outputs.queue }}
      controller_proofs: ${{ steps.promotions.outputs.verified }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # At most 2,000 reconciled first parents plus the adoption parent.
          fetch-depth: 2001
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Read repository Rust toolchain
        id: toolchain
        run: >-
          python3 -c 'import os,re,tomllib;
          value=tomllib.load(open("api/rust-toolchain.toml","rb"))["toolchain"]["channel"];
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",value);
          open(os.environ["GITHUB_OUTPUT"],"a").write("channel="+value+"\n")'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Install shared selector parsers
        run: |
          python3 -m venv "$RUNNER_TEMP/selector-venv"
          "$RUNNER_TEMP/selector-venv/bin/python" -m pip install -r .github/scripts/ci_tracks/requirements.txt
      - name: Bind selection cache to trusted develop and exact policy
        id: selection-cache
        run: python3 -B .github/scripts/staging_cd_selection_cache.py
      - name: Restore previous trusted develop comparisons
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.selection-cache.outputs.directory }}
          key: ${{ steps.selection-cache.outputs.key }}
          restore-keys: ${{ steps.selection-cache.outputs.prefix }}
      - name: Reconcile first-parent merges with the shared selector
        id: plan
        env:
          CD_ADOPTION_SHA: ${{ vars.CMA_CD_ADOPTION_SHA }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_queue.py'
      - name: Read recent staging controller outcomes
        id: promotions
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CD_STAGING_ENVIRONMENT: chrono-ai-staging
        run: python3 -B .github/scripts/staging_cd_promotion.py
      - name: Save complete trusted develop comparisons
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.selection-cache.outputs.directory }}
          key: ${{ steps.selection-cache.outputs.key }}
  allocate:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
      actions: read
    outputs:
      publications: ${{ steps.routes.outputs.publications }}
      lanes: ${{ steps.routes.outputs.lanes }}
      batches: ${{ steps.routes.outputs.batches }}
      changed: ${{ steps.allocate.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve independent immutable component versions
        id: allocate
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
          CD_CONTROLLER_PROOFS: ${{ needs.plan.outputs.controller_proofs }}
        run: python3 -B .github/scripts/staging_cd_allocate.py
      - name: Route finalized components by contract
        id: routes
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PUBLICATION_MATRIX: ${{ steps.allocate.outputs.matrix }}
        run: python3 -B .github/scripts/staging_cd_routes.py
  infrastructure:
    needs: allocate
    if: needs.allocate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrono-ai-staging
    outputs:
      revision: ${{ steps.private.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Restore public tool download cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      - name: Verify and warm public tool downloads before admission
        run: python3 -B .github/scripts/staging_cd_tools.py warm-cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      - name: Create restricted infrastructure reader token
        id: infra-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CMA_INFRA_APP_ID }}
          private-key: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
          owner: ChronoAIProject
          repositories: cma-infra
          permission-contents: read
      - name: Resolve infrastructure revision once for this release
        id: private
        env:
          CD_INFRA_TOKEN: ${{ steps.infra-token.outputs.token }}
          CD_INFRA_REF: main
        run: python3 -B .github/scripts/staging_cd_checkout.py prepare-app
  release_web:
    name: Release web
    needs: allocate
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['web'] != ''
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: web
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['web'] }}
  release_am:
    name: Release am
    needs: allocate
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['am'] != ''
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: am
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['am'] }}
  release_eg:
    name: Release eg
    needs: allocate
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['eg'] != ''
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: eg
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['eg'] }}
  release_runtime:
    name: Release runtime
    needs: allocate
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['runtime'] != ''
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: runtime
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['runtime'] }}
  release_runtime_omarchy:
    name: Release runtime-omarchy
    needs: allocate
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['runtime-omarchy'] != ''
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: runtime-omarchy
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['runtime-omarchy'] }}
  promote_web:
    name: Promote web
    needs: [allocate, infrastructure, release_web]
    if: needs.allocate.outputs.changed == 'true' && needs.release_web.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['web'] == 'web'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
    with:
      lane: web
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['web']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_am:
    name: Promote am
    needs: [allocate, infrastructure, release_am]
    if: needs.allocate.outputs.changed == 'true' && needs.release_am.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['am'] == 'am'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
    with:
      lane: am
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['am']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_eg:
    name: Promote eg
    needs: [allocate, infrastructure, release_eg]
    if: needs.allocate.outputs.changed == 'true' && needs.release_eg.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['eg'] == 'eg'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
    with:
      lane: eg
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['eg']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_runtime:
    name: Promote runtime
    needs: [allocate, infrastructure, release_runtime]
    if: needs.allocate.outputs.changed == 'true' && needs.release_runtime.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['runtime'] == 'runtime'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
    with:
      lane: runtime
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['runtime']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_runtime_omarchy:
    name: Promote runtime-omarchy
    needs: [allocate, infrastructure, release_runtime_omarchy]
    if: needs.allocate.outputs.changed == 'true' && needs.release_runtime_omarchy.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['runtime-omarchy'] == 'runtime-omarchy'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
    with:
      lane: runtime-omarchy
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['runtime-omarchy']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_contract:
    name: Promote contract
    needs: [allocate, infrastructure, release_am, release_runtime, release_runtime_omarchy]
    if: >-
      always() && !cancelled() && needs.allocate.result == 'success' &&
      needs.infrastructure.result == 'success' && needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.batches)['contract'] != null &&
      (fromJSON(needs.allocate.outputs.lanes)['am'] != 'contract' ||
       (needs.release_am.result == 'success' && needs.release_am.outputs.finalized == 'success')) &&
      (fromJSON(needs.allocate.outputs.lanes)['runtime'] != 'contract' ||
       (needs.release_runtime.result == 'success' && needs.release_runtime.outputs.finalized == 'success')) &&
      (fromJSON(needs.allocate.outputs.lanes)['runtime-omarchy'] != 'contract' ||
       (needs.release_runtime_omarchy.result == 'success' && needs.release_runtime_omarchy.outputs.finalized == 'success'))
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
    with:
      lane: contract
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['contract']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  recheck:
    name: Report component outcomes
    needs: [plan, allocate, infrastructure,
            release_web, release_am, release_eg, release_runtime, release_runtime_omarchy,
            promote_web, promote_am, promote_eg, promote_runtime, promote_runtime_omarchy, promote_contract]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify newer merges have a reconciliation run
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: python3 -B .github/scripts/staging_cd_recheck.py
      - name: Report all component outcomes
        if: always()
        env:
          CD_PLAN_CHANGED: ${{ needs.plan.outputs.changed }}
          CD_ALLOCATION_RESULT: ${{ needs.allocate.result }}
          CD_INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          CD_LANES: ${{ needs.allocate.outputs.lanes }}
          CD_PUBLISH_WEB: ${{ needs.release_web.result }}
          CD_PUBLISH_AM: ${{ needs.release_am.result }}
          CD_PUBLISH_EG: ${{ needs.release_eg.result }}
          CD_PUBLISH_RUNTIME: ${{ needs.release_runtime.result }}
          CD_PUBLISH_RUNTIME_OMARCHY: ${{ needs.release_runtime_omarchy.result }}
          CD_PROMOTE_WEB: ${{ toJSON(needs.promote_web) }}
          CD_PROMOTE_AM: ${{ toJSON(needs.promote_am) }}
          CD_PROMOTE_EG: ${{ toJSON(needs.promote_eg) }}
          CD_PROMOTE_RUNTIME: ${{ toJSON(needs.promote_runtime) }}
          CD_PROMOTE_RUNTIME_OMARCHY: ${{ toJSON(needs.promote_runtime_omarchy) }}
          CD_PROMOTE_CONTRACT: ${{ toJSON(needs.promote_contract) }}
        run: python3 -B .github/scripts/staging_cd_component_report.py
