name: Staging CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

# Package tools repeat transient network failures before failing a step.
env:
  CARGO_NET_RETRY: '10'
  PIP_RETRIES: '10'
  RUSTUP_MAX_RETRIES: '10'

jobs:
  plan:
    if: github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.plan.outputs.queue }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # At most 2,000 reconciled first parents plus the adoption parent.
          fetch-depth: 2001
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Read repository Rust toolchain
        id: toolchain
        run: >-
          python3 -c 'import os,re,tomllib;
          value=tomllib.load(open("api/rust-toolchain.toml","rb"))["toolchain"]["channel"];
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",value);
          open(os.environ["GITHUB_OUTPUT"],"a").write("channel="+value+"\n")'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Install shared selector parsers
        run: |
          python3 -m venv "$RUNNER_TEMP/selector-venv"
          "$RUNNER_TEMP/selector-venv/bin/python" -m pip install -r .github/scripts/ci_tracks/requirements.txt
      - name: Bind selection cache to trusted develop and exact policy
        id: selection-cache
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_selection_cache.py'
      - name: Restore previous trusted develop comparisons
        id: comparison-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ steps.selection-cache.outputs.directory }}
          key: ${{ steps.selection-cache.outputs.key }}
          restore-keys: ${{ steps.selection-cache.outputs.prefix }}
      - name: Discard an incomplete comparison cache restore
        # A prefix hit sets the matched key without an exact cache hit.
        if: steps.comparison-cache.outcome != 'success' || steps.comparison-cache.outputs.cache-matched-key == ''
        run: rm -rf -- "${RUNNER_TEMP:?}/cma-selection-cache"
      # The plan starts at the oldest revision a current lane can still need,
      # from each lane's newest final release tag. The read-only token reads
      # those tag objects; the selector processes never receive it.
      - name: Reconcile first-parent merges with the shared selector
        id: plan
        env:
          CD_ADOPTION_SHA: ${{ vars.CMA_CD_ADOPTION_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_queue.py'
      # A plan stopped by its budget still succeeds here, so every analysed
      # revision is saved and the next run continues instead of starting over.
      - name: Save trusted develop comparisons
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ steps.selection-cache.outputs.directory }}
          key: ${{ steps.selection-cache.outputs.key }}
      # A transient stop (a spent budget, or tags that could not be read) fails
      # here; catch-up re-runs a head run stopped at this step, once. A plan
      # that needs a person fails at the next step instead and is not re-run.
      - name: Require a complete release plan
        if: steps.plan.outputs.complete != 'true' && steps.plan.outputs.transient == 'true'
        env:
          CD_PLAN_REFUSED: ${{ steps.plan.outputs.refused }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_queue.py --require-complete'
      - name: Require a provable release plan
        if: steps.plan.outputs.complete != 'true' && steps.plan.outputs.transient != 'true'
        env:
          CD_PLAN_REFUSED: ${{ steps.plan.outputs.refused }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_queue.py --require-complete'
  allocate:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
      actions: read
      deployments: read
    outputs:
      matrix: ${{ steps.allocate.outputs.matrix }}
      publications: ${{ steps.routes.outputs.publications }}
      lanes: ${{ steps.routes.outputs.lanes }}
      batches: ${{ steps.routes.outputs.batches }}
      changed: ${{ steps.allocate.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve independent immutable component versions
        id: allocate
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
          CD_STAGING_ENVIRONMENT: chrono-ai-staging
        run: python3 -B .github/scripts/staging_cd_allocate.py
      # A transient refusal (a read, a write that may have committed, or the
      # budget) fails here; catch-up re-runs a head run stopped at this step,
      # once. A refusal that needs a person fails the step above instead.
      - name: Require a settled allocation
        if: steps.allocate.outputs.transient == 'true'
        env:
          CD_ALLOCATION_REFUSED: ${{ steps.allocate.outputs.refused }}
          CD_ALLOCATION_SITE: ${{ steps.allocate.outputs.site }}
        run: python3 -B .github/scripts/staging_cd_allocate.py --require-settled
      - name: Route finalized components by contract
        id: routes
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PUBLICATION_MATRIX: ${{ steps.allocate.outputs.matrix }}
        run: python3 -B .github/scripts/staging_cd_routes.py
  infrastructure:
    needs: allocate
    if: needs.allocate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrono-ai-staging
    outputs:
      revision: ${{ steps.private.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Restore public tool download cache
        id: public-tools-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      - name: Discard an incomplete public tool cache restore
        if: steps.public-tools-cache.outcome != 'success' || steps.public-tools-cache.outputs.cache-hit != 'true'
        run: rm -rf -- "${RUNNER_TEMP:?}/cma-public-tool-cache"
      - name: Verify and warm public tool downloads before admission
        run: python3 -B .github/scripts/staging_cd_tools.py warm-cache
      - name: Save verified public tool downloads
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      # Minting a token is safe to repeat. Only the repeat may fail the job.
      - name: Create restricted infrastructure reader token
        id: infra-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.CMA_INFRA_APP_ID }}
          private-key: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
          owner: ChronoAIProject
          repositories: cma-infra
          permission-contents: read
      - name: Retry restricted infrastructure reader token
        id: infra-token-retry
        if: steps.infra-token.outcome == 'failure'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.CMA_INFRA_APP_ID }}
          private-key: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
          owner: ChronoAIProject
          repositories: cma-infra
          permission-contents: read
      - name: Resolve infrastructure revision once for this release
        id: private
        env:
          CD_INFRA_TOKEN: ${{ steps.infra-token.outputs.token || steps.infra-token-retry.outputs.token }}
          CD_INFRA_REF: main
        run: python3 -B .github/scripts/staging_cd_checkout.py prepare-app
      # Release jobs wait for this, so an unreviewed bundle never starts a build.
      - name: Require the pinned controller to accept this scanner bundle
        env:
          CD_INFRA_TOKEN: ${{ steps.infra-token.outputs.token || steps.infra-token-retry.outputs.token }}
          CD_INFRA_REVISION: ${{ steps.private.outputs.revision }}
        run: python3 -B .github/scripts/staging_cd_scan_review.py
  release_web:
    name: Release web
    needs: [allocate, infrastructure]
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['web'] != ''
    # Each release_* job runs one release of its component at a time. Newer
    # pushes queue behind the running build, which finishes; a queued job that
    # a newer reservation already owns skips in seconds, so the newest source
    # always builds next.
    concurrency:
      group: cma-staging-web-release
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: web
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['web'] }}
  release_am:
    name: Release am
    needs: [allocate, infrastructure]
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['am'] != ''
    concurrency:
      group: cma-staging-am-release
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: am
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['am'] }}
  release_eg:
    name: Release eg
    needs: [allocate, infrastructure]
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['eg'] != ''
    concurrency:
      group: cma-staging-eg-release
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: eg
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['eg'] }}
  release_runtime:
    name: Release runtime
    needs: [allocate, infrastructure]
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['runtime'] != ''
    concurrency:
      group: cma-staging-runtime-release
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: runtime
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['runtime'] }}
  release_runtime_omarchy:
    name: Release runtime-omarchy
    needs: [allocate, infrastructure]
    if: needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.publications)['runtime-omarchy'] != ''
    concurrency:
      group: cma-staging-runtime-omarchy-release
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-release.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    with:
      component: runtime-omarchy
      tasks: ${{ fromJSON(needs.allocate.outputs.publications)['runtime-omarchy'] }}
  promote_web:
    name: Promote web
    needs: [allocate, infrastructure, release_web]
    if: needs.allocate.outputs.changed == 'true' && needs.release_web.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['web'] == 'web'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
      deployments: read
    with:
      lane: web
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['web']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_am:
    name: Promote am
    needs: [allocate, infrastructure, release_am]
    if: needs.allocate.outputs.changed == 'true' && needs.release_am.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['am'] == 'am'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
      deployments: read
    with:
      lane: am
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['am']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_eg:
    name: Promote eg
    needs: [allocate, infrastructure, release_eg]
    if: needs.allocate.outputs.changed == 'true' && needs.release_eg.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['eg'] == 'eg'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
      deployments: read
    with:
      lane: eg
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['eg']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_runtime:
    name: Promote runtime
    needs: [allocate, infrastructure, release_runtime]
    if: needs.allocate.outputs.changed == 'true' && needs.release_runtime.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['runtime'] == 'runtime'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
      deployments: read
    with:
      lane: runtime
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['runtime']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_runtime_omarchy:
    name: Promote runtime-omarchy
    needs: [allocate, infrastructure, release_runtime_omarchy]
    if: needs.allocate.outputs.changed == 'true' && needs.release_runtime_omarchy.outputs.finalized == 'success' && fromJSON(needs.allocate.outputs.lanes)['runtime-omarchy'] == 'runtime-omarchy'
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
      deployments: read
    with:
      lane: runtime-omarchy
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['runtime-omarchy']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  promote_contract:
    name: Promote contract
    needs: [allocate, infrastructure, release_am, release_runtime, release_runtime_omarchy]
    if: >-
      always() && !cancelled() && needs.allocate.result == 'success' &&
      needs.infrastructure.result == 'success' && needs.allocate.outputs.changed == 'true' && fromJSON(needs.allocate.outputs.batches)['contract'] != null &&
      (fromJSON(needs.allocate.outputs.lanes)['am'] != 'contract' ||
       (needs.release_am.result == 'success' && needs.release_am.outputs.finalized == 'success')) &&
      (fromJSON(needs.allocate.outputs.lanes)['runtime'] != 'contract' ||
       (needs.release_runtime.result == 'success' && needs.release_runtime.outputs.finalized == 'success')) &&
      (fromJSON(needs.allocate.outputs.lanes)['runtime-omarchy'] != 'contract' ||
       (needs.release_runtime_omarchy.result == 'success' && needs.release_runtime_omarchy.outputs.finalized == 'success'))
    concurrency:
      group: cma-staging-deploy-set
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/staging-promote.yml
    secrets:
      CMA_INFRA_APP_PRIVATE_KEY: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
      CD_NYXID_CLIENT_ID: ${{ secrets.CD_NYXID_CLIENT_ID }}
      CD_NYXID_CLIENT_SECRET: ${{ secrets.CD_NYXID_CLIENT_SECRET }}
    permissions:
      contents: read
      actions: read
      deployments: read
    with:
      lane: contract
      publication_matrix: ${{ toJSON(fromJSON(needs.allocate.outputs.batches)['contract']) }}
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  publication_signal:
    name: Signal verified image publication
    needs: [allocate, release_web, release_am, release_eg, release_runtime, release_runtime_omarchy]
    if: >-
      ${{ !cancelled() && vars.CMA_PUBLICATION_SIGNAL_ENABLED == 'true' &&
          needs.allocate.result == 'success' && needs.allocate.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete finalized publication
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PUBLICATION_MATRIX: ${{ needs.allocate.outputs.matrix }}
          CD_PUBLISH_WEB: ${{ needs.release_web.result }}
          CD_PUBLISH_AM: ${{ needs.release_am.result }}
          CD_PUBLISH_EG: ${{ needs.release_eg.result }}
          CD_PUBLISH_RUNTIME: ${{ needs.release_runtime.result }}
          CD_PUBLISH_RUNTIME_OMARCHY: ${{ needs.release_runtime_omarchy.result }}
          CD_FINALIZED_WEB: ${{ needs.release_web.outputs.finalized }}
          CD_FINALIZED_AM: ${{ needs.release_am.outputs.finalized }}
          CD_FINALIZED_EG: ${{ needs.release_eg.outputs.finalized }}
          CD_FINALIZED_RUNTIME: ${{ needs.release_runtime.outputs.finalized }}
          CD_FINALIZED_RUNTIME_OMARCHY: ${{ needs.release_runtime_omarchy.outputs.finalized }}
        run: python3 -B .github/scripts/staging_cd_publication_signal.py freeze
      - name: Retain the verified immutable publication signal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cma-publication-signal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-signal.json
          if-no-files-found: error
          retention-days: 7
      - name: Notify the configured publication consumer
        env:
          PUBLICATION_CONSUMER: ${{ secrets.PUBLICATION_CONSUMER }}
          PUBLICATION_SIGNAL_TOKEN: ${{ secrets.PUBLICATION_SIGNAL_TOKEN }}
        run: python3 -B .github/scripts/staging_cd_publication_signal.py send
  recheck:
    name: Report component outcomes
    outputs:
      release_outcome: ${{ steps.outcome.outputs.release_outcome }}
    needs: [plan, allocate, infrastructure,
            release_web, release_am, release_eg, release_runtime, release_runtime_omarchy,
            promote_web, promote_am, promote_eg, promote_runtime, promote_runtime_omarchy, promote_contract]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify newer merges have a reconciliation run
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: python3 -B .github/scripts/staging_cd_recheck.py
      - name: Report all component outcomes
        id: outcome
        if: always()
        env:
          CD_PLAN_CHANGED: ${{ needs.plan.outputs.changed }}
          CD_ALLOCATION_RESULT: ${{ needs.allocate.result }}
          CD_INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          CD_LANES: ${{ needs.allocate.outputs.lanes }}
          CD_PUBLISH_WEB: ${{ needs.release_web.result }}
          CD_PUBLISH_AM: ${{ needs.release_am.result }}
          CD_PUBLISH_EG: ${{ needs.release_eg.result }}
          CD_PUBLISH_RUNTIME: ${{ needs.release_runtime.result }}
          CD_PUBLISH_RUNTIME_OMARCHY: ${{ needs.release_runtime_omarchy.result }}
          CD_DISPOSITION_WEB: ${{ needs.release_web.outputs.disposition }}
          CD_DISPOSITION_AM: ${{ needs.release_am.outputs.disposition }}
          CD_DISPOSITION_EG: ${{ needs.release_eg.outputs.disposition }}
          CD_DISPOSITION_RUNTIME: ${{ needs.release_runtime.outputs.disposition }}
          CD_DISPOSITION_RUNTIME_OMARCHY: ${{ needs.release_runtime_omarchy.outputs.disposition }}
          CD_FINALIZED_WEB: ${{ needs.release_web.outputs.finalized }}
          CD_FINALIZED_AM: ${{ needs.release_am.outputs.finalized }}
          CD_FINALIZED_EG: ${{ needs.release_eg.outputs.finalized }}
          CD_FINALIZED_RUNTIME: ${{ needs.release_runtime.outputs.finalized }}
          CD_FINALIZED_RUNTIME_OMARCHY: ${{ needs.release_runtime_omarchy.outputs.finalized }}
          CD_PROMOTE_WEB: ${{ toJSON(needs.promote_web) }}
          CD_PROMOTE_AM: ${{ toJSON(needs.promote_am) }}
          CD_PROMOTE_EG: ${{ toJSON(needs.promote_eg) }}
          CD_PROMOTE_RUNTIME: ${{ toJSON(needs.promote_runtime) }}
          CD_PROMOTE_RUNTIME_OMARCHY: ${{ toJSON(needs.promote_runtime_omarchy) }}
          CD_PROMOTE_CONTRACT: ${{ toJSON(needs.promote_contract) }}
        run: python3 -B .github/scripts/staging_cd_component_report.py
