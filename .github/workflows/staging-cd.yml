name: Staging CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.plan.outputs.queue }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Read repository Rust toolchain
        id: toolchain
        run: >-
          python3 -c 'import os,re,tomllib;
          value=tomllib.load(open("api/rust-toolchain.toml","rb"))["toolchain"]["channel"];
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",value);
          open(os.environ["GITHUB_OUTPUT"],"a").write("channel="+value+"\n")'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Install shared selector parsers
        run: |
          python3 -m venv "$RUNNER_TEMP/selector-venv"
          "$RUNNER_TEMP/selector-venv/bin/python" -m pip install -r .github/scripts/ci_tracks/requirements.txt
      - name: Reconcile first-parent merges with the shared selector
        id: plan
        env:
          CD_ADOPTION_SHA: ${{ vars.CMA_CD_ADOPTION_SHA }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_queue.py'
  allocate:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    concurrency:
      group: cma-version-allocation
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.allocate.outputs.matrix }}
      changed: ${{ steps.allocate.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve independent immutable component versions
        id: allocate
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: python3 -B .github/scripts/staging_cd_allocate.py
  release:
    needs: allocate
    if: needs.allocate.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.allocate.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    uses: ./.github/workflows/staging-release.yml
    with:
      component: ${{ matrix.component }}
      tasks: ${{ matrix.tasks }}
  notify:
    needs: [allocate, release]
    if: needs.release.result == 'success' && needs.allocate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: image-publication
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every finalized publication before notifying consumers
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PUBLICATION_MATRIX: ${{ needs.allocate.outputs.matrix }}
        run: python3 -B .github/scripts/publication_signal.py freeze
      - name: Retain the exact signal for independently verified manual recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cma-publication-signal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-signal.json
          if-no-files-found: error
          retention-days: 7
      - name: Notify the configured publication consumer
        env:
          PUBLICATION_CONSUMER: ${{ secrets.PUBLICATION_CONSUMER }}
          PUBLICATION_SIGNAL_TOKEN: ${{ secrets.PUBLICATION_SIGNAL_TOKEN }}
        run: python3 -B .github/scripts/publication_signal.py send
  recheck:
    needs: [plan, allocate, release, notify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify newer merges have a reconciliation run
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: python3 -B .github/scripts/staging_cd_recheck.py
