name: Staging CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      queue: ${{ steps.plan.outputs.queue }}
      head: ${{ steps.plan.outputs.head }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/staging-selector
      - name: Reconcile first-parent merges with the shared selector
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CD_ADOPTION_SHA: ${{ vars.CMA_CD_ADOPTION_SHA }}
          CD_QUEUE_PATH: ${{ runner.temp }}/staging-queue.json
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_queue.py'
      - name: Retain public planning and retirement identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-queue.json
          if-no-files-found: error
          retention-days: 90
  allocate:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    concurrency:
      group: cma-version-allocation
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.allocate.outputs.matrix }}
      changed: ${{ steps.allocate.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/staging-selector
      - name: Reserve independent immutable component versions
        id: allocate
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_allocate.py'
  infrastructure:
    needs: allocate
    if: needs.allocate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrono-ai-staging
    outputs:
      revision: ${{ steps.private.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Restore public tool download cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      - name: Verify and warm public tool downloads before admission
        run: python3 -B .github/scripts/staging_cd_tools.py warm-cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cma-public-tool-cache
          key: deploy-tools-linux-amd64-py312-${{ hashFiles('.github/scripts/staging_cd_tools.py', '.github/scripts/staging_cd_wheels.json') }}
      - name: Create restricted infrastructure reader token
        id: infra-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CMA_INFRA_APP_ID }}
          private-key: ${{ secrets.CMA_INFRA_APP_PRIVATE_KEY }}
          owner: ChronoAIProject
          repositories: cma-infra
          permission-contents: read
      - name: Resolve infrastructure revision once for this release
        id: private
        env:
          CD_INFRA_TOKEN: ${{ steps.infra-token.outputs.token }}
          CD_INFRA_REF: main
        run: python3 -B .github/scripts/staging_cd_checkout.py prepare-app
  release:
    needs: allocate
    if: needs.allocate.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.allocate.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: read
      actions: read
      packages: write
    uses: ./.github/workflows/staging-release.yml
    with:
      component: ${{ matrix.component }}
      tasks: ${{ matrix.tasks }}
  accounting:
    needs: [plan, allocate, release]
    if: always() && needs.plan.result == 'success' && needs.allocate.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/staging-selector
      - name: Verify every required publication and retired-source replacement
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: '"$RUNNER_TEMP/selector-venv/bin/python" -B .github/scripts/staging_cd_accounting.py'
  admit:
    needs: [allocate, release, infrastructure, accounting]
    if: needs.release.result == 'success' && needs.accounting.result == 'success' && needs.allocate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_set: ${{ steps.set.outputs.release_set }}
      started_at: ${{ steps.set.outputs.started_at }}
      changed: ${{ steps.set.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete finalized publication set and record admission
        id: set
        env:
          GH_TOKEN: ${{ github.token }}
          CD_RESOLVE_MODE: automatic
          CD_PUBLICATION_MATRIX: ${{ needs.allocate.outputs.matrix }}
        run: python3 -B .github/scripts/staging_cd_resolve.py
  deploy:
    needs: [admit, infrastructure]
    if: needs.admit.outputs.changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/staging-deploy.yml
    with:
      release_set: ${{ needs.admit.outputs.release_set }}
      started_at: ${{ needs.admit.outputs.started_at }}
      mode: release
      infra_ref: ${{ needs.infrastructure.outputs.revision }}
  recheck:
    needs: [plan, allocate, release, accounting, admit, deploy]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify newer merges have a reconciliation run
        env:
          GH_TOKEN: ${{ github.token }}
          CD_QUEUE: ${{ needs.plan.outputs.queue }}
        run: python3 -B .github/scripts/staging_cd_recheck.py
      - name: Report deployment admission outcome
        if: always()
        env:
          CD_SET_EXPECTED: '${{ needs.admit.outputs.changed }}'
          CD_DEPLOY_JOB_RESULT: ${{ needs.deploy.result }}
          CD_ADMISSION_JOB_RESULT: ${{ needs.admit.result }}
        run: python3 -B .github/scripts/staging_cd_set_report.py
