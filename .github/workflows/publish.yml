name: Publish release

# Runs once a pull request from develop has been merged into main. It decides
# the release version, publishes the three images under it, and then records
# what happened as a tag and a release.
#
# The ordering is the point. The tag is the claim that a version exists and is
# fetchable, so it is written last. Before a fresh release the planner computes
# the next number; on a whole-workflow rerun it instead finds the one canonical
# tag peeled to this commit and reuses it only after its bump, target and exact
# annotation have been verified.
#
# Nothing here changes how anything is deployed. The manifests in infra/ keep
# naming whatever image they already name. CHRONO_SANDBOX_IMAGE especially is
# left alone — under CLAUDE.md section 5 that value is the runtime version
# every live session is measured against, so moving it rotates every session.
# Publishing an image is not a decision to adopt it, and the two must stay
# separate steps.

on:
  push:
    branches: [main]

# Two merges landing close together would read the same latest tag and compute
# the same next version, and the second would collide.
#
# cancel-in-progress: false protects the run that is already going, and that is
# all it protects: a group holds one pending run, so a third merge arriving
# during a publish supersedes the second one's pending run rather than joining
# a queue behind it. Releasing three times inside one build window is not a
# thing this branch does — every merge into main is a release — but if it
# happens, the superseded run is re-runnable from the Actions tab and its
# version is still unclaimed.
concurrency:
  group: publish-release
  cancel-in-progress: false

# Granted per job instead, so the job that pushes images cannot write refs and
# the job that writes the tag cannot push images.
permissions: {}

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags included: the next version is computed from the highest one.
          fetch-depth: 0

      - name: Find the pull request this commit came from
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Filtered to pull requests targeting main, because the endpoint
          # reports every pull request containing the commit — which for a
          # merge commit includes the develop-side ones it carries.
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")] | first | .number // empty')
          if [ -z "$number" ]; then
            echo "::error::commit $GITHUB_SHA reached main outside a pull request, so no bump level was declared and no version can be derived; revert and merge it through the release process"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Read the declared bump and the release notes
        id: declaration
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Checked again here rather than trusted from the gate: an
          # administrator can merge past a failing check, and this job would
          # otherwise turn an unlabelled merge into a released version.
          levels=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select(startswith("release:"))] | join(" ")')
          case "$levels" in
            release:major) level="major" ;;
            release:minor) level="minor" ;;
            release:patch) level="patch" ;;
            *)
              echo "::error::pull request #$PR must carry exactly one of release:major, release:minor, release:patch (found: ${levels:-none})"
              exit 1
              ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"

          # The same script the gate ran, so what ships is the section that was
          # reviewed. Only the Release Notes section survives it; whatever else
          # the body said was addressed to the reviewer.
          gh pr view "$PR" --json body --jq '.body // ""' \
            | .github/release-notes.sh > "$RUNNER_TEMP/notes.md"

      - name: Compute the next version
        id: version
        env:
          LEVEL: ${{ steps.declaration.outputs.level }}
        run: |
          set -euo pipefail
          .github/plan-release.sh \
            "$LEVEL" "$GITHUB_SHA" "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_SERVER_URL" "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/release.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release.md
          retention-days: 7
          overwrite: true

  images:
    name: Images
    needs: plan
    runs-on: ubuntu-latest
    # Well above a cold cacheless build, so this catches a stall rather than
    # slowness, matching the equivalent job in ci.yml.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # One component failing must not strand the others half-published; the
      # release job will not run either way.
      fail-fast: false
      matrix:
        component: [api, web, runtime]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve the image reference
        id: image
        run: |
          set -euo pipefail
          # GHCR rejects an uppercase path, and the organisation is spelled
          # ChronoAIProject.
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "repository=ghcr.io/${owner}/cma-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pinned Skopeo
        id: skopeo
        run: |
          set -euo pipefail
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$auth_file" ]; then
            echo "::error::docker login did not create its authentication file"
            exit 1
          fi

          wrapper="$RUNNER_TEMP/skopeo-${{ matrix.component }}"
          cat > "$wrapper" <<'SKOPEO'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${SKOPEO_HOST_AUTHFILE:?}"
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${SKOPEO_HOST_AUTHFILE}:/auth/config.json:ro" \
            quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810 \
            "$@"
          SKOPEO
          chmod 0700 "$wrapper"
          {
            echo "command=$wrapper"
            echo "auth_file=$auth_file"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile existing release image tags
        id: reconcile
        env:
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
        run: |
          set -euo pipefail
          skopeo_version=$("$SKOPEO_COMMAND" --version)
          if ! printf '%s\n' "$skopeo_version" \
            | grep -Eq '^skopeo version 1\.22\.2( commit: [0-9a-f]{7,40})?$'; then
            echo "::error::unexpected pinned Skopeo version: $skopeo_version"
            exit 1
          fi
          .github/reconcile-release-image.sh \
            "${{ matrix.component }}" \
            "${{ needs.plan.outputs.version }}" \
            "$GITHUB_SHA" \
            "${{ steps.image.outputs.repository }}"

      - name: Validate the image reconciliation decision
        env:
          REUSE: ${{ steps.reconcile.outputs.reuse }}
        run: |
          set -euo pipefail
          case "$REUSE" in
            true | false) ;;
            *)
              echo "::error::image reconciliation did not return an exact reuse decision"
              exit 1
              ;;
          esac

      # arm64 builds run under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: success() && steps.reconcile.outputs.reuse == 'false'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: success() && steps.reconcile.outputs.reuse == 'false'

      # Built and scanned before anything is pushed. The runtime's final OS
      # refresh deliberately runs again for this workflow attempt, so a fix or
      # vulnerability published after the pull-request scan is evaluated here
      # before the image becomes a release artifact.
      - name: Build the native image for scanning
        if: success() && steps.reconcile.outputs.reuse == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cma-${{ matrix.component }}:release
          build-args: |
            CHRONO_BUILD=${{ needs.plan.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Populated by ci.yml. A run on main can restore caches from main and
          # from the default branch, and develop is the default branch, so the
          # layers the merged pull request built are still warm here.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Vulnerability scan
        if: success() && steps.reconcile.outputs.reuse == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cma-${{ matrix.component }}:release
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Reuses the layers cached above, so this is close to an upload.
      #
      # Platforms match ci.yml, so what ships is what CI validated. Only web
      # carries arm64: emulated Rust builds ran for hours there and every node
      # in the target cluster is amd64 anyway.
      #
      # provenance is off deliberately. With it on, buildx wraps even a
      # single-platform image in an index carrying an attestation, and these
      # images are expected to be pulled and re-pushed into whichever registry
      # a deployment uses. A plain image survives that; an index of
      # attestations is where such copies start behaving differently.
      - name: Recheck release image tag absence
        if: success() && steps.reconcile.outputs.reuse == 'false'
        env:
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
        run: |
          set -euo pipefail
          .github/assert-release-image-tags-absent.sh \
            "${{ matrix.component }}" \
            "${{ needs.plan.outputs.version }}" \
            "$GITHUB_SHA" \
            "${{ steps.image.outputs.repository }}"

      - name: Publish
        if: success() && steps.reconcile.outputs.reuse == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.component == 'web' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # OCI media types are required for a digest-preserving OCI archive.
          # A Docker manifest list would have to be rewritten during export,
          # which --preserve-digests correctly refuses.
          outputs: type=registry,oci-mediatypes=true
          provenance: false
          # These tags are intended to be assigned once. GHCR has no tag CAS;
          # the second absence check only narrows stale-read overwrite risk.
          # The audited writer/history fence is documented in docs/Release.md.
          # The version is what a deployment names; the short SHA traces an
          # image already in hand back to its commit.
          # web's status band and api's discovery responses bake the version
          # so they name the release actually running. Ignored by runtime.
          build-args: |
            CHRONO_BUILD=${{ needs.plan.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ needs.plan.outputs.version }}
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}

  image-exports:
    name: Image export
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      # These are transfer artifacts for images already published above. A
      # failed leg can be re-run without rebuilding or moving either image tag.
      fail-fast: false
      matrix:
        component: [api, web, runtime]
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the image and export paths
        id: image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          revision=${GITHUB_SHA:0:7}
          output="$RUNNER_TEMP/cma-${{ matrix.component }}-${VERSION}-${revision}-oci"
          mkdir -p "$output"
          {
            echo "repository=ghcr.io/${owner}/cma-${{ matrix.component }}"
            echo "revision=$revision"
            echo "output=$output"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pinned Skopeo
        id: skopeo
        run: |
          set -euo pipefail
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$auth_file" ]; then
            echo "::error::docker login did not create its authentication file"
            exit 1
          fi

          wrapper="$RUNNER_TEMP/skopeo-${{ matrix.component }}"
          cat > "$wrapper" <<'SKOPEO'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${SKOPEO_HOST_AUTHFILE:?}"
          : "${SKOPEO_OUTPUT_DIR:?}"
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${SKOPEO_HOST_AUTHFILE}:/auth/config.json:ro" \
            --volume "${SKOPEO_OUTPUT_DIR}:/output:rw" \
            --workdir /output \
            quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810 \
            "$@"
          SKOPEO
          chmod 0700 "$wrapper"
          {
            echo "command=$wrapper"
            echo "auth_file=$auth_file"
          } >> "$GITHUB_OUTPUT"

      - name: Export the published image
        env:
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
          SKOPEO_OUTPUT_DIR: ${{ steps.image.outputs.output }}
        run: |
          set -euo pipefail
          skopeo_version=$("$SKOPEO_COMMAND" --version)
          if ! printf '%s\n' "$skopeo_version" \
            | grep -Eq '^skopeo version 1\.22\.2( commit: [0-9a-f]{7,40})?$'; then
            echo "::error::unexpected pinned Skopeo version: $skopeo_version"
            exit 1
          fi
          .github/export-release-image.sh \
            "${{ matrix.component }}" \
            "${{ needs.plan.outputs.version }}" \
            "$GITHUB_SHA" \
            "${{ steps.image.outputs.repository }}" \
            "${{ steps.image.outputs.output }}"

      - name: Upload the OCI transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cma-${{ matrix.component }}-${{ needs.plan.outputs.version }}-${{ steps.image.outputs.revision }}-oci
          path: |
            ${{ steps.image.outputs.output }}/cma-${{ matrix.component }}-${{ needs.plan.outputs.version }}-${{ steps.image.outputs.revision }}.oci.tar
            ${{ steps.image.outputs.output }}/cma-${{ matrix.component }}-${{ needs.plan.outputs.version }}-${{ steps.image.outputs.revision }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  runtime-image-gate:
    name: Runtime image D-09 gate
    needs: [plan, images, image-exports]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      # This is deliberately first. Every dependency, checkout, artifact,
      # registry, or campaign failure must still leave one closed record.
      - name: Initialize closed release-image evidence
        if: ${{ always() }}
        env:
          D09_EVIDENCE_PATH: ${{ runner.temp }}/cma-trigger-d09-release.json
          D09_FALLBACK_PATH: ${{ runner.temp }}/cma-trigger-d09-release-fallback.json
        run: |
          set -euo pipefail
          now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg started_at "$now" \
            --arg recorded_at "$now" \
            --arg build_commit "$GITHUB_SHA" \
            '{
              schema: "cma-trigger-d09-v3",
              evidenceClass: "D",
              result: "inconclusive",
              startedAt: $started_at,
              recordedAt: $recorded_at,
              buildCommit: $build_commit,
              image: null,
              artifacts: null,
              failure: {code: "release_image_gate_incomplete"},
              cleanup: {status: "not_started", failureCodes: []},
              redaction: "Only closed outcomes, status classes, artifact hashes, synthetic identities, and counts are retained; provider bodies and credential values are discarded."
            }' > "$D09_FALLBACK_PATH"
          cp "$D09_FALLBACK_PATH" "$D09_EVIDENCE_PATH"

      - name: Require successful image publication and export
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          EXPORTS_RESULT: ${{ needs['image-exports'].result }}
        run: |
          set -euo pipefail
          for dependency in \
            "plan:$PLAN_RESULT" \
            "images:$IMAGES_RESULT" \
            "image-exports:$EXPORTS_RESULT"; do
            name=${dependency%%:*}
            result=${dependency#*:}
            if [ "$result" != success ]; then
              echo "::error::$name did not complete successfully ($result)"
              exit 1
            fi
          done

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Resolve the exact runtime OCI artifact
        id: runtime_artifact
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release planning returned a non-canonical version"
            exit 1
          fi
          revision=${GITHUB_SHA:0:7}
          base="cma-runtime-${VERSION}-${revision}"
          {
            echo "artifact_name=${base}-oci"
            echo "metadata_path=$RUNNER_TEMP/runtime-export/${base}.json"
            echo "archive_path=$RUNNER_TEMP/runtime-export/${base}.oci.tar"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact runtime OCI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.runtime_artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/runtime-export

      - name: Validate the runtime OCI metadata and archive
        id: runtime_identity
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          METADATA_PATH: ${{ steps.runtime_artifact.outputs.metadata_path }}
          ARCHIVE_PATH: ${{ steps.runtime_artifact.outputs.archive_path }}
        run: |
          set -euo pipefail
          revision=${GITHUB_SHA:0:7}
          base="cma-runtime-${VERSION}-${revision}"
          export_dir=$(dirname "$METADATA_PATH")
          if [ ! -f "$METADATA_PATH" ] || [ -L "$METADATA_PATH" ]; then
            echo "::error::runtime OCI metadata is missing or is not a regular file"
            exit 1
          fi
          if [ ! -f "$ARCHIVE_PATH" ] || [ -L "$ARCHIVE_PATH" ]; then
            echo "::error::runtime OCI archive is missing or is not a regular file"
            exit 1
          fi
          entry_count=$(find "$export_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$entry_count" -ne 2 ]; then
            echo "::error::runtime OCI artifact must contain exactly its archive and metadata"
            exit 1
          fi

          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          expected_repository="ghcr.io/${owner}/cma-runtime"
          jq -e \
            --arg version "$VERSION" \
            --arg revision "$revision" \
            --arg full_revision "$GITHUB_SHA" \
            --arg repository "$expected_repository" \
            --arg archive "${base}.oci.tar" \
            'type == "object"
              and (keys == [
                "archive", "archiveReference", "archiveSha256", "component",
                "fullRevision", "platforms", "revision", "revisionReference",
                "schemaVersion", "sourceDigest", "sourceReference",
                "sourceRepository", "version", "versionReference"
              ])
              and (.schemaVersion == 1)
              and (.component == "runtime")
              and (.version == $version)
              and (.revision == $revision)
              and (.fullRevision == $full_revision)
              and (.sourceRepository == $repository)
              and (.versionReference == ($repository + ":" + $version))
              and (.revisionReference == ($repository + ":" + $revision))
              and ((.sourceDigest | type) == "string")
              and (.sourceDigest | test("^sha256:[0-9a-f]{64}$"))
              and (.sourceReference == ($repository + "@" + .sourceDigest))
              and (.archive == $archive)
              and (.archiveReference == $version)
              and ((.archiveSha256 | type) == "string")
              and (.archiveSha256 | test("^sha256:[0-9a-f]{64}$"))
              and (.platforms == ["linux/amd64"])' \
            "$METADATA_PATH" >/dev/null

          actual_archive_sha="sha256:$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"
          expected_archive_sha=$(jq -er '.archiveSha256' "$METADATA_PATH")
          if [ "$actual_archive_sha" != "$expected_archive_sha" ]; then
            echo "::error::runtime OCI archive checksum does not match its metadata"
            exit 1
          fi
          source_reference=$(jq -er '.sourceReference' "$METADATA_PATH")
          echo "source_reference=$source_reference" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the immutable runtime image
        env:
          SOURCE_REFERENCE: ${{ steps.runtime_identity.outputs.source_reference }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE_REFERENCE"

      - name: Prepare Codex bubblewrap AppArmor profile
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apparmor-profiles \
            apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Prove the release runtime network boundary
        env:
          SOURCE_REFERENCE: ${{ steps.runtime_identity.outputs.source_reference }}
          D09_EVIDENCE_PATH: ${{ runner.temp }}/cma-trigger-d09-release.json
        run: |
          set -euo pipefail
          node --check .github/scripts/cma-trigger-runtime-image-smoke.mjs
          node .github/scripts/cma-trigger-runtime-image-smoke.mjs --self-test
          node .github/scripts/cma-trigger-runtime-image-smoke.mjs \
            --image "$SOURCE_REFERENCE" \
            --build-commit "$GITHUB_SHA" \
            --expected-architecture amd64 \
            --output "$D09_EVIDENCE_PATH"

      - name: Close release-image evidence
        if: ${{ always() }}
        env:
          SOURCE_REFERENCE: ${{ steps.runtime_identity.outputs.source_reference }}
          D09_EVIDENCE_PATH: ${{ runner.temp }}/cma-trigger-d09-release.json
          D09_FALLBACK_PATH: ${{ runner.temp }}/cma-trigger-d09-release-fallback.json
        run: |
          set -euo pipefail
          if ! jq -e \
            --arg build_commit "$GITHUB_SHA" \
            --arg source_reference "$SOURCE_REFERENCE" \
            'def sha256:
               (type == "string") and test("^[0-9a-f]{64}$");
             def bounded_body:
               ((.bodyBytes | type) == "number")
               and (.bodyBytes >= 0 and .bodyBytes <= 65536)
               and ((.bodyBytes | floor) == .bodyBytes)
               and (.bodySha256 | sha256);
             type == "object"
              and (.schema == "cma-trigger-d09-v3")
              and (.evidenceClass == "D")
              and (.result == "pass" or .result == "fail" or .result == "inconclusive")
              and ((.startedAt | type) == "string" and (.startedAt | length) > 0)
              and ((.recordedAt | type) == "string" and (.recordedAt | length) > 0)
              and (.buildCommit == $build_commit)
              and (has("image"))
              and (has("artifacts"))
              and ((.cleanup | type) == "object")
              and ((.cleanup.status | type) == "string")
              and ((.cleanup.failureCodes | type) == "array")
              and (.redaction == "Only closed outcomes, status classes, artifact hashes, synthetic identities, and counts are retained; provider bodies and credential values are discarded.")
              and (if .result == "pass"
                   then ((keys == [
                           "artifacts", "buildCommit", "capability", "cleanup",
                           "connect", "evidenceClass", "image", "isolationDenials",
                           "listeners", "managedDenials", "outcomes",
                           "permissionProfile", "providerFixture", "recordedAt",
                           "redaction", "result", "schema", "startedAt",
                           "startupRefusals", "traversal", "workspaceFence"
