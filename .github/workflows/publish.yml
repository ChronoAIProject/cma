name: Publish release

# Runs once a pull request from develop has been merged into main. It decides
# the release version, publishes the four images under it, and then records
# what happened as a tag and a release.
#
# The ordering is the point. The tag is the claim that a version exists and is
# fetchable, so it is written last. Before a fresh release the planner computes
# the next number; on a whole-workflow rerun it instead finds the one canonical
# tag peeled to this commit and reuses it only after its bump, target and exact
# annotation have been verified.
#
# Nothing here changes how anything is deployed. The manifests in infra/ keep
# naming whatever image they already name. `CHRONO_SANDBOX_IMAGE` is left
# alone: publishing an image is not a decision to adopt it, and the two must
# stay separate steps.

on:
  push:
    branches: [main]

# Two merges landing close together would read the same latest tag and compute
# the same next version, and the second would collide.
#
# cancel-in-progress: false protects the run that is already going, and that is
# all it protects: a group holds one pending run, so a third merge arriving
# during a publish supersedes the second one's pending run rather than joining
# a queue behind it. Releasing three times inside one build window is not a
# thing this branch does — every merge into main is a release — but if it
# happens, the superseded run is re-runnable from the Actions tab and its
# version is still unclaimed.
concurrency:
  group: publish-release
  cancel-in-progress: false

# Granted per job instead, so the job that pushes images cannot write refs and
# the job that writes the tag cannot push images.
permissions: {}

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags included: the next version is computed from the highest one.
          fetch-depth: 0

      - name: Find the pull request this commit came from
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Filtered to pull requests targeting main, because the endpoint
          # reports every pull request containing the commit — which for a
          # merge commit includes the develop-side ones it carries.
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")] | first | .number // empty')
          if [ -z "$number" ]; then
            echo "::error::commit $GITHUB_SHA reached main outside a pull request, so no bump level was declared and no version can be derived; revert and merge it through the release process"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Read the declared bump and the release notes
        id: declaration
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Checked again here rather than trusted from the gate: an
          # administrator can merge past a failing check, and this job would
          # otherwise turn an unlabelled merge into a released version.
          levels=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select(startswith("release:"))] | join(" ")')
          case "$levels" in
            release:major) level="major" ;;
            release:minor) level="minor" ;;
            release:patch) level="patch" ;;
            *)
              echo "::error::pull request #$PR must carry exactly one of release:major, release:minor, release:patch (found: ${levels:-none})"
              exit 1
              ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"

          # The same script the gate ran, so what ships is the section that was
          # reviewed. Only the Release Notes section survives it; whatever else
          # the body said was addressed to the reviewer.
          gh pr view "$PR" --json body --jq '.body // ""' \
            | .github/release-notes.sh > "$RUNNER_TEMP/notes.md"

      - name: Compute the next version
        id: version
        env:
          LEVEL: ${{ steps.declaration.outputs.level }}
        run: |
          set -euo pipefail
          .github/plan-release.sh \
            "$LEVEL" "$GITHUB_SHA" "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_SERVER_URL" "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/release.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release.md
          retention-days: 7
          overwrite: true

  images:
    name: Images
    needs: plan
    runs-on: ubuntu-latest
    # Well above a cold cacheless build, so this catches a stall rather than
    # slowness, matching the equivalent job in ci.yml.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # One component failing must not strand the others half-published; the
      # release job will not run either way.
      fail-fast: false
      matrix:
        component: [api, web, runtime, cmaeg]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve the image reference
        id: image
        run: |
          set -euo pipefail
          # GHCR rejects an uppercase path, and the organisation is spelled
          # ChronoAIProject.
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "repository=ghcr.io/${owner}/cma-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pinned Skopeo
        id: skopeo
        run: |
          set -euo pipefail
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$auth_file" ]; then
            echo "::error::docker login did not create its authentication file"
            exit 1
          fi

          wrapper="$RUNNER_TEMP/skopeo-${{ matrix.component }}"
          cat > "$wrapper" <<'SKOPEO'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${SKOPEO_HOST_AUTHFILE:?}"
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${SKOPEO_HOST_AUTHFILE}:/auth/config.json:ro" \
            quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810 \
            "$@"
          SKOPEO
          chmod 0700 "$wrapper"
          {
            echo "command=$wrapper"
            echo "auth_file=$auth_file"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile existing release image tags
        id: reconcile
        env:
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
        run: |
          set -euo pipefail
          skopeo_version=$("$SKOPEO_COMMAND" --version)
          if ! printf '%s\n' "$skopeo_version" \
            | grep -Eq '^skopeo version 1\.22\.2( commit: [0-9a-f]{7,40})?$'; then
            echo "::error::unexpected pinned Skopeo version: $skopeo_version"
            exit 1
          fi
          .github/reconcile-release-image.sh \
            "${{ matrix.component }}" \
            "${{ needs.plan.outputs.version }}" \
            "$GITHUB_SHA" \
            "${{ steps.image.outputs.repository }}"

      - name: Validate the image reconciliation decision
        env:
          REUSE: ${{ steps.reconcile.outputs.reuse }}
        run: |
          set -euo pipefail
          case "$REUSE" in
            true | false) ;;
            *)
              echo "::error::image reconciliation did not return an exact reuse decision"
              exit 1
              ;;
          esac

      # arm64 builds run under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: success() && steps.reconcile.outputs.reuse == 'false'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: success() && steps.reconcile.outputs.reuse == 'false'

      # Built and scanned before anything is pushed. The runtime's final OS
      # refresh deliberately runs again for this workflow attempt, so a fix or
      # vulnerability published after the pull-request scan is evaluated here
      # before the image becomes a release artifact.
      - name: Build the native image for scanning
        if: success() && steps.reconcile.outputs.reuse == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cma-${{ matrix.component }}:release
          build-args: |
            CHRONO_BUILD=${{ needs.plan.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Populated by ci.yml. A run on main can restore caches from main and
          # from the default branch, and develop is the default branch, so the
          # layers the merged pull request built are still warm here.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify web bundle identity against image metadata
        if: success() && steps.reconcile.outputs.reuse == 'false' && matrix.component == 'web'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 .github/scripts/web-build-identity.py cma-web:release "$GITHUB_SHA" "$RELEASE_VERSION"

      - name: Vulnerability scan
        if: success() && steps.reconcile.outputs.reuse == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cma-${{ matrix.component }}:release
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Reuses the layers cached above, so this is close to an upload.
      #
      # Platforms match ci.yml, so what ships is what CI validated. Only web
      # carries arm64: emulated Rust builds ran for hours there and every node
      # in the target cluster is amd64 anyway.
      #
      # provenance is off deliberately. With it on, buildx wraps even a
      # single-platform image in an index carrying an attestation, and these
      # images are expected to be pulled and re-pushed into whichever registry
      # a deployment uses. A plain image survives that; an index of
      # attestations is where such copies start behaving differently.
      - name: Recheck release image tag absence
        if: success() && steps.reconcile.outputs.reuse == 'false'
        env:
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
        run: |
          set -euo pipefail
          .github/assert-release-image-tags-absent.sh \
            "${{ matrix.component }}" \
            "${{ needs.plan.outputs.version }}" \
            "$GITHUB_SHA" \
            "${{ steps.image.outputs.repository }}"

      - name: Publish
        if: success() && steps.reconcile.outputs.reuse == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.component == 'web' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # OCI media types are required for a digest-preserving OCI archive.
          # A Docker manifest list would have to be rewritten during export,
          # which --preserve-digests correctly refuses.
          outputs: type=registry,oci-mediatypes=true
          provenance: false
          # These tags are intended to be assigned once. GHCR has no tag CAS;
          # the second absence check only narrows stale-read overwrite risk.
          # The audited writer/history fence is documented in docs/Release.md.
          # The version is what a deployment names; the short SHA traces an
          # image already in hand back to its commit.
          # web's status band and api's discovery responses bake the version
          # so they name the release actually running. Ignored by runtime.
          build-args: |
            CHRONO_BUILD=${{ needs.plan.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ needs.plan.outputs.version }}
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}

  image-exports:
    name: Image export
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      # These are transfer artifacts for images already published above. A
      # failed leg can be re-run without rebuilding or moving either image tag.
      fail-fast: false
      matrix:
        component: [api, web, runtime, cmaeg]
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the image and export paths
        id: image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          revision=${GITHUB_SHA:0:7}
          output="$RUNNER_TEMP/cma-${{ matrix.component }}-${VERSION}-${revision}-oci"
          mkdir -p "$output"
          {
            echo "repository=ghcr.io/${owner}/cma-${{ matrix.component }}"
            echo "revision=$revision"
            echo "output=$output"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pinned Skopeo
        id: skopeo
        run: |
          set -euo pipefail
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$auth_file" ]; then
            echo "::error::docker login did not create its authentication file"
            exit 1
          fi

          wrapper="$RUNNER_TEMP/skopeo-${{ matrix.component }}"
          cat > "$wrapper" <<'SKOPEO'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${SKOPEO_HOST_AUTHFILE:?}"
          : "${SKOPEO_OUTPUT_DIR:?}"
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${SKOPEO_HOST_AUTHFILE}:/auth/config.json:ro" \
            --volume "${SKOPEO_OUTPUT_DIR}:/output:rw" \
            --workdir /output \
            quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810 \
            "$@"
          SKOPEO
          chmod 0700 "$wrapper"
          {
            echo "command=$wrapper"
            echo "auth_file=$auth_file"
          } >> "$GITHUB_OUTPUT"

      - name: Export the published image
        env:
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
          SKOPEO_OUTPUT_DIR: ${{ steps.image.outputs.output }}
        run: |
          set -euo pipefail
          skopeo_version=$("$SKOPEO_COMMAND" --version)
          if ! printf '%s\n' "$skopeo_version" \
            | grep -Eq '^skopeo version 1\.22\.2( commit: [0-9a-f]{7,40})?$'; then
            echo "::error::unexpected pinned Skopeo version: $skopeo_version"
            exit 1
          fi
          .github/export-release-image.sh \
            "${{ matrix.component }}" \
            "${{ needs.plan.outputs.version }}" \
            "$GITHUB_SHA" \
            "${{ steps.image.outputs.repository }}" \
            "${{ steps.image.outputs.output }}"

      - name: Upload the OCI transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cma-${{ matrix.component }}-${{ needs.plan.outputs.version }}-${{ steps.image.outputs.revision }}-oci
          path: |
            ${{ steps.image.outputs.output }}/cma-${{ matrix.component }}-${{ needs.plan.outputs.version }}-${{ steps.image.outputs.revision }}.oci.tar
            ${{ steps.image.outputs.output }}/cma-${{ matrix.component }}-${{ needs.plan.outputs.version }}-${{ steps.image.outputs.revision }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  runtime-image-gate:
    name: Runtime image evidence
    needs: [plan, images, image-exports]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Resolve exact runtime artifact
        id: artifact
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: echo "name=cma-runtime-${RELEASE_VERSION}-${GITHUB_SHA:0:7}-oci" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/runtime-export
      - name: Verify exact runtime artifact bytes and source
        id: runtime
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/release-runtime-input.mjs "$RUNNER_TEMP/runtime-export" "$GITHUB_SHA" "$RELEASE_VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull verified immutable runtime
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: docker pull "$RUNTIME_REFERENCE"
      - name: Execute published runtime image contract
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: node .github/scripts/runtime-image-evidence.mjs run "$RUNTIME_REFERENCE" "$GITHUB_SHA" "$RUNNER_TEMP/runtime-image-evidence.json"
      - name: Qualify published runtime ledger storage
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: node .github/scripts/runtime-ledger-evidence.mjs "$RUNTIME_REFERENCE" "$GITHUB_SHA" "$RUNNER_TEMP/ledger-storage.json"
      - name: Retain ledger storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ledger-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ledger-storage.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain runtime image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-image-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Require passing runtime image evidence
        if: always()
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: node .github/scripts/runtime-image-evidence.mjs verify "$RUNTIME_REFERENCE" "$GITHUB_SHA" "$RUNNER_TEMP/runtime-image-evidence.json"

  release:
    name: Tag and release
    needs: [plan, images, image-exports, runtime-image-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Show the assembled release notes
        run: cat "$RUNNER_TEMP/notes/release.md"

      - name: Verify the current run's image artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          artifact_json="$RUNNER_TEMP/release-artifacts.json"
          if ! gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$artifact_json"; then
            echo "::error::could not list artifacts for the current workflow run"
            exit 1
          fi

          if ! jq -e '
            type == "object"
            and (.artifacts | type == "array")
            and (.total_count | type == "number" and . >= 0 and floor == .)
            and .total_count == (.artifacts | length)
            and all(.artifacts[]; type == "object")
          ' "$artifact_json" >/dev/null; then
            echo "::error::artifact response is malformed or requires pagination"
            exit 1
          fi

          revision=${GITHUB_SHA:0:7}
          for component in api web runtime cmaeg; do
            expected="cma-${component}-${VERSION}-${revision}-oci"
            matches=$(jq -r --arg name "$expected" \
              '[.artifacts[] | select(.name == $name)] | length' \
              "$artifact_json")
            if [ "$matches" -ne 1 ]; then
              echo "::error::expected exactly one current-run artifact named $expected (found $matches)"
              exit 1
            fi
            if ! jq -e --arg name "$expected" '
              [.artifacts[] | select(.name == $name)][0]
              | .expired == false
                and (.size_in_bytes | type == "number" and . > 0 and floor == .)
            ' "$artifact_json" >/dev/null; then
              echo "::error::artifact $expected is expired, empty, or malformed"
              exit 1
            fi
          done

      - name: Tag the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/reconcile-github-release.sh \
            tag "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/notes/release.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          .github/reconcile-github-release.sh \
            release "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/notes/release.md"

  # ── Carry the release merge back to develop ──────────────────────────────
  #
  # Merging develop into main creates a merge commit *on main* that develop
  # never receives, so main ends every release one commit ahead. The next
  # release PR then reads BEHIND and cannot merge until somebody notices and
  # back-merges by hand.
  #
  # That happened after v0.1.0 (#196), after v0.2.0 (#221) and after v0.3.0
  # (#239) — three releases, three identical manual fixes, each one clearing
  # the instance and none of them the cause. This is the cause.
  #
  # A pull request rather than a push: develop is protected, and §"Never force
  # push" is not negotiable for a convenience. A conflicting back-merge is left
  # open rather than resolved, because a conflict means develop moved during
  # the release and guessing at it is how a release silently reverts something.
  back-merge:
    name: Back-merge into develop
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open or update the back-merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing to do when develop already contains this commit, which is
          # the case for a release cut from a develop that nothing has moved.
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "develop already contains $VERSION; nothing to carry back"
            exit 0
          fi

          branch="chore/back-merge-$VERSION"
          git checkout -B "$branch" origin/develop
          if ! git merge --no-edit "$GITHUB_SHA"; then
            # Left for a person. develop moved during the release, and a
            # resolution chosen here could revert something silently.
            git merge --abort
            echo "::error::$VERSION conflicts with develop; back-merge by hand"
            exit 1
          fi
          git push origin "$branch"

          existing_pr="$(
            gh pr list --base develop --head "$branch" --state open \
              --json url --jq '.[0].url // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            echo "back-merge pull request already open: $existing_pr"
            exit 0
          fi

          gh pr create --base develop --head "$branch" \
            --title "chore: take $VERSION's release merge back into develop" \
            --body "Opened by the publish workflow.

          Merging \`develop\` into \`main\` leaves a merge commit on \`main\` that
          \`develop\` never receives, so every release ends with \`main\` one commit
          ahead and the next release PR reading \`BEHIND\`.

          Carries no content — only the merge commit."
