name: Publish release

# Runs once a pull request from develop has been merged into main. It decides
# the release version, assigns it to the images staging already verified, and
# then records what happened as a tag and a release.
#
# Nothing is rebuilt. Every published image (Agent Manager, Event Gateway,
# web and both runtimes) is the newest staging-verified version whose source
# is the merged develop commit or an earlier one, selected the way production
# promotion selects, so each image is built and scanned once, by the reviewed
# staging publication gate.
#
# The ordering is the point. The tag is the claim that a version exists and is
# fetchable, so it is written last. Before a fresh release the planner computes
# the next number; on a whole-workflow rerun it instead finds the one canonical
# tag peeled to this commit and reuses it only after its bump, target and exact
# annotation have been verified.
#
# Nothing here changes how anything is deployed. prod-cd deploys the same
# staging-verified digests after approval; externally maintained manifests
# keep naming whatever image they already name. `CHRONO_SANDBOX_IMAGE` is left
# alone: publishing an image is not a decision to adopt it, and the two must
# stay separate steps.

on:
  push:
    branches: [main]

# Two merges landing close together would read the same latest tag and compute
# the same next version, and the second would collide.
#
# cancel-in-progress: false protects the run that is already going, and that is
# all it protects: a group holds one pending run, so a third merge arriving
# during a publish supersedes the second one's pending run rather than joining
# a queue behind it. Releasing three times inside one build window is not a
# thing this branch does — every merge into main is a release — but if it
# happens, the superseded run is re-runnable from the Actions tab and its
# version is still unclaimed: version image tags are assigned only after the
# runtime evidence and every short-SHA tag passed.
concurrency:
  group: publish-release
  cancel-in-progress: false

# Granted per job instead, so the job that pushes images cannot write refs and
# the job that writes the tag cannot push images.
permissions: {}

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Tags included: the next version is computed from the highest one.
          fetch-depth: 0

      - name: Find the pull request this commit came from
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Filtered to pull requests targeting main, because the endpoint
          # reports every pull request containing the commit — which for a
          # merge commit includes the develop-side ones it carries.
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")] | first | .number // empty')
          if [ -z "$number" ]; then
            echo "::error::commit $GITHUB_SHA reached main outside a pull request, so no bump level was declared and no version can be derived; revert and merge it through the release process"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Read the declared bump and the release notes
        id: declaration
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Checked again here rather than trusted from the gate: an
          # administrator can merge past a failing check, and this job would
          # otherwise turn an unlabelled merge into a released version.
          levels=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select(startswith("release:"))] | join(" ")')
          case "$levels" in
            release:major) level="major" ;;
            release:minor) level="minor" ;;
            release:patch) level="patch" ;;
            *)
              echo "::error::pull request #$PR must carry exactly one of release:major, release:minor, release:patch (found: ${levels:-none})"
              exit 1
              ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"

          # The same script the gate ran, so what ships is the section that was
          # reviewed. Only the Release Notes section survives it; whatever else
          # the body said was addressed to the reviewer.
          gh pr view "$PR" --json body --jq '.body // ""' \
            | .github/release-notes.sh > "$RUNNER_TEMP/notes.md"

      - name: Compute the next version
        id: version
        env:
          LEVEL: ${{ steps.declaration.outputs.level }}
        run: |
          set -euo pipefail
          .github/plan-release.sh \
            "$LEVEL" "$GITHUB_SHA" "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_SERVER_URL" "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/release.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: ${{ runner.temp }}/release.md
          retention-days: 7
          overwrite: true

  # The images a release records were built and scanned once, by the reviewed
  # staging publication gate, and staging deployed and verified each exact
  # digest. A release selects them the way production promotion does and
  # never rebuilds, so the bytes behind a version tag are the bytes staging
  # verified and production runs.
  select:
    name: Select the staging-verified images
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select every published image staging verified for the merged develop commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release_promotion.py select

  runtime-image-gate:
    name: Runtime image evidence
    needs: [plan, select]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      # Runs before any tag is assigned. The digest-pinned reference is content
      # addressed, so the pull below receives exactly the bytes the release
      # tags. The image records the develop commit staging built it from, not
      # the release merge.
      - name: Resolve the promoted runtime
        id: runtime
        env:
          RELEASE_IMAGES: ${{ needs.select.outputs.images }}
        run: |
          set -euo pipefail
          reference=$(jq -er '.runtime | select(.repository == "ghcr.io/chronoaiproject/cma-runtime") | .repository + "@" + .digest' <<< "$RELEASE_IMAGES")
          source=$(jq -er '.runtime.source' <<< "$RELEASE_IMAGES")
          [[ "$reference" =~ ^ghcr\.io/chronoaiproject/cma-runtime@sha256:[0-9a-f]{64}$ && "$source" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "reference=$reference"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull verified immutable runtime
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: docker pull "$RUNTIME_REFERENCE"
      - name: Execute published runtime image contract
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
          RUNTIME_SOURCE: ${{ steps.runtime.outputs.source }}
        run: node .github/scripts/runtime-image-evidence.mjs run "$RUNTIME_REFERENCE" "$RUNTIME_SOURCE" "$RUNNER_TEMP/runtime-image-evidence.json"
      - name: Qualify published runtime ledger storage
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
          RUNTIME_SOURCE: ${{ steps.runtime.outputs.source }}
        run: node .github/scripts/runtime-ledger-evidence.mjs "$RUNTIME_REFERENCE" "$RUNTIME_SOURCE" "$RUNNER_TEMP/ledger-storage.json"
      - name: Retain ledger storage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-ledger-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ledger-storage.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain runtime image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-runtime-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-image-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Require passing runtime image evidence
        if: always()
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
          RUNTIME_SOURCE: ${{ steps.runtime.outputs.source }}
        run: node .github/scripts/runtime-image-evidence.mjs verify "$RUNTIME_REFERENCE" "$RUNTIME_SOURCE" "$RUNNER_TEMP/runtime-image-evidence.json"

  images:
    name: Images
    needs: [plan, select, runtime-image-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that may write packages. One job assigns every tag, so the
    # version tags wait until all five short-SHA tags exist, and a rerun
    # reuses every tag that already names its promoted digest.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pinned Skopeo
        id: skopeo
        run: |
          set -euo pipefail
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ ! -f "$auth_file" ]; then
            echo "::error::docker login did not create its authentication file"
            exit 1
          fi

          wrapper="$RUNNER_TEMP/skopeo"
          cat > "$wrapper" <<'SKOPEO'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${SKOPEO_HOST_AUTHFILE:?}"
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${SKOPEO_HOST_AUTHFILE}:/auth/config.json:ro" \
            quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810 \
            "$@"
          SKOPEO
          chmod 0700 "$wrapper"
          # docker run would pull the pinned image implicitly and fail the release
          # on one registry or CDN hiccup; pull it first with bounded retries.
          bash .github/scripts/pull-pinned-image.sh \
            quay.io/skopeo/stable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810
          skopeo_version=$(SKOPEO_HOST_AUTHFILE="$auth_file" "$wrapper" --version)
          if ! printf '%s\n' "$skopeo_version" \
            | grep -Eq '^skopeo version 1\.22\.2( commit: [0-9a-f]{7,40})?$'; then
            echo "::error::unexpected pinned Skopeo version: $skopeo_version"
            exit 1
          fi
          {
            echo "command=$wrapper"
            echo "auth_file=$auth_file"
          } >> "$GITHUB_OUTPUT"

      # These tags are intended to be assigned once. GHCR has no tag CAS, so
      # a tag that already names the promoted digest is reused and one that
      # names anything else refuses the release. Every image first receives
      # the release merge's short SHA, which no later release shares; only
      # then does any image receive the version, which is what a deployment
      # names, so a release that fails earlier claims no version.
      - name: Assign the release tags to the staging-verified digests
        env:
          RELEASE_IMAGES: ${{ needs.select.outputs.images }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          SKOPEO_COMMAND: ${{ steps.skopeo.outputs.command }}
          SKOPEO_AUTHFILE: /auth/config.json
          SKOPEO_HOST_AUTHFILE: ${{ steps.skopeo.outputs.auth_file }}
        run: python3 -B .github/scripts/release_promotion.py promote

  release:
    name: Tag and release
    needs: [plan, select, runtime-image-gate, images]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - id: notes-download
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          name: release-notes
          path: ${{ runner.temp }}/notes
      - id: notes-download-retry
        if: steps.notes-download.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Explain the unavailable release notes artifact
        if: failure() && steps.notes-download-retry.outcome == 'failure'
        run: |
          echo "::error title=Release notes artifact unavailable::The release-notes artifact was not downloaded: both attempts failed. Each attempt is limited to 2 minutes; an attempt that hit the limit shows 'has timed out' in its log. Nothing was tagged or released. Next step: re-run all jobs so the plan uploads the notes again."
          exit 1

      - name: Show the assembled release notes
        run: cat "$RUNNER_TEMP/notes/release.md"

      - name: Tag the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/reconcile-github-release.sh \
            tag "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/notes/release.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          .github/reconcile-github-release.sh \
            release "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/notes/release.md"

  # The next release needs main's merge commit in develop's ancestry. The
  # publisher can prepare a verified branch with contents permission. A
  # maintainer opens the PR because the workflow token cannot create one.
  back-merge:
    name: Prepare the release back-merge
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Publish the verified back-merge branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/prepare-release-back-merge.sh "$GITHUB_SHA"
