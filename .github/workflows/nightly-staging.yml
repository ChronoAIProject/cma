name: Nightly Staging

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      mutation_target:
        description: "Exact staging HTTPS origin, blank for GET-only smoke"
        required: false
        type: string
      fixture_owner:
        description: "Dedicated fixture owner subject, required for mutation journeys"
        required: false
        type: string
      reviewed_sha:
        description: "Exact reviewed develop commit for mutation, blank for smoke"
        required: false
        type: string
      verifier_sha256:
        description: "Reviewed SHA256 of the installed independent deployment observer"
        required: false
        type: string
      observer_config_sha256:
        description: "Reviewed SHA256 of the observer's exact read-only target configuration"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-staging
  cancel-in-progress: false

jobs:
  plan:
    name: Reviewed staging authority
    if: github.event_name == 'workflow_dispatch' && inputs.mutation_target != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authority.outputs.sha }}
      verifier: ${{ steps.authority.outputs.verifier }}
      config: ${{ steps.authority.outputs.config }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - name: Bind the exact reviewed develop commit and observer authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          VERIFIER_SHA256: ${{ inputs.verifier_sha256 }}
          CONFIG_SHA256: ${{ inputs.observer_config_sha256 }}
        run: node .github/scripts/staging-authority.mjs plan

  smoke:
    name: Read-only staging smoke
    runs-on: ubuntu-24.04
    environment: staging-e2e-readonly
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CMA_E2E_MODE: smoke
      CMA_E2E_BASE_URL: ${{ vars.CMA_E2E_BASE_URL }}
      # Reference the public ID's secret mirror so Actions masks job diagnostics.
      # A missing or mismatched mirror fails the normal prerequisite check.
      CMA_E2E_PUBLIC_ID: ${{ vars.CMA_E2E_PUBLIC_ID == secrets.CMA_E2E_PUBLIC_ID && secrets.CMA_E2E_PUBLIC_ID || '' }}
    steps:
      # Run trusted develop code, never the dispatcher's arbitrary branch with fixture credentials.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
      - name: Initialize isolated evidence path
        working-directory: .
        run: printf '%s\n' "CMA_E2E_OUTPUT_DIR=$RUNNER_TEMP/cma-e2e-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Use supported Node LTS for the pinned browser harness
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          # Playwright 1.58.2 stalls extracting its Chromium archive on Node 26.
          node-version: 24.15.0
      - name: Select official Ubuntu archive for browser dependencies
        working-directory: .
        run: sudo python3 .github/scripts/select-ubuntu-archive.py
      - name: Install pinned browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Local harness guard mechanics, not staging proof
        run: npm run e2e:mechanics
      - name: GET-only smoke, no credentials or hooks
        id: harness
        run: npm run e2e -- --project=smoke
      - name: Upload curated evidence only
        if: always() && steps.harness.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CMA_E2E_OUTPUT_DIR }}/provenance.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/results.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/smoke-landing.png
          retention-days: 7
          if-no-files-found: warn

  journeys:
    name: Explicitly scoped staging journeys
    needs: plan
    # Disabled until these journeys have a GitHub-hosted execution path.
    if: false
    # This protected environment needs required reviewers and develop-only deployment rules.
    # The isolated runner must hold mode-0600 fixture/auth/hook files outside the checkout.
    # No credential values are passed through this workflow, logs, or artifacts.
    environment: staging-e2e-mutation
    runs-on: [self-hosted, linux, x64, cma-staging-e2e]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: web
    env:
      REVIEWED_SHA: ${{ needs.plan.outputs.sha }}
      VERIFIER_SHA256: ${{ needs.plan.outputs.verifier }}
      CONFIG_SHA256: ${{ needs.plan.outputs.config }}
      CMA_ATTESTATION_VERIFIER: ${{ vars.CMA_ATTESTATION_VERIFIER }}
      CMA_ATTESTATION_CONFIG: ${{ vars.CMA_ATTESTATION_CONFIG }}
      CMA_E2E_MODE: mutation
      CMA_E2E_BASE_URL: ${{ vars.CMA_E2E_BASE_URL }}
      CMA_E2E_PUBLIC_ID: ${{ vars.CMA_E2E_PUBLIC_ID }}
      CMA_E2E_MUTATION_TARGET: ${{ inputs.mutation_target }}
      CMA_E2E_FIXTURE_OWNER: ${{ inputs.fixture_owner }}
      CMA_E2E_FIXTURE_FILE: ${{ vars.CMA_E2E_FIXTURE_FILE }}
      CMA_E2E_BROWSER_PATH: ${{ vars.CMA_E2E_BROWSER_PATH }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify approval policy and independently observed deployment before fixture access
        id: attestation
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/staging-authority.mjs attest "$RUNNER_TEMP/staging-before.json"
      - name: Initialize isolated evidence path
        working-directory: .
        run: printf '%s\n' "CMA_E2E_OUTPUT_DIR=$RUNNER_TEMP/cma-e2e-journeys-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Require complete fixtures and execute J0-J7, faults and security
        id: harness
        run: npm run e2e
      - name: Recheck independent deployment identity after the campaign
        if: always() && steps.attestation.outcome == 'success'
        id: final_attestation
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/staging-authority.mjs attest "$RUNNER_TEMP/staging-after.json"
      - name: Require complete cleanup and independently bound campaign evidence
        if: always() && steps.harness.outcome == 'success' && steps.final_attestation.outcome == 'success'
        id: audit
        working-directory: .
        run: node .github/scripts/staging-authority.mjs audit "$CMA_E2E_OUTPUT_DIR" "$RUNNER_TEMP/staging-before.json" "$RUNNER_TEMP/staging-after.json"
      - name: Upload credential-checked screenshots, redacted results and cleanup journal
        if: always() && steps.audit.outputs.publishable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CMA_E2E_OUTPUT_DIR }}/provenance.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/attestation.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/results.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/cleanup.ndjson
            ${{ env.CMA_E2E_OUTPUT_DIR }}/*.png
          retention-days: 7
          if-no-files-found: error
