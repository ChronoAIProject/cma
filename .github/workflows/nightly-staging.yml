name: Nightly Staging

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      mutation_target:
        description: "Exact staging HTTPS origin, blank for GET-only smoke"
        required: false
        type: string
      fixture_owner:
        description: "Dedicated fixture owner subject, required for mutation journeys"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-staging
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only staging smoke
    runs-on: ubuntu-latest
    environment: staging-e2e-readonly
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CMA_E2E_MODE: smoke
      CMA_E2E_BASE_URL: ${{ vars.CMA_E2E_BASE_URL }}
      CMA_E2E_PUBLIC_ID: ${{ vars.CMA_E2E_PUBLIC_ID }}
      CMA_E2E_OUTPUT_DIR: ${{ runner.temp }}/cma-e2e-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Run trusted develop code, never the dispatcher's arbitrary branch with fixture credentials.
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run e2e:typecheck
      - run: npm run test -- e2e/environment.test.ts
      - name: Install pinned browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Local harness guard mechanics, not staging proof
        run: npm run e2e:mechanics
      - name: GET-only smoke, no credentials or hooks
        id: harness
        run: npm run e2e -- --project=smoke
      - name: Upload curated evidence only
        if: always() && steps.harness.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CMA_E2E_OUTPUT_DIR }}/provenance.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/results.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/smoke-landing.png
          retention-days: 7
          if-no-files-found: warn

  journeys:
    name: Explicitly scoped staging journeys
    if: github.event_name == 'workflow_dispatch' && inputs.mutation_target != ''
    # This protected environment needs required reviewers and develop-only deployment rules.
    # The isolated runner must hold mode-0600 fixture/auth/hook files outside the checkout.
    # No credential values are passed through this workflow, logs, or artifacts.
    environment: staging-e2e-mutation
    runs-on: [self-hosted, linux, x64, cma-staging-e2e]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: web
    env:
      CMA_E2E_MODE: mutation
      CMA_E2E_BASE_URL: ${{ vars.CMA_E2E_BASE_URL }}
      CMA_E2E_PUBLIC_ID: ${{ vars.CMA_E2E_PUBLIC_ID }}
      CMA_E2E_MUTATION_TARGET: ${{ inputs.mutation_target }}
      CMA_E2E_FIXTURE_OWNER: ${{ inputs.fixture_owner }}
      CMA_E2E_FIXTURE_FILE: ${{ vars.CMA_E2E_FIXTURE_FILE }}
      CMA_E2E_BROWSER_PATH: ${{ vars.CMA_E2E_BROWSER_PATH }}
      CMA_E2E_OUTPUT_DIR: ${{ runner.temp }}/cma-e2e-journeys-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run e2e:typecheck
      - name: Require complete fixtures and execute J0-J7, faults and security
        id: harness
        run: npm run e2e
      - name: Upload credential-checked screenshots, redacted results and cleanup journal
        if: always() && steps.harness.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CMA_E2E_OUTPUT_DIR }}/provenance.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/results.json
            ${{ env.CMA_E2E_OUTPUT_DIR }}/cleanup.ndjson
            ${{ env.CMA_E2E_OUTPUT_DIR }}/*.png
          retention-days: 7
          if-no-files-found: warn
