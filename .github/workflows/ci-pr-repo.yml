name: "1 Repo"
on:
  pull_request:
    branches:
      - "develop"
      - "main"
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "edited"
      - "labeled"
      - "unlabeled"
concurrency:
  group: "pr-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: "read"
jobs:
  changes:
    name: "1.1 Select changes"
    uses: "./.github/workflows/ci-track-selection.yml"
  repo:
    name: "1.2 Repository checks"
    uses: "./.github/workflows/ci-repo.yml"
  version-label:
    permissions:
      contents: "read"
      pull-requests: "read"
    name: "CI / Version label"
    needs:
      - "changes"
    # Superseded workflows must not turn cancelled selection into a label error.
    # Active selector failures still reach the validator and fail closed.
    if: "${{ !cancelled() }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "1.3 Verify the version label"
        env:
          DEPLOYABLES: "${{ needs.changes.outputs.deployables }}"
          SELECTOR_RESULT: "${{ needs.changes.result }}"
          GH_TOKEN: "${{ github.token }}"
        run: "python3 -B .github/scripts/ci_tracks/version_label.py"
  gate-repo:
    name: "CI / Repo"
    needs:
      - "changes"
      - "repo"
      - "version-label"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py repo --split"
