name: "Two Agent Managers"

on:
  workflow_call:
    inputs:
      am_image_result:
        required: true
        type: string
      runtime_image_result:
        required: true
        type: string
      omarchy_image_result:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  startup-controls:
    name: "Prepared startup source controls"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CMA_NEXTEST_REUSE: '1'
      RUST_MIN_STACK: '33554432'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-archive
      - name: Verify prepared startup abort, refusal and parent schemas
        timeout-minutes: 8
        run: bash .github/scripts/mongo-contract-tests.sh --prepared-startup
  features:
    name: "Feature regression and owner recovery (${{ matrix.fixture }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        fixture: [features, prepared]
    steps:
      - name: Require all three image jobs
        env:
          AM_IMAGE: "${{ inputs.am_image_result }}"
          RUNTIME_IMAGE: "${{ inputs.runtime_image_result }}"
          OMARCHY_IMAGE: "${{ inputs.omarchy_image_result }}"
        run: |
          if [[ "$AM_IMAGE" != success || "$RUNTIME_IMAGE" != success || "$OMARCHY_IMAGE" != success ]]; then
            echo "::error::Two Agent Managers requires all three tested images from this workflow attempt."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Check runner capacity and install pinned Kind
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import urllib.request
          if os.uname().machine != 'x86_64':
              raise SystemExit('Two Agent Managers requires native Linux AMD64.')
          memory = int(Path('/proc/meminfo').read_text().split('MemTotal:')[1].split()[0]) * 1024
          if memory < 14 * 1024**3:
              raise SystemExit('Two Agent Managers requires a runner with at least 16 GiB RAM.')
          url = 'https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64'
          with urllib.request.urlopen(url, timeout=30) as response:
              binary = response.read(64 * 1024 * 1024)
          if hashlib.sha256(binary).hexdigest() != '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889':
              raise SystemExit('Kind tool checksum differs.')
          target = Path(os.environ['RUNNER_TEMP']) / 'multi-am-bin'
          target.mkdir()
          (target / 'kind').write_bytes(binary)
          (target / 'kind').chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as out:
              out.write(str(target) + '\n')
          PY
      - name: Install the pinned fixture dependency and test offline contracts
        timeout-minutes: 5
        working-directory: .github/scripts/multi-am-features
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 -B -m unittest discover -p 'test_*.py'
      - name: Build the checked-out Web and install Chromium
        if: matrix.fixture == 'prepared'
        timeout-minutes: 12
        working-directory: web
        env:
          CHRONO_BUILD_SHA: "${{ github.sha }}"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm exec -- playwright install --with-deps chromium
      - name: Download tested native images from this attempt
        timeout-minutes: 35
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          for component in api runtime runtime-omarchy; do
            artifact="ci-native-image-${component}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            python3 -B .github/scripts/ci_artifact_download.py \
              --name "$artifact" --path "$RUNNER_TEMP/multi-am-images/$artifact"
          done
      - name: Run the SW01–SW13 matrix and owner restart
        timeout-minutes: 60
        env:
          FIXTURE: "${{ matrix.fixture }}"
        run: |
          python3 -B .github/scripts/multi-am-features/run_ci.py \
            --artifacts "$RUNNER_TEMP/multi-am-images" \
            --output "$RUNNER_TEMP/multi-am-features" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --fixture "$FIXTURE"
      - name: Finish fixture cleanup after failure or cancellation
        if: always()
        timeout-minutes: 6
        run: |
          python3 -B .github/scripts/multi-am-features/cleanup.py "$RUNNER_TEMP/multi-am-features/private"
      - name: Upload sanitized coverage and outcome evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: multi-am-feature-coverage-${{ matrix.fixture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multi-am-features/summary/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove private fixture data and image archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/multi-am-features/private" "$RUNNER_TEMP/multi-am-images"
