name: Migration campaign

# Executes released Agent Manager readers, pinned by digest in
# .github/scripts/migration-campaign-pins.json, against the migration harness
# on a disposable kind cluster (#1327). It is not a required check: it runs on
# demand and when its own inputs change, until it has a stable record. The
# repository is public, so only identities and verdicts reach the log; raw
# campaign evidence never leaves the runner.
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/migration-campaign.yml'
      - '.github/scripts/migration-campaign-pins.json'
      - '.github/scripts/migration_campaign_pins.py'
      - '.github/scripts/migration_kind_runner.py'
      - '.github/scripts/migration_image_preflight.py'
      - '.github/scripts/migration_campaign_summary.py'

permissions:
  contents: read

concurrency:
  group: migration-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Migration campaign preflight
    if: github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Campaign pin regressions
        timeout-minutes: 3
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_migration_campaign_pins.py'
      - name: Verify release tags still name the pinned readers
        timeout-minutes: 5
        working-directory: .github/scripts
        run: |
          python3 -B migration_campaign_pins.py verify
          python3 -B migration_campaign_pins.py env >> "$GITHUB_ENV"
      - name: Pull pinned images
        timeout-minutes: 25
        run: |
          mapfile -t images < <(python3 -B .github/scripts/migration_campaign_pins.py images)
          for image in "${images[@]}"; do
            bash .github/scripts/pull-pinned-image.sh "$image"
          done
      - name: Preflight reader identities
        timeout-minutes: 5
        run: |
          if ! python3 -B .github/scripts/migration_kind_runner.py --preflight-only \
              --old-source "$CAMPAIGN_OLD_SOURCE" --old-image "$CAMPAIGN_OLD_IMAGE" \
              --new-source "$CAMPAIGN_NEW_SOURCE" --new-image "$CAMPAIGN_NEW_IMAGE" \
              > "$RUNNER_TEMP/preflight.json"; then
            reason=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("reason", "unknown"))' "$RUNNER_TEMP/preflight.json" 2>/dev/null || echo unknown)
            echo "::error title=Migration campaign preflight::A pinned reader failed its local identity check: ${reason}. Compare the pulled image with migration-campaign-pins.json."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/preflight.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          print("### Migration campaign readers\n\n| Role | Source | Image | Config |\n|---|---|---|---|")
          for role in ("old", "new"):
              row = value[role]
              print(f"| {role} | `{row['source']}` | `{row['image']}` | `{row['config']}` |")
          PY
      - name: Install pinned kind
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${CAMPAIGN_KIND_VERSION}/kind-linux-amd64"
          if ! echo "${CAMPAIGN_KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum --check --status -; then
            echo "::error title=Migration campaign kind::kind ${CAMPAIGN_KIND_VERSION} does not match its pinned sha256. Re-pin it only after checking the release checksum."
            exit 1
          fi
          chmod 0755 "$RUNNER_TEMP/kind"
          echo "KIND_BIN=$RUNNER_TEMP/kind" >> "$GITHUB_ENV"
      - name: Start and remove a pinned kind cluster
        timeout-minutes: 8
        run: |
          name="cma-campaign-smoke-${GITHUB_RUN_ID}"
          trap '"$KIND_BIN" delete cluster --name "$name" >/dev/null 2>&1 || true' EXIT
          if ! "$KIND_BIN" create cluster --name "$name" --image "$CAMPAIGN_KIND_NODE" --wait 120s; then
            echo "::error title=Migration campaign cluster::The pinned kind node did not become ready. Re-run once; a repeat means the node pin or runner changed."
            exit 1
          fi
          kubectl --context "kind-${name}" get nodes -o wide

  campaign:
    name: Migration campaign (${{ matrix.fixture.name }})
    needs: preflight
    if: github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fixture:
          - { name: api-custody, script: migration_api_custody_fixture.py, overlay: --api-custody-fixture }
          # The membership overlay only adds manifests; the base profile fixture drives it.
          - { name: membership, script: migration_profile_fixture.py, overlay: --membership-fixture }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Load campaign pins
        timeout-minutes: 3
        working-directory: .github/scripts
        run: python3 -B migration_campaign_pins.py env >> "$GITHUB_ENV"
      - name: Fetch both reader sources
        timeout-minutes: 5
        run: git fetch --no-tags --depth=1 origin "$CAMPAIGN_OLD_SOURCE" "$CAMPAIGN_NEW_SOURCE"
      - name: Pull pinned images
        timeout-minutes: 25
        run: |
          mapfile -t images < <(python3 -B .github/scripts/migration_campaign_pins.py images)
          for image in "${images[@]}"; do
            bash .github/scripts/pull-pinned-image.sh "$image"
          done
      - name: Install pinned kind
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${CAMPAIGN_KIND_VERSION}/kind-linux-amd64"
          if ! echo "${CAMPAIGN_KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum --check --status -; then
            echo "::error title=Migration campaign kind::kind ${CAMPAIGN_KIND_VERSION} does not match its pinned sha256. Re-pin it only after checking the release checksum."
            exit 1
          fi
          chmod 0755 "$RUNNER_TEMP/kind"
          echo "KIND_BIN=$RUNNER_TEMP/kind" >> "$GITHUB_ENV"
      - name: Build the source inventory and pairwise plan
        timeout-minutes: 5
        run: |
          inputs="$RUNNER_TEMP/campaign-inputs"
          mkdir -m 0700 "$inputs"
          python3 -B .github/scripts/migration_inventory.py --repo . \
            --old "$CAMPAIGN_OLD_SOURCE" --new "$CAMPAIGN_NEW_SOURCE" --output "$inputs/inventory.json"
          python3 -B .github/scripts/migration_plan.py --inventory "$inputs/inventory.json" \
            --old-source "$CAMPAIGN_OLD_SOURCE" --old-image "$CAMPAIGN_OLD_IMAGE" \
            --new-source "$CAMPAIGN_NEW_SOURCE" --new-image "$CAMPAIGN_NEW_IMAGE" \
            --output "$inputs/plan.json"
      - name: Run the four-stage reader/writer campaign
        timeout-minutes: 55
        run: |
          inputs="$RUNNER_TEMP/campaign-inputs"
          output="$RUNNER_TEMP/campaign"
          set +e
          python3 -B .github/scripts/migration_kind_runner.py \
            --old-source "$CAMPAIGN_OLD_SOURCE" --old-image "$CAMPAIGN_OLD_IMAGE" \
            --new-source "$CAMPAIGN_NEW_SOURCE" --new-image "$CAMPAIGN_NEW_IMAGE" \
            --fixture-command "python3 -B $GITHUB_WORKSPACE/.github/scripts/${{ matrix.fixture.script }}" \
            --output "$output" --plan "$inputs/plan.json" --inventory "$inputs/inventory.json" \
            ${{ matrix.fixture.overlay }} --kind "$KIND_BIN" --kind-node-image "$CAMPAIGN_KIND_NODE" \
            --mongo-image "$CAMPAIGN_MONGO_IMAGE" --identity-image "$CAMPAIGN_IDENTITY_IMAGE" \
            --timeout 900 > "$RUNNER_TEMP/runner-result.json"
          status=$?
          set -e
          if [ ! -s "$output/kind-evidence.private.json" ]; then
            reason=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("reason", "unknown"))' "$RUNNER_TEMP/runner-result.json" 2>/dev/null || echo unknown)
            echo "::error title=Migration campaign runner::${{ matrix.fixture.name }} stopped before recording evidence: ${reason}."
            exit 1
          fi
          if ! python3 -B .github/scripts/migration_campaign_summary.py \
              "$output/kind-evidence.private.json" "${{ matrix.fixture.name }}" | tee -a "$GITHUB_STEP_SUMMARY" \
              || [ "$status" -ne 0 ]; then
            reason=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("reason", "unknown"))' "$RUNNER_TEMP/runner-result.json" 2>/dev/null || echo unknown)
            echo "::error title=Migration campaign ${{ matrix.fixture.name }}::The campaign did not complete cleanly: ${reason}. The job summary names the stage; raw evidence stays on the runner."
            exit 1
          fi
