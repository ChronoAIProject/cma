name: Migration campaign
on:
  workflow_dispatch:
    inputs:
      historical_source:
        description: Historical reader source
        required: true
        type: string
      historical_image:
        description: Historical reader image
        required: true
        type: string
      current_source:
        description: Current reader source
        required: true
        type: string
      current_image:
        description: Current reader image
        required: true
        type: string
      candidate_source:
        description: Candidate reader source
        required: true
        type: string
      candidate_image:
        description: Candidate reader image
        required: true
        type: string
      recovery_source:
        description: Recovery reader source
        required: true
        type: string
      recovery_image:
        description: Recovery reader image
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-campaign:
    name: Release ${{ matrix.policy }} / ${{ matrix.fixture.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        policy: [disabled, enabled]
        fixture:
          - { name: profile, script: migration_profile_fixture.py, overlay: '' }
    env:
      OLD_SOURCE: ${{ inputs.historical_source }}
      OLD_IMAGE: ${{ inputs.historical_image }}
      NEW_SOURCE: ${{ inputs.candidate_source }}
      NEW_IMAGE: ${{ inputs.candidate_image }}
      RECOVERY_SOURCE: ${{ inputs.recovery_source }}
      RECOVERY_IMAGE: ${{ inputs.recovery_image }}
      CURRENT_SOURCE: ${{ inputs.current_source }}
      CURRENT_IMAGE: ${{ inputs.current_image }}
      POLICY: ${{ matrix.policy }}
      FIXTURE: ${{ matrix.fixture.name }}
      FIXTURE_SCRIPT: ${{ matrix.fixture.script }}
      FIXTURE_OVERLAY: ${{ matrix.fixture.overlay }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch immutable sources and prepare declaration
        shell: bash
        run: |
          python3 -B - <<'PY_CHECK'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          from migration_plan import identity
          for role in ('OLD', 'CURRENT', 'NEW', 'RECOVERY'):
              identity(os.environ[f'{role}_SOURCE'], os.environ[f'{role}_IMAGE'])
          PY_CHECK
          git fetch --no-tags --depth=1 origin "$OLD_SOURCE" "$CURRENT_SOURCE" "$NEW_SOURCE" "$RECOVERY_SOURCE"
          python3 -B .github/scripts/migration_campaign_pins.py env >> "$GITHUB_ENV"
          mkdir -m 0700 "$RUNNER_TEMP/campaign-inputs"
          python3 -B .github/scripts/migration_inventory.py --repo . --old "$OLD_SOURCE" --new "$NEW_SOURCE" --output "$RUNNER_TEMP/campaign-inputs/inventory.json"
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from migration_plan import build, build_release
          root = Path(os.environ['RUNNER_TEMP']) / 'campaign-inputs'
          inventory = json.loads((root / 'inventory.json').read_text())
          old = {'source': os.environ['OLD_SOURCE'], 'image': os.environ['OLD_IMAGE']}
          new = {'source': os.environ['NEW_SOURCE'], 'image': os.environ['NEW_IMAGE']}
          current = {'source': os.environ['CURRENT_SOURCE'], 'image': os.environ['CURRENT_IMAGE']}
          recovery = {'source': os.environ['RECOVERY_SOURCE'], 'image': os.environ['RECOVERY_IMAGE']}
          pairwise = build(inventory, old['source'], old['image'], new['source'], new['image'])
          release = build_release(inventory, {'historical': old, 'current': current, 'candidate': new, 'recovery': recovery}, pairwise['cells'])
          (root / 'plan.json').write_text(json.dumps(release, indent=2) + '\n')
          print(f"Declared {len(release['fixtures'])} fixtures and {len(release['cells'])} cells; execution remains pending.")
          PY
      - name: Pull immutable artifacts and install pinned kind
        shell: bash
        timeout-minutes: 25
        run: |
          for image in "$OLD_IMAGE" "$CURRENT_IMAGE" "$NEW_IMAGE" "$RECOVERY_IMAGE" "$CAMPAIGN_MONGO_IMAGE" "$CAMPAIGN_IDENTITY_IMAGE" "$CAMPAIGN_KIND_NODE"; do
            bash .github/scripts/pull-pinned-image.sh "$image"
          done
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${CAMPAIGN_KIND_VERSION}/kind-linux-amd64"
          echo "${CAMPAIGN_KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum --check --status -
          chmod 0755 "$RUNNER_TEMP/kind"
      - name: Execute four reader roles
        shell: bash
        timeout-minutes: 55
        run: |
          inputs="$RUNNER_TEMP/campaign-inputs"
          output="$RUNNER_TEMP/campaign"
          set +e
          python3 -B .github/scripts/migration_kind_runner.py \
            --old-source "$OLD_SOURCE" --old-image "$OLD_IMAGE" \
            --new-source "$NEW_SOURCE" --new-image "$NEW_IMAGE" \
            --writer-policy "$POLICY" \
            --fixture-command "python3 -B $GITHUB_WORKSPACE/.github/scripts/$FIXTURE_SCRIPT" \
            --output "$output" --plan "$inputs/plan.json" --inventory "$inputs/inventory.json" \
            $FIXTURE_OVERLAY --kind "$RUNNER_TEMP/kind" --kind-node-image "$CAMPAIGN_KIND_NODE" \
            --mongo-image "$CAMPAIGN_MONGO_IMAGE" --identity-image "$CAMPAIGN_IDENTITY_IMAGE" \
            --timeout 900 > "$RUNNER_TEMP/runner-result.json" 2>/dev/null
          status=$?
          set -e
          if test -s "$output/kind-evidence.private.json"; then
            python3 -B .github/scripts/migration_campaign_summary.py "$output/kind-evidence.private.json" "$FIXTURE-$POLICY" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            python3 -B - "$output/kind-evidence.private.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          value = json.load(open(sys.argv[1]))
          for row in value.get('release_probe', {}).get('stage_controls', []):
              print(f"- {row['stage']}: {row['source']} / {row['writer_policy']}")
          PY
          else
            echo 'The release probe stopped before the evidence receipt was written.'
            exit 1
          fi
          if test "$status" -ne 0; then
            python3 -B - "$output" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, re, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          for log in sorted(output.glob('fixture-*.private.log')):
              text = log.read_text(errors='replace')
              sites = re.findall(r'File "[^"\n]*/(migration_[a-z0-9_]+\.py)", line ([0-9]+)', text)
              if sites:
                  print('Fixture failure sites:', log.name, ', '.join(f'{name}:{line}' for name,line in sites))
          for receipt in sorted(output.glob('requests-*.private.json')):
              requests = json.loads(receipt.read_text())
              if requests:
                  print('Last request:', receipt.name, requests[-1]['method'], requests[-1]['status'])
          PY
          fi
          exit "$status"
