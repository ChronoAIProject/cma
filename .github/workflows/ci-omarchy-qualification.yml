---
name: Omarchy scan performance qualification
permissions:
  contents: read
  issues: read
jobs:
  build:
    name: Build the shared Omarchy qualification archive
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 2
    - name: Identify the shared qualification baseline
      id: qualification-base
      run: printf "sha=%s\n" "$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
    - name: Reserve space on the disposable Omarchy runner
      run: |
        test "$GITHUB_ACTIONS" = true
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 26
        package-manager-cache: false
    - name: Omarchy desktop fixture regressions
      run: |
        python3 -B .github/scripts/omarchy-cache-key-tests.py
        python3 -B .github/scripts/omarchy-ci-scan-tests.py
        python3 -B .github/scripts/runtime_image_layers_tests.py
        python3 -B .github/scripts/runtime_image_metadata_tests.py
        python3 -B .github/scripts/runtime_image_private_keyrings_tests.py
        python3 -B .github/scripts/runtime_image_machine_id_tests.py
        python3 -B .github/scripts/runtime_image_hygiene_tests.py
        python3 .github/scripts/omarchy-close-browser-tests.py
        python3 .github/scripts/omarchy-browser-input-tests.py
        node --test .github/scripts/omarchy-browser-page.test.cjs
        node --test .github/scripts/desktop-seccomp.test.mjs
    - name: Arch packager key expiry
      run: |
        python3 -B .github/scripts/omarchy_key_expiry_tests.py
        python3 -B .github/scripts/omarchy_key_expiry.py
    - name: Ledger image qualification regressions
      run: node --test .github/scripts/runtime-ledger-evidence.test.mjs .github/scripts/runtime-ledger-downgrade.test.mjs
    - name: Debian desktop fixture regressions
      run: |
        python3 -B .github/scripts/desktop-ownership-probe-tests.py
        python3 .github/scripts/desktop-browser-input-tests.py
        node --test .github/scripts/desktop-browser-page.test.cjs
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      with:
        cache-binary: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop'
          }}"
    - name: Set immutable Omarchy image version
      id: identity
      run: echo "version=git-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
    - name: Identify pinned Omarchy dependency cache
      id: cache
      run: python3 .github/scripts/omarchy-cache-key.py "$RUNNER_TEMP/omarchy-evidence/cache-inputs.json"
        >> "$GITHUB_OUTPUT"
    - name: Restore complete Omarchy layer cache
      id: omarchy-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      timeout-minutes: 5
      continue-on-error: true
      with:
        path: "${{ runner.temp }}/omarchy-layer-cache"
        key: omarchy-layer-archive-v1-${{ steps.cache.outputs.scope }}
        fail-on-cache-miss: false
    - name: Discard incomplete Omarchy cache restore
      if: steps.omarchy-cache-restore.outcome != 'success' || steps.omarchy-cache-restore.outputs.cache-hit
        != 'true'
      run: rm -rf "$RUNNER_TEMP/omarchy-layer-cache"
    - name: Resolve OS security refresh key
      id: os-refresh
      run: python3 .github/scripts/os_refresh_key.py runtime-omarchy api/crates/layer4-runtime/Dockerfile
        "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
    - name: Build current-source Omarchy image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: "."
        file: api/crates/layer4-runtime/Dockerfile
        target: omarchy
        platforms: linux/amd64
        push: false
        load: true
        outputs: type=docker,rewrite-timestamp=true
        tags: cma-runtime-omarchy:ci
        build-args: |
          OMARCHY_CMA_BASE=runtime-tools
          RUNTIME_DESKTOP=1
          CHRONO_BUILD=${{ steps.identity.outputs.version }}
          CHRONO_BUILD_SHA=${{ github.sha }}
          OS_SECURITY_REFRESH=${{ steps.os-refresh.outputs.value }}
          SOURCE_DATE_EPOCH=0
        cache-from: "${{ steps.omarchy-cache-restore.outcome == 'success' && steps.omarchy-cache-restore.outputs.cache-hit
          == 'true' && format('type=local,src={0}/omarchy-layer-cache', runner.temp)
          || '' }}\n"
        cache-to: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop'
          && (steps.omarchy-cache-restore.outcome != 'success' || steps.omarchy-cache-restore.outputs.cache-hit
          != 'true') && format('type=local,mode=min,dest={0}/omarchy-layer-cache',
          runner.temp) || '' }}"
    - name: Release Omarchy build cache before image checks
      run: |
        image_id=$(docker image inspect cma-runtime-omarchy:ci --format '{{.Id}}')
        docker buildx prune --all --force
        test "$(docker image inspect cma-runtime-omarchy:ci --format '{{.Id}}')" = "$image_id"
        df -h /
    - name: Verify every Omarchy image layer
      timeout-minutes: 20
      run: python3 -B .github/scripts/runtime_image_hygiene.py --image cma-runtime-omarchy:ci
        --component runtime-omarchy --output "$RUNNER_TEMP/omarchy-evidence/layer-hygiene.json"
    - name: Prepare private Omarchy scan input
      id: omarchy-scan-input
      if: success()
      timeout-minutes: 11
      run: |
        if timeout 10m python3 .github/scripts/export-ci-native-image.py runtime-omarchy "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-ci-scan-input"; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Install pinned image secret scanner
      id: omarchy-scanner-install
      if: success() && steps.omarchy-scan-input.outputs.ready == 'true'
      timeout-minutes: 6
      env:
        CD_COMPONENT: runtime-omarchy
      run: |
        if timeout 5m bash -ec 'bash .github/scripts/staging_cd_transport.sh && bash .github/scripts/install-image-gitleaks.sh'; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Verify Omarchy runtime contract
      run: node .github/scripts/omarchy-contract.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/runtime-contract.json"
    - name: Verify Omarchy staging qualification profile
      run: CMA_RUNTIME_EVIDENCE_PROFILE=omarchy node .github/scripts/runtime-image-evidence.mjs
        run cma-runtime-omarchy:ci "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/staging-qualification.json"
    - name: Qualify exact Omarchy ledger storage
      run: node .github/scripts/runtime-ledger-evidence.mjs cma-runtime-omarchy:ci
        "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/ledger-storage.json"
    - name: Prepare native Chromium namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Verify device-free Omarchy desktop
      run: node .github/scripts/omarchy-runtime-evidence.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/device-free"
    - name: Verify Omarchy virtual graphics desktop
      env:
        CMA_OMARCHY_TEST_DRM: '1'
      run: |
        sudo modprobe vkms
        node .github/scripts/omarchy-runtime-evidence.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/virtual-drm"
    - name: Verify Omarchy production temporary directory
      env:
        CMA_OMARCHY_TEST_IMAGE_TMP: '1'
      run: node .github/scripts/omarchy-runtime-evidence.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/image-tmp"
    - name: Restore Trivy databases
      id: trivy-cache-restore
      if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: "${{ github.workspace }}/.cache/trivy"
        key: cache-trivy-readonly
        restore-keys: cache-trivy-
    - name: Scan tested Omarchy image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        cache: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop'
          }}"
        image-ref: cma-runtime-omarchy:ci
        format: json
        output: "${{ runner.temp }}/omarchy-evidence/vulnerabilities.json"
        severity: HIGH,CRITICAL
        exit-code: '0'
        ignore-unfixed: true
    - name: Omarchy vulnerability gate
      timeout-minutes: 5
      env:
        BASE_SHA: "${{ steps.qualification-base.outputs.sha }}"
        GH_TOKEN: "${{ github.token }}"
      run: python3 -B .github/scripts/image_vulnerability_gate.py --component runtime-omarchy
        --report "$RUNNER_TEMP/omarchy-evidence/vulnerabilities.json" --base "$BASE_SHA"
    - name: Scan the shared archive before uploading it
      timeout-minutes: 32
      env:
        SCANNER_READY: "${{ steps.omarchy-scanner-install.outputs.ready }}"
      run: |
        test "$SCANNER_READY" = true
        python3 -B .github/scripts/omarchy-ci-scan.py start "$GITHUB_SHA"
        python3 -B .github/scripts/omarchy-ci-scan.py promote "$GITHUB_SHA"
    - name: Retain the exact shared scan archive
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: omarchy-qualification-input-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: "${{ runner.temp }}/ci-native-image"
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    outputs:
      layer_requested: omarchy-layer-archive-v1-${{ steps.cache.outputs.scope }}
      layer_matched: "${{ steps.omarchy-cache-restore.outputs.cache-matched-key }}"
      layer_hit: "${{ steps.omarchy-cache-restore.outputs.cache-hit }}"
      layer_outcome: "${{ steps.omarchy-cache-restore.outcome }}"
  omarchy:
    name: Omarchy qualification ${{ matrix.scan_order }} trial ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 2
    - name: Identify the shared qualification baseline
      id: qualification-base
      run: printf "sha=%s\n" "$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
    - name: Reserve space on the disposable Omarchy runner
      run: |
        test "$GITHUB_ACTIONS" = true
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 26
        package-manager-cache: false
    - name: Omarchy desktop fixture regressions
      run: |
        python3 -B .github/scripts/omarchy-cache-key-tests.py
        python3 -B .github/scripts/omarchy-ci-scan-tests.py
        python3 -B .github/scripts/runtime_image_layers_tests.py
        python3 -B .github/scripts/runtime_image_metadata_tests.py
        python3 -B .github/scripts/runtime_image_private_keyrings_tests.py
        python3 -B .github/scripts/runtime_image_machine_id_tests.py
        python3 -B .github/scripts/runtime_image_hygiene_tests.py
        python3 .github/scripts/omarchy-close-browser-tests.py
        python3 .github/scripts/omarchy-browser-input-tests.py
        node --test .github/scripts/omarchy-browser-page.test.cjs
        node --test .github/scripts/desktop-seccomp.test.mjs
    - name: Arch packager key expiry
      run: |
        python3 -B .github/scripts/omarchy_key_expiry_tests.py
        python3 -B .github/scripts/omarchy_key_expiry.py
    - name: Ledger image qualification regressions
      run: node --test .github/scripts/runtime-ledger-evidence.test.mjs .github/scripts/runtime-ledger-downgrade.test.mjs
    - name: Debian desktop fixture regressions
      run: |
        python3 -B .github/scripts/desktop-ownership-probe-tests.py
        python3 .github/scripts/desktop-browser-input-tests.py
        node --test .github/scripts/desktop-browser-page.test.cjs
    - name: Download the exact shared scan archive
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: omarchy-qualification-input-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: "${{ runner.temp }}/omarchy-ci-scan-input"
    - name: Load the verified shared qualification image
      id: load
      timeout-minutes: 15
      run: python3 -B .github/scripts/load-omarchy-qualification-image.py "$RUNNER_TEMP/omarchy-ci-scan-input"
    - name: Verify every Omarchy image layer
      timeout-minutes: 20
      run: python3 -B .github/scripts/runtime_image_hygiene.py --image cma-runtime-omarchy:ci
        --component runtime-omarchy --output "$RUNNER_TEMP/omarchy-evidence/layer-hygiene.json"
    - name: Install pinned image secret scanner
      id: omarchy-scanner-install
      if: success()
      timeout-minutes: 6
      env:
        CD_COMPONENT: runtime-omarchy
      run: |
        if timeout 5m bash -ec 'bash .github/scripts/staging_cd_transport.sh && bash .github/scripts/install-image-gitleaks.sh'; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Start wall-clock and runner headroom measurement
      timeout-minutes: 1
      run: python3 -B .github/scripts/omarchy-qualification-sampler.py start "$RUNNER_TEMP/omarchy-evidence"
    - name: Scan tested Omarchy image as staging publication does
      id: omarchy-scan-start
      if: success() && matrix.scan_order == 'overlapped' && steps.omarchy-scanner-install.outputs.ready
        == 'true'
      timeout-minutes: 1
      run: |
        if python3 -B .github/scripts/omarchy-ci-scan.py start "$GITHUB_SHA"; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Verify Omarchy runtime contract
      run: node .github/scripts/omarchy-contract.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/runtime-contract.json"
    - name: Verify Omarchy staging qualification profile
      run: CMA_RUNTIME_EVIDENCE_PROFILE=omarchy node .github/scripts/runtime-image-evidence.mjs
        run cma-runtime-omarchy:ci "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/staging-qualification.json"
    - name: Qualify exact Omarchy ledger storage
      run: node .github/scripts/runtime-ledger-evidence.mjs cma-runtime-omarchy:ci
        "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/ledger-storage.json"
    - name: Prepare native Chromium namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Verify device-free Omarchy desktop
      run: node .github/scripts/omarchy-runtime-evidence.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/device-free"
    - name: Verify Omarchy virtual graphics desktop
      env:
        CMA_OMARCHY_TEST_DRM: '1'
      run: |
        sudo modprobe vkms
        node .github/scripts/omarchy-runtime-evidence.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/virtual-drm"
    - name: Verify Omarchy production temporary directory
      env:
        CMA_OMARCHY_TEST_IMAGE_TMP: '1'
      run: node .github/scripts/omarchy-runtime-evidence.mjs "$GITHUB_SHA" "$RUNNER_TEMP/omarchy-evidence/image-tmp"
    - name: Restore Trivy databases
      id: trivy-cache-restore
      if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: "${{ github.workspace }}/.cache/trivy"
        key: cache-trivy-readonly
        restore-keys: cache-trivy-
    - name: Record restored cache identities
      env:
        OMARCHY_REQUESTED: "${{ needs.build.outputs.layer_requested }}"
        OMARCHY_MATCHED: "${{ needs.build.outputs.layer_matched }}"
        OMARCHY_HIT: "${{ needs.build.outputs.layer_hit }}"
        OMARCHY_OUTCOME: "${{ needs.build.outputs.layer_outcome }}"
        TRIVY_REQUESTED: cache-trivy-readonly
        TRIVY_MATCHED: "${{ steps.trivy-cache-restore.outputs.cache-matched-key }}"
        TRIVY_HIT: "${{ steps.trivy-cache-restore.outputs.cache-hit }}"
        TRIVY_OUTCOME: "${{ steps.trivy-cache-restore.outcome }}"
      run: python3 -B .github/scripts/omarchy-qualification-sampler.py cache "$RUNNER_TEMP/omarchy-evidence"
    - name: Scan tested Omarchy image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        cache: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop'
          }}"
        image-ref: cma-runtime-omarchy:ci
        format: json
        output: "${{ runner.temp }}/omarchy-evidence/vulnerabilities.json"
        severity: HIGH,CRITICAL
        exit-code: '0'
        ignore-unfixed: true
    - name: Omarchy vulnerability gate
      timeout-minutes: 5
      env:
        BASE_SHA: "${{ steps.qualification-base.outputs.sha }}"
        GH_TOKEN: "${{ github.token }}"
      run: python3 -B .github/scripts/image_vulnerability_gate.py --component runtime-omarchy
        --report "$RUNNER_TEMP/omarchy-evidence/vulnerabilities.json" --base "$BASE_SHA"
    - name: Scan tested Omarchy image after foreground qualification
      id: omarchy-sequential-start
      if: success() && matrix.scan_order == 'sequential' && steps.omarchy-scanner-install.outputs.ready
        == 'true'
      timeout-minutes: 1
      run: |
        if python3 -B .github/scripts/omarchy-ci-scan.py start "$GITHUB_SHA"; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Export tested Omarchy image
      if: success() && (github.event_name == 'push' || github.event_name == 'merge_group'
        || github.event.pull_request.head.repo.full_name == github.repository)
      timeout-minutes: 31
      env:
        OMARCHY_SCAN_STARTED: "${{ steps.omarchy-scan-start.outputs.ready || steps.omarchy-sequential-start.outputs.ready
          }}"
      run: |
        test "$OMARCHY_SCAN_STARTED" = true
        python3 -B .github/scripts/omarchy-ci-scan.py promote "$GITHUB_SHA"
    - name: Record qualifying interval
      if: always()
      env:
        QUALIFICATION_MODE: "${{ matrix.scan_order }}"
        QUALIFICATION_TRIAL: "${{ matrix.trial }}"
      timeout-minutes: 1
      run: |
        set -eu
        dir="$RUNNER_TEMP/omarchy-evidence"
        python3 -B .github/scripts/omarchy-qualification-sampler.py finish "$dir"
        printf '%s %s\n' "$QUALIFICATION_MODE" "$QUALIFICATION_TRIAL" > "$dir/comparison-mode.txt"
        if test -f "$RUNNER_TEMP/ci-native-image/metadata.json"; then
          cp "$RUNNER_TEMP/ci-native-image/metadata.json" "$dir/tested-image.json"
        fi
    - name: Retain Omarchy image evidence
      if: always() && steps.load.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: omarchy-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{
          matrix.scan_order }}-${{ matrix.trial }}
        path: "${{ runner.temp }}/omarchy-evidence/"
        if-no-files-found: error
        retention-days: 90
    - name: Retain tested Omarchy image
      if: success() && (github.event_name == 'push' || github.event_name == 'merge_group'
        || github.event.pull_request.head.repo.full_name == github.repository)
      timeout-minutes: 10
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-native-image-runtime-omarchy-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}-${{ matrix.scan_order }}-${{ matrix.trial }}
        path: "${{ runner.temp }}/ci-native-image/"
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        scan_order:
        - sequential
        - overlapped
        trial:
        - 1
        - 2
    needs: build
'on':
  push:
    branches:
    - tl/qualification/3447-paired
