name: "CI"
on:
  push:
    branches:
      - "develop"
      - "tl/release/**"
  # Required checks must also report on the develop merge queue's group refs.
  # Each entry's ref is unique, so a PR or push run never cancels it.
  merge_group:
    types:
      - "checks_requested"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
concurrency:
  # Verification keeps its own active run and latest pending snapshot.
  # Develop pushes retain their separate cache-writer group.
  group: "ci-${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'verification-' || '' }}${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/develop' }}"
permissions:
  contents: "read"
  actions: "read"
  # ci-images.yml and ci-omarchy.yml request it for the runtime vulnerability
  # gate's tracking-issue lookup; a called workflow cannot exceed its caller.
  issues: "read"
jobs:
  changes:
    if: "(github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop'"
    name: "Select tracks"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      repo: "${{ steps.select.outputs.repo }}"
      am: "${{ steps.select.outputs.am }}"
      eg: "${{ steps.select.outputs.eg }}"
      web: "${{ steps.select.outputs.web }}"
      approval_contract: "${{ steps.select.outputs.approval_contract }}"
      two_am_features: "${{ steps.select.outputs.two_am_features }}"
      am_packages: "${{ steps.select.outputs.am_packages }}"
      eg_packages: "${{ steps.select.outputs.eg_packages }}"
      test_tracks: "${{ steps.select.outputs.test_tracks }}"
      deployables: "${{ steps.select.outputs.deployables }}"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
        with:
          fetch-depth: 0
      -
        name: "Read pinned Rust toolchain"
        id: "toolchain"
        working-directory: "."
        run: "python3 -c 'import os,tomllib; v=tomllib.load(open(\"api/rust-toolchain.toml\",\"rb\"))[\"toolchain\"][\"channel\"]; open(os.environ[\"GITHUB_OUTPUT\"],\"a\").write(\"channel=\"+v+\"\\n\")'"
      -
        uses: "dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca"
        with:
          toolchain: "${{ steps.toolchain.outputs.channel }}"
          components: "rustfmt, clippy"
      -
        uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"
        with:
          python-version: "3.12"
      -
        name: "Install selector parsers"
        run: "python3 -m pip install --disable-pip-version-check -r .github/scripts/ci_tracks/requirements.txt"
      -
        name: "Select from changed paths and Cargo dependencies"
        id: "select"
        run: "python3 -B .github/scripts/ci_tracks/selection.py --ci"
  version-label:
    permissions:
      contents: "read"
      pull-requests: "read"
    name: "CI / Version label"
    needs:
      - "changes"
    # Superseded workflows must not turn cancelled selection into a label error.
    # Active selector failures still reach the validator and fail closed.
    if: "!cancelled() && ((github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop')"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        env:
          DEPLOYABLES: "${{ needs.changes.outputs.deployables }}"
          SELECTOR_RESULT: "${{ needs.changes.result }}"
          GH_TOKEN: "${{ github.token }}"
        run: "python3 -B .github/scripts/ci_tracks/version_label.py"
  repo:
    if: "(github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop'"
    name: "Repo checks"
    uses: "./.github/workflows/ci-repo.yml"
  rust-test-build:
    name: "Rust test build"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true' || needs.changes.outputs.approval_contract == 'true'"
    uses: "./.github/workflows/ci-rust-archive.yml"
  approval-contract:
    name: "External approval contract"
    permissions:
      contents: "read"
      actions: "read"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.approval_contract == 'true'"
    uses: "./.github/workflows/ci-approval-contract.yml"
  am:
    name: "Agent Manager checks"
    # A called workflow cannot hold more than this: its Rust jobs restore the
    # shared test archive through the artifacts API.
    permissions:
      contents: "read"
      actions: "read"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.am == 'true'"
    uses: "./.github/workflows/ci-rust.yml"
    with:
      track: "am"
      packages: "${{ needs.changes.outputs.am_packages }}"
  eg:
    name: "Event Gateway checks"
    # A called workflow cannot hold more than this: its Rust jobs restore the
    # shared test archive through the artifacts API.
    permissions:
      contents: "read"
      actions: "read"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-rust.yml"
    with:
      track: "eg"
      packages: "${{ needs.changes.outputs.eg_packages }}"
  web:
    name: "Web checks"
    needs:
      - "changes"
    if: "needs.changes.outputs.web == 'true'"
    uses: "./.github/workflows/ci-web.yml"
  am-images:
    name: "AM images"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"api\"]"
      changed_deployables: "${{ needs.changes.outputs.deployables }}"
      export_verification_image: true
  eg-images:
    name: "EG images"
    needs:
      - "changes"
    if: "needs.changes.outputs.eg == 'true' || needs.changes.outputs.two_am_features == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"cmaeg\"]"
      export_verification_image: "${{ needs.changes.outputs.two_am_features == 'true' }}"
  web-images:
    name: "WEB images"
    needs:
      - "changes"
    if: "needs.changes.outputs.web == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"web\"]"
  runtime-images:
    name: "Shared runtime images"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"runtime\"]"
      changed_deployables: "${{ needs.changes.outputs.deployables }}"
      export_verification_image: true
  omarchy:
    name: "Runtime Omarchy"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-omarchy.yml"
    with:
      staging_lane_changed: ${{ contains(fromJSON(needs.changes.outputs.deployables), 'cma-runtime-omarchy') }}
      export_verification_image: true
  two-am-features:
    name: "Two Agent Managers"
    needs:
      - "changes"
      - "rust-test-build"
      - "am-images"
      - "runtime-images"
      - "omarchy"
      - "eg-images"
    if: "!cancelled() && needs.changes.outputs.two_am_features == 'true'"
    permissions:
      contents: "read"
      actions: "read"
    uses: "./.github/workflows/ci-two-am.yml"
    with:
      am_image_result: "${{ needs.am-images.result }}"
      runtime_image_result: "${{ needs.runtime-images.result }}"
      omarchy_image_result: "${{ needs.omarchy.result }}"
      eg_image_result: "${{ needs.eg-images.result }}"
  gate-repo:
    name: "CI / Repo"
    needs:
      - "changes"
      - "repo"
      - "version-label"
    if: "always() && ((github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop')"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py repo"
  gate-am:
    name: "CI / Agent Manager"
    needs:
      - "changes"
      - "rust-test-build"
      - "approval-contract"
      - "am"
      - "am-images"
      - "runtime-images"
      - "omarchy"
      - "two-am-features"
    if: "always() && ((github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop')"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py am"
  gate-eg:
    name: "CI / Event Gateway"
    needs:
      - "changes"
      - "rust-test-build"
      - "eg"
      - "eg-images"
      - "runtime-images"
      - "omarchy"
    if: "always() && ((github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop')"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py eg"
  gate-web:
    name: "CI / Web"
    needs:
      - "changes"
      - "web"
      - "web-images"
    if: "always() && ((github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.ref == 'refs/heads/develop')"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py web"
