name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-release-contract:
    name: Trigger release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Release workflow and Gateway source contracts
        run: ruby .github/scripts/ci-contract.rb release
      - name: Release contract mutation regressions
        run: ruby .github/scripts/ci-contract-tests.rb release
      - name: API Cargo cache bridge regressions
        run: python3 .github/scripts/api-cargo-cache-tests.py
      - name: Runtime image evidence and provenance regressions
        run: node --test .github/scripts/runtime-image-evidence.test.mjs .github/scripts/release-runtime-input.test.mjs

  trigger-provider-smoke-contract:
    name: Trigger provider smoke contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Provider workflow authority contract
        run: ruby .github/scripts/ci-contract.rb provider
      - name: Provider contract mutation regressions
        run: ruby .github/scripts/ci-contract-tests.rb provider
      - name: Staging authority and evidence regressions
        run: node --test .github/scripts/staging-authority.test.mjs .github/scripts/deployment-observer.test.mjs .github/scripts/mongo-contract-tests.test.mjs .github/scripts/authenticated-mongo-readiness.test.mjs
      - name: Gateway sealed-record migration regressions
        run: node --test .github/scripts/export-gateway-records.test.mjs
      - name: Install harness dependencies
        working-directory: web
        run: npm ci
      - name: Install harness SDK runtime dependencies
        working-directory: sdk/typescript
        run: npm ci --omit=dev --ignore-scripts
      - name: Typecheck every harness entry point
        working-directory: web
        run: npm run e2e:typecheck
      - name: Exact remote campaign inventory remains mandatory
        run: node .github/scripts/staging-authority.mjs inventory
      - name: Fail-closed fixtures and cleanup mechanics
        working-directory: web
        run: npm run test -- e2e/environment.test.ts e2e/owner-mechanics.test.ts
      - name: Use supported Node LTS for the pinned browser harness
        uses: actions/setup-node@v6
        with:
          # Playwright 1.58.2 stalls extracting its Chromium archive on Node 26.
          node-version: 24.15.0
      - name: Select official Ubuntu archive for browser dependencies
        # The hosted Azure mirror repeatedly stalled package downloads before tests.
        run: sudo python3 .github/scripts/select-ubuntu-archive.py
      - name: Install pinned local browser
        timeout-minutes: 10
        working-directory: web
        env:
          DEBUG: pw:install
        run: npx --no-install playwright install --with-deps chromium
      - name: Local browser guard mechanics
        working-directory: web
        run: npm run e2e:mechanics

  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Source file size validator regressions
        run: .github/scripts/check-file-size-tests.sh
      - name: API secret scanner build contract
        run: bash .github/secret-scanner-build-tests.sh
      - name: Final image metadata declarations
        run: bash .github/image-metadata-tests.sh
      - name: Source files stay within size limits
        run: .github/scripts/check-file-size.sh
      - name: Deployment configuration matches code
        run: .github/scripts/check-config-keys.sh
      - name: Configuration key validator regressions
        run: .github/scripts/check-config-keys-tests.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: API and configuration documentation validator regressions
        run: node --test .github/scripts/check-api-docs.test.mjs .github/scripts/check-config-docs.test.mjs
      - name: Deployment configuration is documented
        run: node .github/scripts/check-config-docs.mjs
      - name: Check CMAEG protocol operation inventory
        run: node .github/scripts/check-api-docs.mjs api/crates/cmaeg/openapi/v1.json docs/CMAEG_Protocol.md
      - name: Release notes validator regressions
        run: .github/release-notes-tests.sh
      - name: Release planning tests
        run: bash .github/plan-release-tests.sh
      - name: Release image reconciliation tests
        run: bash .github/reconcile-release-image-tests.sh
      - name: Release image pre-publish absence tests
        run: bash .github/assert-release-image-tags-absent-tests.sh
      - name: GitHub release reconciliation tests
        run: bash .github/reconcile-github-release-tests.sh
      - name: Release image export tests
        run: bash .github/export-release-image-tests.sh
      - name: Release image import tests
        run: bash .github/import-release-images-tests.sh
      - name: Pinned Skopeo transport integration
        run: bash .github/skopeo-transport-tests.sh
      - name: Root contains only permitted entries
        run: |
          allowed=".git .github api web infra docs sdk CLAUDE.md README.md .gitignore .dockerignore"
          fail=0
          shopt -s dotglob nullglob
          for entry in *; do
            case " $allowed " in
              *" $entry "*) ;;
              *) echo "::error::disallowed root entry: $entry"; fail=1 ;;
            esac
          done
          exit $fail
      - name: sdk/ contains only the fixed directory list
        run: |
          expected=$(printf '%s\n' sdk/rust sdk/typescript | sort)
          actual=$(find sdk -mindepth 1 -maxdepth 1 -print | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::sdk/ contents differ from the fixed directory list"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          for directory in $expected; do
            if [ ! -d "$directory" ] || [ -L "$directory" ]; then
              echo "::error::$directory must be a directory"
              exit 1
            fi
          done
      - name: infra/ contains only the fixed file list
        run: |
          # infra/runtime/ holds the bot-pod image only. It has no manifests of
          # its own by design: the sandbox provider schedules that image, so
          # this repository never declares a Deployment or Service for it.
          expected=$(printf '%s\n' \
            infra/api/Dockerfile infra/api/configmap.yaml infra/api/deployment.yaml \
            infra/api/secret.yaml infra/api/service.yaml \
            infra/api/serviceaccount.yaml infra/api/secretproviderclass.yaml \
            infra/api/httproute.yaml infra/api/healthcheckpolicy.yaml \
            infra/api/gcpbackendpolicy.yaml \
            infra/cmaeg/Dockerfile infra/cmaeg/configmap.yaml infra/cmaeg/deployment.yaml \
            infra/cmaeg/secret.yaml infra/cmaeg/service.yaml \
            infra/cmaeg/serviceaccount.yaml \
            infra/cmaeg/httproute.yaml infra/cmaeg/healthcheckpolicy.yaml \
            infra/cmaeg/gcpbackendpolicy.yaml \
            infra/image-manager/Dockerfile \
            infra/image-manager/configmap.yaml \
            infra/image-manager/deployment.yaml \
            infra/image-manager/gcpbackendpolicy.yaml \
            infra/image-manager/healthcheckpolicy.yaml \
            infra/image-manager/secret.yaml \
            infra/image-manager/service.yaml \
            infra/image-manager/serviceaccount.yaml \
            infra/runtime/Dockerfile \
            infra/storage/home-seed.yaml infra/storage/home-template.yaml \
            infra/web/Dockerfile infra/web/configmap.yaml infra/web/deployment.yaml \
            infra/web/secret.yaml infra/web/service.yaml \
            infra/web/gcpbackendpolicy.yaml | sort)
          actual=$(find infra -type f | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::infra/ contents differ from the fixed list"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Gateway diagrams match reviewed Markdown
        run: python3 .github/scripts/render-cmaeg-diagrams.py --check
      - name: Native Sandbox deployment preflight regressions
        run: |
          node --test .github/scripts/agent-sandbox-preflight.test.mjs
          ruby .github/scripts/agent-sandbox-manifest-contract.rb
      - name: docs/ contains only markdown
        run: |
          bad=$(find docs -type f ! -name '*.md' || true)
          if [ -n "$bad" ]; then echo "::error::non-markdown in docs/: $bad"; exit 1; fi
      - name: SDK docs contain only markdown
        run: |
          bad=$(find sdk/*/docs -type f ! -name '*.md' || true)
          if [ -n "$bad" ]; then echo "::error::non-markdown in SDK docs: $bad"; exit 1; fi
      - name: Layer dependency rule
        run: |
          # Inspect production dependencies only. CMA's integration tests run
          # the compiled gateway against disposable fixtures, so their
          # dev-dependencies may include sibling gateway crates without
          # introducing a runtime layer dependency.
          production_dependencies() {
            awk '
              /^\[dependencies\]$/ { in_dependencies=1; next }
              /^\[/ { in_dependencies=0 }
              in_dependencies { print }
            ' "$1"
          }
          fail=0
          production_dependencies api/crates/layer1-public/Cargo.toml | grep -q 'layer3-adapter' \
            && { echo "::error::layer1-public must not depend on layer3-adapter"; fail=1; }
          production_dependencies api/crates/layer2-core/Cargo.toml | grep -q 'layer1-public' \
            && { echo "::error::layer2-core must not depend on layer1-public"; fail=1; }
          production_dependencies api/crates/layer3-adapter/Cargo.toml | grep -qE 'layer1-public|layer2-core' \
            && { echo "::error::layer3-adapter must not depend on layer1 or layer2"; fail=1; }
          production_dependencies api/crates/cma/Cargo.toml | grep -q 'layer4-runtime' \
            && { echo "::error::control plane must not depend on layer4-runtime"; fail=1; }
          for manifest in api/crates/layer1-public/Cargo.toml \
            api/crates/layer2-core/Cargo.toml api/crates/layer3-adapter/Cargo.toml \
            api/crates/layer4-runtime/Cargo.toml api/crates/cma/Cargo.toml; do
            production_dependencies "$manifest" | grep -qE 'cmaeg(-core)?' \
              && { echo "::error::$manifest must not depend on CMAEG crates"; fail=1; }
          done
          for manifest in api/crates/cmaeg*/Cargo.toml; do
            production_dependencies "$manifest" | grep -qE 'layer1-public|layer2-core|layer3-adapter|layer4-runtime|(^|[^[:alnum:]_-])cma([^[:alnum:]_-]|$)' \
              && { echo "::error::$manifest must not depend on control-plane or layer crates"; fail=1; }
          done
          exit $fail
      - name: Layer 2 is protocol- and kernel-agnostic
        run: |
          hits=$(grep -rniE 'agui|\ba2a\b|\bmcp\b|codex|claude[_-]?code' api/crates/layer2-core/src || true)
          if [ -n "$hits" ]; then
            echo "::error::protocol or kernel name found in layer2-core:"; echo "$hits"; exit 1
          fi
      - name: Image Manager has no Agent or Gateway dependencies
        run: |
          if grep -qE 'layer[1-4]-|cmaeg|path *=.*["/]cma["/]|cma-agent-manager' api/crates/cma-image-manager/Cargo.toml; then
            echo '::error::Image Manager cannot depend on Agent or Gateway implementation crates'
            exit 1
          fi

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        # The gitleaks GitHub Action requires a paid licence for organisations.
        # The scanner itself is open source, so run the binary directly.
        run: |
          # Download outside the working tree: the gitleaks binary itself
          # contains the annotation strings the next step forbids.
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          bash .github/scripts/scan-secret-history-tests.sh "$RUNNER_TEMP/gitleaks"
          bash .github/scripts/scan-secret-history.sh "$RUNNER_TEMP/gitleaks"
      - name: Reject any gitleaks allowlist
        run: |
          if find . -name '.gitleaks.toml' -o -name 'gitleaks.toml' | grep -q .; then
            echo "::error::gitleaks configuration is not permitted; fix the offending string instead"
            exit 1
          fi
          needle="gitleaks:""allow"
          if grep -rnF "$needle" --exclude-dir=.git . ; then
            echo "::error::bypass annotations are not permitted; fix the offending string instead"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # Full debug symbols made rust-lld crash linking the aggregate CMA test
      # binary on the hosted runner. Keep debug assertions and every test while
      # bounding linker output, as in the verified local workspace build.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Large unoptimized lifecycle test futures need the same stack budget
      # on Linux as the documented production-source verification suite.
      RUST_MIN_STACK: 33554432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pinned dependency auditor
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Dependency audit
        # Use the runner's toolchain before the full build/test corpus. The
        # Docker action installs another toolchain after those resource-heavy
        # steps and repeatedly lost its runner before reporting an audit result.
        run: cargo deny --locked --all-features check advisories licenses bans sources
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Format
        run: cargo fmt --all --check
      - name: Native recovery persistence and process fences
        run: python3 crates/layer3-adapter/src/codex/recovery_test.py
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - uses: taiki-e/install-action@nextest
      - name: Image normalization budgets
        # Measure the existing wall-time and memory limits without competing
        # test processes. Both commands retain the same workspace build.
        run: >-
          cargo nextest run --workspace --locked -E 'binary(=media_image_peak)'
          --test-threads 1 --success-output final
      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'not (binary(=media_image_peak) or binary(=turn_metrics))'
      - name: Gateway socket latency budget
        # Keep the real-socket 20 ms assertion, without concurrent workspace
        # test processes consuming the same hosted runner's CPU budget.
        run: >-
          cargo nextest run --workspace --locked -E 'binary(=turn_metrics)'
          --test-threads 1 --success-output final
      - name: Isolated Linux Workspace removal writer boundary
        run: >-
          cargo test --locked -p layer4-runtime
          supervisor::mutation_tests::workspace_reconciliation_tests::real_linux_writer_boundary_reconciles_target_and_resumes_live_sibling
          -- --ignored --exact --test-threads=1
      - name: Disposable real Mongo persistence contracts
        # A 622-contract run hit the 35-minute limit while tests still passed.
        # Retain the complete corpus and two bounded fixtures on slower runners.
        timeout-minutes: 75
        run: bash ../.github/scripts/mongo-contract-tests.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Prepare compiled gateway browser contract
        working-directory: .
        run: |
          npm ci --prefix web
          npm ci --prefix sdk/typescript --omit=dev --ignore-scripts
          npm run build --prefix web
      - name: Select official Ubuntu archive for browser dependencies
        working-directory: .
        run: sudo python3 .github/scripts/select-ubuntu-archive.py
      - name: Install gateway contract browser
        timeout-minutes: 10
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Image Manager authenticated Mongo isolation
        timeout-minutes: 10
        run: bash ../.github/scripts/image-manager-mongo-contract.sh
      - name: Doctests
        run: cargo test --doc --workspace --locked

  cmaeg-latency:
    name: CMAEG latency budget
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: 33554432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - uses: taiki-e/install-action@nextest
      - name: Enforce the production budgets (one retry)
        run: |
          cargo nextest run -p cmaeg --run-ignored ignored-only -E 'test(latency_budget)' --locked --success-output final || \
            cargo nextest run -p cmaeg --run-ignored ignored-only -E 'test(latency_budget)' --locked --success-output final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmaeg-latency
          path: api/target/cmaeg-latency.txt
          if-no-files-found: warn

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install (lockfile integrity)
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Documentation examples
        run: npm run docs:check
      - name: Repository package contents
        run: npm pack --dry-run
      - name: Packaged SDK and React embed consumer
        run: npm run package:check
      - name: Scratch Node consumer
        run: |
          archive=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          scratch=$(mktemp -d)
          cd "$scratch"
          npm init --yes >/dev/null
          npm install --silent --ignore-scripts "$RUNNER_TEMP/$archive"
          node --input-type=module <<'NODE'
          import { createClient } from '@chronoai/cma-sdk';

          globalThis.fetch = async () => new Response(JSON.stringify({
            service: 'cma',
            status: 'rebuilding',
            interfaces: [],
          }), { status: 200, headers: { 'content-type': 'application/json' } });
          const client = createClient({ baseUrl: 'https://example.invalid' });
          const deployment = await client.readConformance();
          if (deployment.service !== 'cma' || deployment.status !== 'rebuilding') {
            throw new Error('the package entry point did not expose working discovery');
          }
          NODE
      - name: Dependency audit
        run: npm audit --audit-level=high

  sdk-rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - name: No service crate dependency
        run: |
          if cargo tree --locked --prefix none | grep -Eq '^layer[0-9]'; then
            echo "::error::the client SDK must not link a service layer crate"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --all-targets --locked
      - uses: taiki-e/install-action@nextest
      - name: Tests
        run: cargo nextest run --locked
      - name: Doctests
        run: cargo test --doc --locked
      - name: Scratch consumer
        run: |
          scratch=$(mktemp -d)
          cargo new --quiet --bin "$scratch/consumer"
          cargo add --quiet --manifest-path "$scratch/consumer/Cargo.toml" \
            cma-sdk --path "$GITHUB_WORKSPACE/sdk/rust"
          cargo add --quiet --manifest-path "$scratch/consumer/Cargo.toml" \
            tokio --features macros,rt-multi-thread
          cp examples/readme.rs "$scratch/consumer/src/main.rs"
          CMA_SDK_EXAMPLE_DRY_RUN=1 \
            cargo run --quiet --locked --manifest-path "$scratch/consumer/Cargo.toml"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov nextest --locked --fail-under-lines 80
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: sdk/rust/Cargo.toml
          command: check advisories licenses bans sources

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile integrity)
        run: npm ci
      - name: Install SDK runtime dependencies (lockfile integrity)
        working-directory: sdk/typescript
        run: npm ci --omit=dev --ignore-scripts
      - name: Format
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      # The one check the rest of this job cannot make. Everything above runs
      # under jsdom, which resolves no custom properties at all — so a
      # stylesheet that parses and computes to nothing passes every one of
      # them. #339 shipped through twenty-two green pull requests that way,
      # with the whole product rendering on browser defaults.
      #
      # Runs against the built output rather than the source: a sheet that is
      # correct in src/ and broken after bundling is still broken.
      - name: CSS collisions
        # These sheets are global, so a class declared in two files silently
        # merges and load order decides. That is how an unrelated selection
        # list handed every picker in the product an overflow it never asked
        # for, which clipped the picker's own menu inside its own anchor.
        run: npm run check:css
      - name: Computed styles
        # Bounded: a browser that never answers should fail this job rather
        # than hold a runner for the workflow's whole timeout.
        timeout-minutes: 5
        run: npm run check:styles
      - name: Dependency audit
        run: npm audit --audit-level=high

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: HTTPRoute ownership
        run: ruby .github/scripts/check-http-route-backends.rb
      - name: kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          # The routes and the secret-provider class are custom resources, and
          # kubeconform ships schemas only for built-in kinds. They are given a
          # schema catalogue rather than -ignore-missing-schemas: skipping
          # validation for exactly the manifests most likely to be hand-edited
          # would leave the gate reporting success on files it never read.
          ./kubeconform -strict -summary -output text \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/api/*.yaml infra/cmaeg/*.yaml infra/image-manager/*.yaml infra/web/*.yaml infra/storage/*.yaml
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: infra

  images:
    name: Images
    runs-on: ubuntu-24.04
    # A build or short-lived image transfer that hangs must fail rather than
    # occupy a runner for six hours. This matches the release image budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Adding a value here adds a check named "Images (<value>)" and leaves
        # the existing names untouched, so branch protection keeps reporting.
        # The new check is not required until it is added to the ruleset.
        component: [api, web, runtime, cmaeg, image-manager]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # arm64 builds run under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # GHA layer export excludes Cargo cache mounts. Archive restoration uses
      # GitHub's current-ref/default-branch cache isolation; PR merge-ref caches
      # cannot seed develop or another PR. Fork requests do not use this bridge.
      - name: Prepare API Cargo cache identity
        if: matrix.component == 'api' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        id: api-cargo-cache
        run: python3 .github/scripts/api-cargo-cache.py prepare
      - name: Restore API Cargo cache archive
        if: matrix.component == 'api' && steps.api-cargo-cache.outcome == 'success'
        id: api-cargo-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cma-api-cargo-cache/data
          key: ${{ steps.api-cargo-cache.outputs.key }}
          restore-keys: ${{ steps.api-cargo-cache.outputs.prefix }}
          fail-on-cache-miss: false
          enableCrossOsArchive: false
      - name: Inject API Cargo cache mounts
        if: matrix.component == 'api' && steps.api-cargo-cache.outcome == 'success'
        timeout-minutes: 3
        run: python3 .github/scripts/api-cargo-cache.py inject
      # Proves the Dockerfile builds for every architecture the cluster may
      # schedule onto. Discarded via cacheonly rather than loaded: the docker
      # exporter behind `load: true` cannot export a multi-platform manifest
      # list, so a combined build-and-load would fail outright.
      #
      # Architecture is chosen per component because emulation is not equally
      # priced. arm64 runs under QEMU on an amd64 runner, which a Node build
      # absorbs in minutes and a Rust release build does not — emulated, the
      # api and runtime compiles ran for hours and timed out, while web
      # finished normally.
      #
      # Every node in the target cluster is amd64 and there is no arm64 pool,
      # so an emulated arm64 Rust image is spending the bulk of CI on an
      # artifact nothing can schedule. web keeps both because it costs little
      # and still exercises multi-platform assembly.
      #
      # If an arm64 pool ever appears, the place to restore this is a publish
      # job on merge, not the PR path: the guarantee is worth having on images
      # that ship, not on every push.
      - name: Build image for all target platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.component == 'web' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          outputs: type=cacheonly
          build-args: |
            CHRONO_BUILD_SHA=${{ github.sha }}
            OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Scoped per component so api and web never overwrite each other's
          # cache. A branch's first run is still cold, since it can only read
          # what the base branch has already populated.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      # Reuses the layers just cached above, so this is near-free.
      - name: Load native image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cma-${{ matrix.component }}:ci
          build-args: |
            CHRONO_BUILD_SHA=${{ github.sha }}
            OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.component }}
      - name: Extract API Cargo cache before pruning
        if: matrix.component == 'api' && steps.api-cargo-cache.outcome == 'success' && steps.api-cargo-cache-restore.outputs.cache-hit != 'true'
        id: api-cargo-cache-export
        timeout-minutes: 3
        run: python3 .github/scripts/api-cargo-cache.py extract
      - name: Release build cache before image checks
        # Native Docker image bytes are independent of BuildKit's build cache.
        # The cache is already exported above; free its toolchain/build layers
        # before Trivy's Docker export and the tested-image transfer archive.
        env:
          IMAGE_COMPONENT: ${{ matrix.component }}
        run: |
          native_image_id=$(docker image inspect "cma-${IMAGE_COMPONENT}:ci" --format '{{.Id}}')
          docker buildx prune --all --force
          test "$(docker image inspect "cma-${IMAGE_COMPONENT}:ci" --format '{{.Id}}')" = "$native_image_id"
          df -h .
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cma-${{ matrix.component }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/setup-node@v6
        if: matrix.component == 'runtime'
        with:
          node-version: 26
      - name: Execute built runtime image contract
        if: matrix.component == 'runtime'
        timeout-minutes: 10
        run: node .github/scripts/runtime-image-evidence.mjs run cma-runtime:ci "$GITHUB_SHA" "$RUNNER_TEMP/runtime-image-evidence.json"
      - name: Retain runtime image evidence
        if: always() && matrix.component == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-image-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Require passing runtime image evidence
        if: always() && matrix.component == 'runtime'
        run: node .github/scripts/runtime-image-evidence.mjs verify cma-runtime:ci "$GITHUB_SHA" "$RUNNER_TEMP/runtime-image-evidence.json"
      # Preserve the exact native bytes that passed this job. PR artifacts keep
      # their actual merge-checkout revision; consumers must verify tree equality.
      - name: Export tested native image
        if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 10
        env:
          IMAGE_COMPONENT: ${{ matrix.component }}
        run: python3 .github/scripts/export-ci-native-image.py "$IMAGE_COMPONENT" "$GITHUB_SHA" "$RUNNER_TEMP/ci-native-image"
      - name: Retain tested native image
        if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: ci-native-image-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-native-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Save accepted API Cargo cache archive
        if: success() && matrix.component == 'api' && steps.api-cargo-cache-export.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/cma-api-cargo-cache/data
          key: ${{ steps.api-cargo-cache.outputs.key }}
          enableCrossOsArchive: false
