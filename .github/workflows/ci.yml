name: "CI"
on:
  pull_request:
    branches:
      - "develop"
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "edited"
      - "labeled"
      - "unlabeled"
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: "read"
jobs:
  changes:
    name: "Select tracks"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      repo: "${{ steps.select.outputs.repo }}"
      am: "${{ steps.select.outputs.am }}"
      eg: "${{ steps.select.outputs.eg }}"
      web: "${{ steps.select.outputs.web }}"
      am_packages: "${{ steps.select.outputs.am_packages }}"
      eg_packages: "${{ steps.select.outputs.eg_packages }}"
      test_tracks: "${{ steps.select.outputs.test_tracks }}"
      deployables: "${{ steps.select.outputs.deployables }}"
    steps:
      -
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0
      -
        name: "Read pinned Rust toolchain"
        id: "toolchain"
        working-directory: "."
        run: "python3 -c 'import os,tomllib; v=tomllib.load(open(\"api/rust-toolchain.toml\",\"rb\"))[\"toolchain\"][\"channel\"]; open(os.environ[\"GITHUB_OUTPUT\"],\"a\").write(\"channel=\"+v+\"\\n\")'"
      -
        uses: "dtolnay/rust-toolchain@stable"
        with:
          toolchain: "${{ steps.toolchain.outputs.channel }}"
          components: "rustfmt, clippy"
      -
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
      -
        name: "Install selector parsers"
        run: "python3 -m pip install --disable-pip-version-check -r .github/scripts/ci_tracks/requirements.txt"
      -
        name: "Select from changed paths and Cargo dependencies"
        id: "select"
        run: "python3 -B .github/scripts/ci_tracks/selection.py"
  version-label:
    permissions:
      contents: "read"
      pull-requests: "read"
    name: "CI / Version label"
    needs:
      - "changes"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@v5"
      -
        env:
          DEPLOYABLES: "${{ needs.changes.outputs.deployables }}"
          SELECTOR_RESULT: "${{ needs.changes.result }}"
          GH_TOKEN: "${{ github.token }}"
        run: "python3 -B .github/scripts/ci_tracks/version_label.py"
  repo:
    name: "Repo checks"
    uses: "./.github/workflows/ci-repo.yml"
  rust-test-build:
    name: "Rust test build"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-rust-archive.yml"
  am:
    name: "Agent Manager checks"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.am == 'true'"
    uses: "./.github/workflows/ci-rust.yml"
    with:
      track: "am"
      packages: "${{ needs.changes.outputs.am_packages }}"
  eg:
    name: "Event Gateway checks"
    needs:
      - "changes"
      - "rust-test-build"
    if: "needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-rust.yml"
    with:
      track: "eg"
      packages: "${{ needs.changes.outputs.eg_packages }}"
  web:
    name: "Web checks"
    needs:
      - "changes"
    if: "needs.changes.outputs.web == 'true'"
    uses: "./.github/workflows/ci-web.yml"
  am-images:
    name: "AM images"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"api\"]"
  eg-images:
    name: "EG images"
    needs:
      - "changes"
    if: "needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"cmaeg\"]"
  web-images:
    name: "WEB images"
    needs:
      - "changes"
    if: "needs.changes.outputs.web == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"web\"]"
  runtime-images:
    name: "Shared runtime images"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-images.yml"
    with:
      components: "[\"runtime\"]"
  omarchy:
    name: "Runtime Omarchy"
    needs:
      - "changes"
    if: "needs.changes.outputs.am == 'true' || needs.changes.outputs.eg == 'true'"
    uses: "./.github/workflows/ci-omarchy.yml"
  gate-repo:
    name: "CI / Repo"
    needs:
      - "changes"
      - "repo"
      - "version-label"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@v5"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py repo"
  gate-am:
    name: "CI / Agent Manager"
    needs:
      - "changes"
      - "rust-test-build"
      - "am"
      - "am-images"
      - "runtime-images"
      - "omarchy"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@v5"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py am"
  gate-eg:
    name: "CI / Event Gateway"
    needs:
      - "changes"
      - "rust-test-build"
      - "eg"
      - "eg-images"
      - "runtime-images"
      - "omarchy"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@v5"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py eg"
  gate-web:
    name: "CI / Web"
    needs:
      - "changes"
      - "web"
      - "web-images"
    if: "always()"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@v5"
      -
        name: "Validate track result"
        env:
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/ci_tracks/gate.py web"
