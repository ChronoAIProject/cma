name: Publish staging component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      tasks:
        required: true
        type: string
    outputs:
      disposition:
        value: ${{ jobs.publish.outputs.disposition }}
      finalized:
        value: ${{ jobs.finalize.outputs.finalized }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
    outputs:
      # A repeat overwrites the first attempt's artifact, so its id is the live one.
      artifact: ${{ steps.receipts-retry.outputs.artifact-id || steps.receipts.outputs.artifact-id }}
      disposition: ${{ steps.publication.outputs.disposition }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Expose cache runtime to the Buildx client
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error('Build cache runtime is unavailable');
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Install runtime qualification interpreter
        if: inputs.component == 'runtime' || inputs.component == 'runtime-omarchy'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - name: Ensure registry transport
        env:
          CD_COMPONENT: ${{ inputs.component }}
        run: bash .github/scripts/staging_cd_transport.sh
      - name: Install pinned image secret scanner backend
        run: bash .github/scripts/install-image-gitleaks.sh
      # A queued release that a newer reservation already owns skips the
      # large restores below. Publication repeats this check and stays the
      # authority for the outcome, so a failed precheck only costs time.
      - name: Check release ownership
        id: ownership
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
        run: python3 -B .github/scripts/staging_cd_release_ownership.py
      - name: Prepare component Cargo cache
        if: inputs.component == 'am' || inputs.component == 'eg'
        id: build-cache
        env:
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
        run: python3 -B .github/scripts/staging_cd_build_cache.py
      # The repository's Actions cache stays at its storage limit, so sealed
      # Cargo bundles travel as develop run artifacts from verified producers.
      - name: Restore compatible Cargo mounts
        if: (inputs.component == 'am' || inputs.component == 'eg') && steps.ownership.outputs.superseded != 'true'
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
        run: python3 -B .github/scripts/staging_cd_cargo_artifact.py
      - name: Restore authenticated layer detector evidence
        if: steps.ownership.outputs.superseded != 'true'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
        run: python3 -B .github/scripts/image_detector_cache.py
      - name: Build once, scan every layer, and publish exact bytes
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
          CD_RECEIPTS_PATH: ${{ runner.temp }}/public-receipts/receipts.json
          CD_BUILD_CACHE: enabled
          CD_LAYER_SCAN_CACHE: enabled
        run: python3 -B .github/scripts/staging_cd_publish.py
      - name: Retain complete layer detector evidence
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cma-layer-detector-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cma-layer-detector-output/cache.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain accepted Cargo mounts
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.publication.outputs.build-cache-ready == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cma-cd-cargo-${{ inputs.component }}
          path: ${{ steps.build-cache.outputs.directory }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true
      # Without these receipts finalization cannot run and a pushed version is
      # burned. The upload is safe to repeat; only the repeat may fail the job.
      - name: Retain only public publication receipts
        id: receipts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.component }}
          path: |
            ${{ runner.temp }}/public-receipts/receipts.json
            ${{ runner.temp }}/public-receipts/runtime-cleanup.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
      - name: Retry retaining only public publication receipts
        id: receipts-retry
        if: always() && steps.receipts.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.component }}
          path: |
            ${{ runner.temp }}/public-receipts/receipts.json
            ${{ runner.temp }}/public-receipts/runtime-cleanup.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
      - name: Retain verified package decisions
        if: always() && (inputs.component == 'runtime' || inputs.component == 'runtime-omarchy')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-package-decisions-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.component }}
          path: ${{ runner.temp }}/public-receipts/package-policy/*.json
          if-no-files-found: ignore
          retention-days: 90
  finalize:
    name: Finalize
    needs: publish
    if: always() && needs.publish.outputs.artifact != '' && needs.publish.outputs.disposition == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      finalized: ${{ steps.finalize.outcome }}
      receipt: ${{ steps.finalize.outputs.receipt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      # Downloading the exact receipt artifact is safe to repeat; only the repeat
      # may fail the job. 145 receipt downloads took at most 2 seconds, so an
      # attempt still running after 2 minutes is a stall: it is stopped and the
      # repeat starts on a fresh connection.
      - id: receipts-download
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact }}
          path: ${{ runner.temp }}/public-receipts
          merge-multiple: true
      - id: receipts-download-retry
        if: steps.receipts-download.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact }}
          path: ${{ runner.temp }}/public-receipts
          merge-multiple: true
      - name: Explain the unavailable receipt artifact
        if: failure() && steps.receipts-download-retry.outcome == 'failure'
        env:
          RECEIPT_ARTIFACT: ${{ needs.publish.outputs.artifact }}
        run: |
          artifact=$RECEIPT_ARTIFACT
          [[ "$artifact" =~ ^[0-9]{1,20}$ ]] || artifact='?'
          echo "::error title=Receipt artifact unavailable::Receipt artifact $artifact was not downloaded: both attempts failed. Each attempt is limited to 2 minutes; an attempt that hit the limit shows 'has timed out' in its log. Finalization did not start. Next step: re-run all jobs so publication uploads the receipt again (finalize/artifact_unavailable in .github/scripts/ci_outcomes.json)."
          exit 1
      - name: Publish digest-bound final tags and remove successful reservations
        id: finalize
        env:
          CD_COMPONENT: ${{ inputs.component }}
          GH_TOKEN: ${{ github.token }}
          CD_TASKS: ${{ inputs.tasks }}
          CD_RECEIPTS_PATH: ${{ runner.temp }}/public-receipts/receipts.json
        run: python3 -B .github/scripts/staging_cd_finalize.py
