name: Publish staging component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      tasks:
        required: true
        type: string
    outputs:
      disposition:
        value: ${{ jobs.publish.outputs.disposition }}
      finalized:
        value: ${{ jobs.finalize.outputs.finalized }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    cache-mode: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
    outputs:
      # A repeat overwrites the first attempt's artifact, so its id is the live one.
      artifact: ${{ steps.receipts-retry.outputs.artifact-id || steps.receipts.outputs.artifact-id }}
      disposition: ${{ steps.publication.outputs.disposition }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        timeout-minutes: 5
      - name: Expose cache runtime to the Buildx client
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error('Build cache runtime is unavailable');
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Install runtime qualification interpreter
        timeout-minutes: 5
        if: inputs.component == 'runtime' || inputs.component == 'runtime-omarchy'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - name: Ensure registry transport
        timeout-minutes: 10
        env:
          CD_COMPONENT: ${{ inputs.component }}
        run: bash .github/scripts/staging_cd_transport.sh
      - name: Install pinned image secret scanner backend
        timeout-minutes: 5
        run: bash .github/scripts/install-image-gitleaks.sh
      # A queued release that a newer reservation already owns skips the
      # large restores below. Publication repeats this check and stays the
      # authority for the outcome, so a failed precheck only costs time.
      - name: Check release ownership
        id: ownership
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
        run: python3 -B .github/scripts/staging_cd_release_ownership.py
      # An expired pinned Arch signing key fails the Omarchy build with a generic
      # signature error late in the build. Name the key, its date and the
      # snapshot-bump issue before any build work; warn 14 days ahead.
      - name: Check pinned Omarchy signing keys
        if: inputs.component == 'runtime-omarchy' && steps.ownership.outputs.superseded != 'true'
        timeout-minutes: 2
        run: python3 -B .github/scripts/omarchy_key_expiry.py --warn-days 14
      - name: Prepare component Cargo cache
        timeout-minutes: 15
        if: inputs.component == 'am' || inputs.component == 'eg'
        continue-on-error: true
        id: build-cache
        env:
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
        run: python3 -B .github/scripts/staging_cd_build_cache.py
      # The repository's Actions cache stays at its storage limit, so sealed
      # Cargo bundles travel as develop run artifacts from verified producers.
      - name: Restore compatible Cargo mounts
        if: steps.build-cache.outcome == 'success' && steps.ownership.outputs.superseded != 'true'
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
          CD_CARGO_CACHE_FAMILY: ${{ steps.build-cache.outputs.family }}
          CD_CARGO_CACHE_GRAPH: ${{ steps.build-cache.outputs.graph }}
        run: python3 -B .github/scripts/staging_cd_cargo_artifact.py
      - name: Restore authenticated layer detector evidence
        if: steps.ownership.outputs.superseded != 'true'
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
        run: python3 -B .github/scripts/image_detector_cache.py
      - name: Restore bounded layer archive
        id: layer-restore
        if: vars.CMA_BOUNDED_LAYER_CACHE == 'true' && steps.ownership.outputs.superseded != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/cma-layer-cache/archive.tar
            ${{ runner.temp }}/cma-layer-cache/replay.json
          key: cma-layer-archive-v1-${{ inputs.component }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cma-layer-archive-v1-${{ inputs.component }}--
          fail-on-cache-miss: false
      - name: Validate restored layer archive
        id: layer-validate
        if: steps.layer-restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -B .github/scripts/buildkit_cache_archive.py restore "$RUNNER_TEMP/cma-layer-cache/restored" "$RUNNER_TEMP/cma-layer-cache/archive.tar"
      - name: Build the exact reserved release archive
        id: producer
        if: >-
          vars.CMA_STAGING_RELEASE_ARCHIVE_HANDOFF == 'true' && steps.ownership.outputs.superseded != 'true' &&
          (inputs.component == 'am' || inputs.component == 'runtime' || inputs.component == 'runtime-omarchy')
        timeout-minutes: 240
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
          CD_BUILD_CACHE: enabled
          CD_LAYER_ARCHIVE_CACHE: ${{ vars.CMA_BOUNDED_LAYER_CACHE == 'true' && 'enabled' || '' }}
          CD_LAYER_ARCHIVE_RESTORED: ${{ steps.layer-validate.outcome == 'success' }}
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
        run: python3 -B .github/scripts/staging_cd_produce.py
      - name: Build once, scan every layer, and publish exact bytes
        timeout-minutes: 270
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ inputs.component }}
          CD_TASKS: ${{ inputs.tasks }}
          CD_RECEIPTS_PATH: ${{ runner.temp }}/public-receipts/receipts.json
          CD_PREPARED_ARCHIVE: ${{ steps.producer.outputs.prepared }}
          CD_BUILD_CACHE: enabled
          CD_LAYER_ARCHIVE_CACHE: ${{ vars.CMA_BOUNDED_LAYER_CACHE == 'true' && 'enabled' || '' }}
          CD_LAYER_ARCHIVE_RESTORED: ${{ steps.layer-validate.outcome == 'success' }}
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
          CD_LAYER_SCAN_CACHE: enabled
        run: python3 -B .github/scripts/staging_cd_publish.py
      # Finalization needs these receipts, so store them before retaining caches.
      # The upload is safe to repeat; only the repeat may fail the job.
      - name: Retain only public publication receipts
        timeout-minutes: 10
        id: receipts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.component }}
          path: |
            ${{ runner.temp }}/public-receipts/receipts.json
            ${{ runner.temp }}/public-receipts/runtime-cleanup.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
      - name: Retry retaining only public publication receipts
        timeout-minutes: 10
        id: receipts-retry
        if: always() && steps.receipts.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-receipts-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.component }}
          path: |
            ${{ runner.temp }}/public-receipts/receipts.json
            ${{ runner.temp }}/public-receipts/runtime-cleanup.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
      - name: Retain verified package decisions
        timeout-minutes: 10
        if: always() && (inputs.component == 'runtime' || inputs.component == 'runtime-omarchy')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-package-decisions-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.component }}
          path: ${{ runner.temp }}/public-receipts/package-policy/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Seal accepted layer archive
        id: seal-layer-archive
        if: success() && vars.CMA_BOUNDED_LAYER_CACHE == 'true' && vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && steps.publication.outputs.disposition == ''
        continue-on-error: true
        timeout-minutes: 5
        run: |
          rm -f "$RUNNER_TEMP/cma-layer-cache/archive.tar"
          python3 -B .github/scripts/buildkit_cache_archive.py seal "$RUNNER_TEMP/cma-layer-cache/pending" "$RUNNER_TEMP/cma-layer-cache/archive.tar" --replay "$RUNNER_TEMP/cma-layer-cache/replay.json"
      - name: Retain sealed layer archive for admission
        id: layer-archive
        if: steps.seal-layer-archive.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cma-layer-cache-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cma-layer-cache/archive.tar
            ${{ runner.temp }}/cma-layer-cache/replay.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain complete layer detector evidence
        timeout-minutes: 2
        continue-on-error: true
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.publication.outputs.disposition == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cma-layer-detector-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cma-layer-detector-output/cache.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain accepted Cargo mounts
        id: cargo-bundle
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.publication.outputs.build-cache-ready == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.publication.outputs.build-cache-artifact }}
          path: ${{ steps.publication.outputs.build-cache-directory }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true
      - name: Index the exact graph of the retained Cargo mounts
        if: steps.cargo-bundle.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.publication.outputs.build-cache-index }}
          path: ${{ steps.publication.outputs.build-cache-directory }}/manifest.json
          if-no-files-found: error
          retention-days: 2
          overwrite: true
  finalize:
    name: Finalize
    needs: publish
    if: always() && needs.publish.outputs.artifact != '' && needs.publish.outputs.disposition == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      finalized: ${{ steps.finalize.outcome }}
      receipt: ${{ steps.finalize.outputs.receipt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Downloading the exact receipt artifact is safe to repeat; only the repeat
      # may fail the job. 145 receipt downloads took at most 2 seconds, so an
      # attempt still running after 2 minutes is a stall: it is stopped and the
      # repeat starts on a fresh connection.
      - id: receipts-download
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.publish.outputs.artifact }}
          path: ${{ runner.temp }}/public-receipts
          merge-multiple: true
      - id: receipts-download-retry
        if: steps.receipts-download.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.publish.outputs.artifact }}
          path: ${{ runner.temp }}/public-receipts
          merge-multiple: true
      - name: Explain the unavailable receipt artifact
        timeout-minutes: 2
        if: failure() && steps.receipts-download-retry.outcome == 'failure'
        env:
          RECEIPT_ARTIFACT: ${{ needs.publish.outputs.artifact }}
        run: |
          artifact=$RECEIPT_ARTIFACT
          [[ "$artifact" =~ ^[0-9]{1,20}$ ]] || artifact='?'
          echo "::error title=Receipt artifact unavailable::Receipt artifact $artifact was not downloaded: both attempts failed. Each attempt is limited to 2 minutes; an attempt that hit the limit shows 'has timed out' in its log. Finalization did not start. Next step: re-run all jobs so publication uploads the receipt again (finalize/artifact_unavailable in .github/scripts/ci_outcomes.json)."
          exit 1
      - name: Publish digest-bound final tags and remove successful reservations
        timeout-minutes: 10
        id: finalize
        env:
          CD_COMPONENT: ${{ inputs.component }}
          GH_TOKEN: ${{ github.token }}
          CD_TASKS: ${{ inputs.tasks }}
          CD_RECEIPTS_PATH: ${{ runner.temp }}/public-receipts/receipts.json
        run: python3 -B .github/scripts/staging_cd_finalize.py
