name: AM package optimization benchmark
on:
  push:
    branches: [tl/cma-cd/profile-probe]
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        opt_level: [1, 0]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          cache-binary: false
      - name: Install archive transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Verify source freshness with Cargo
        env:
          RUSTUP_TOOLCHAIN: "1.96.1"
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          python3 -B .github/scripts/workspace-cargo-reuse-tests.py -v
      - name: Measure AM warm library edit from an independently seeded build
        env:
          OPT_LEVEL: ${{ matrix.opt_level }}
        run: python3 -B .github/scripts/workspace-image-benchmark.py am "$RUNNER_TEMP/workspace-build.json" --package-opt-level "$OPT_LEVEL"
      - name: Retain build timing and freshness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-build-am-package-opt-${{ matrix.opt_level }}-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-build.json
          if-no-files-found: error
          retention-days: 7
