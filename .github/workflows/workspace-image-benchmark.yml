name: AM and EG workspace image benchmark
on:
  pull_request:
    branches: [develop]
    paths:
      - .github/scripts/workspace-image-benchmark.py
      - .github/workflows/workspace-image-benchmark.yml
permissions:
  contents: read
jobs:
  measure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        component: [am, eg]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          cache-binary: false
      - name: Install archive transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Verify source freshness with Cargo
        env:
          RUSTUP_TOOLCHAIN: "1.96.1"
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          python3 -B .github/scripts/workspace-cargo-reuse-tests.py -v
      - name: Measure cold builds and warm executable and library edits
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 -B .github/scripts/workspace-image-benchmark.py "$COMPONENT" "$RUNNER_TEMP/workspace-build.json"
      - name: Retain build timing and freshness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-build-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-build.json
          if-no-files-found: error
          retention-days: 7
