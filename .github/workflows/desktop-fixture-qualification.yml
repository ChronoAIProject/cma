name: Desktop fixture qualification

on:
  push:
    branches: [tl/runtime/1811-native-fixture-qualification]
    paths: [.github/workflows/desktop-fixture-qualification.yml]

permissions:
  contents: read

env:
  FIXTURE_SOURCE: 3ab0355888c30a1aa83fd02d162de87da5e29a4e

jobs:
  desktop:
    name: ${{ matrix.target }}
    if: github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: supervised-debian-desktop
            component: runtime
          - target: supervised-omarchy
            component: runtime-omarchy
    env:
      FIXTURE_TARGET: ${{ matrix.target }}
      CD_COMPONENT: ${{ matrix.component }}
      FIXTURE_IMAGE: cma-${{ matrix.component }}:ci
      DOCKERFILE: api/crates/layer4-runtime/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.FIXTURE_SOURCE }}
          persist-credentials: false
      - name: Verify source and reserve space on the disposable native runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$FIXTURE_SOURCE"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
          package-manager-cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Resolve the pinned OS refresh key
        id: os-refresh
        run: |
          python3 -B .github/scripts/os_refresh_key.py "$CD_COMPONENT" "$DOCKERFILE" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Build the supervised desktop image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.FIXTURE_IMAGE }}
          build-args: |
            RUNTIME_DESKTOP=1
            OMARCHY_CMA_BASE=runtime-tools
            CHRONO_BUILD=git-${{ env.FIXTURE_SOURCE }}
            CHRONO_BUILD_SHA=${{ env.FIXTURE_SOURCE }}
            OS_SECURITY_REFRESH=${{ steps.os-refresh.outputs.value }}
            SOURCE_DATE_EPOCH=0
          cache-from: type=gha,version=2,scope=${{ matrix.component }}
      - name: Verify the loaded image identity and supervision setting
        run: |
          docker image inspect "$FIXTURE_IMAGE" | jq -e --arg source "$FIXTURE_SOURCE" '
            length == 1 and (.[0] |
              .Os == "linux" and .Architecture == "amd64" and
              .Config.Labels["org.opencontainers.image.revision"] == $source and
              .Config.Labels["dev.chrono.cma.runtime-desktop"] == "1" and
              ([.Config.Env[] | select(startswith("CHRONO_RUNTIME_DESKTOP_SUPERVISION_ENABLED="))]
                == ["CHRONO_RUNTIME_DESKTOP_SUPERVISION_ENABLED=true"]))
          '
          image_id=$(docker image inspect "$FIXTURE_IMAGE" --format '{{.Id}}')
          docker buildx prune --all --force
          test "$(docker image inspect "$FIXTURE_IMAGE" --format '{{.Id}}')" = "$image_id"
      - name: Verify runtime layer hygiene
        timeout-minutes: 20
        run: |
          python3 -B .github/scripts/runtime_image_hygiene.py --image "$FIXTURE_IMAGE" \
            --component "$CD_COMPONENT" --output "$RUNNER_TEMP/layer-hygiene.json"
      - name: Prepare native Chromium namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Exercise the Debian Desktop fixture
        if: matrix.component == 'runtime'
        timeout-minutes: 10
        run: |
          node .github/scripts/desktop-runtime-evidence.mjs "$FIXTURE_IMAGE" "$FIXTURE_SOURCE" \
            "$RUNNER_TEMP/desktop.json"
          jq -e '{revision,image,result,cleanup} | select(.result == "pass" and .cleanup)' "$RUNNER_TEMP/desktop.json"
      - name: Exercise the Omarchy fixture
        if: matrix.component == 'runtime-omarchy'
        timeout-minutes: 10
        run: |
          node .github/scripts/omarchy-runtime-evidence.mjs "$FIXTURE_SOURCE" "$RUNNER_TEMP/omarchy"
          jq -e '{revision,image,result,cleanup} | select(.result == "pass" and .cleanup)' "$RUNNER_TEMP/omarchy/verification.json"
      - name: Install the pinned image scanner
        timeout-minutes: 8
        run: |
          bash .github/scripts/staging_cd_transport.sh
          bash .github/scripts/install-image-gitleaks.sh
      - name: Scan the tested native image
        timeout-minutes: 40
        run: |
          python3 -B .github/scripts/export-ci-native-image.py \
            "$CD_COMPONENT" "$FIXTURE_SOURCE" "$RUNNER_TEMP/ci-native-image"
          python3 -B .github/scripts/ci_image_secret_scan.py \
            "$CD_COMPONENT" "$RUNNER_TEMP/ci-native-image" "$FIXTURE_SOURCE"
