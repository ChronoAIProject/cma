name: "Rust track"
on:
  workflow_call:
    inputs:
      track:
        type: "string"
        required: true
      packages:
        type: "string"
        required: true
permissions:
  contents: "read"
jobs:
  lint:
    name: "Lint and build"
    timeout-minutes: 45
    runs-on: "ubuntu-latest"
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: 33554432
      TRACK_PACKAGES: "${{ inputs.packages }}"
    defaults:
      run:
        working-directory: "api"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Prepare Backend capacity"
        working-directory: "."
        run: "sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/scripts/backend-capacity.py || echo \"::warning::Backend capacity preparation unavailable\""
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "24.15.0"
      -
        name: "Read pinned Rust toolchain"
        id: "toolchain"
        working-directory: "."
        run: "python3 -c 'import os,tomllib; v=tomllib.load(open(\"api/rust-toolchain.toml\",\"rb\"))[\"toolchain\"][\"channel\"]; open(os.environ[\"GITHUB_OUTPUT\"],\"a\").write(\"channel=\"+v+\"\\n\")'"
      -
        uses: "dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca"
        with:
          toolchain: "${{ steps.toolchain.outputs.channel }}"
          components: "rustfmt, clippy"
      -
        name: "Install pinned dependency auditor"
        uses: "taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f"
        with:
          tool: "cargo-deny@0.20.2"
          fallback: "none"
      -
        name: "Dependency audit"
        run: "cargo deny --locked --all-features check advisories licenses bans sources"
      -
        uses: "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0"
        with:
          workspaces: "api"
          save-if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
      -
        name: "Format"
        run: "cargo fmt --all --check"
      -
        name: "Desktop browser launch and ownership regressions"
        run: "python3 crates/layer4-runtime/src/desktop-browser-test.py"
        if: "inputs.track == 'am'"
      -
        name: "Native recovery persistence and process fences"
        run: "python3 crates/layer3-adapter/src/codex/recovery_test.py"
        if: "inputs.track == 'am'"
      -
        name: "Retained transport native goal read-only proof"
        run: "python3 crates/layer3-adapter/src/hosted/managed_context/transport_goal_test.py"
        if: "inputs.track == 'am'"
      -
        name: "Lint"
        run: "python3 ../.github/scripts/ci_tracks/rust.py lint"
      -
        name: "Build"
        run: "python3 ../.github/scripts/ci_tracks/rust.py build"
      -
        name: "Doctests"
        run: "python3 ../.github/scripts/ci_tracks/rust.py doc"
      -
        name: "Native Sandbox deployment preflight regressions"
        run: |
          node --test .github/scripts/agent-sandbox-preflight.test.mjs
        if: "inputs.track == 'am'"
        working-directory: "."
      -
        name: "Owner-key Secret cutover contracts"
        run: "python3 .github/scripts/cmaeg-owner-key-cutover-tests.py"
        if: "inputs.track == 'eg'"
        working-directory: "."
      -
        name: "Check CMAEG protocol operation inventory"
        run: "node .github/scripts/check-api-docs.mjs api/crates/cmaeg/openapi/v1.json api/crates/cmaeg/assets/docs/public/CMAEG_Protocol.md"
        if: "inputs.track == 'eg'"
        working-directory: "."
      -
        name: "API inventory checker regressions"
        run: "node --test .github/scripts/check-api-docs.test.mjs"
        if: "inputs.track == 'eg'"
        working-directory: "."
      -
        name: "Gateway diagrams match reviewed Markdown"
        run: "python3 .github/scripts/render-cmaeg-diagrams.py --check"
        if: "inputs.track == 'eg'"
        working-directory: "."
  tests:
    name: "Tests (${{ matrix.shard }}/3)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    # The shared archive restore lists and downloads this run's artifact.
    permissions:
      contents: "read"
      actions: "read"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      RUST_MIN_STACK: 33554432
      CMA_NEXTEST_REUSE: "1"
      TRACK_PACKAGES: "${{ inputs.packages }}"
    defaults:
      run:
        working-directory: "api"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        uses: "./.github/actions/rust-archive"
      -
        name: "Tests"
        env:
          SHARD: "${{ matrix.shard }}"
        run: "python3 ../.github/scripts/ci_tracks/rust.py tests --shard \"$SHARD\""
  timing:
    name: "Timing budgets"
    runs-on: "ubuntu-latest"
    timeout-minutes: 35
    # The shared archive restore lists and downloads this run's artifact.
    permissions:
      contents: "read"
      actions: "read"
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      RUST_MIN_STACK: 33554432
      CMA_NEXTEST_REUSE: "1"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: "api"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "24.15.0"
      -
        uses: "./.github/actions/rust-archive"
      -
        name: "Counting-provider fixture regressions"
        if: "inputs.track == 'am'"
        working-directory: "."
        timeout-minutes: 5
        run: "node --test .github/scripts/work-recovery/*.test.mjs .github/scripts/key-provider-contracts.test.mjs"
      -
        name: "KeyIssuer counting-provider contracts"
        if: "inputs.track == 'am'"
        working-directory: "."
        timeout-minutes: 5
        run: "python3 -B .github/scripts/key-provider-contracts.py"
      -
        name: "Backend resource sampling regressions"
        run: "python3 .github/scripts/backend-resource-sampler-tests.py"
        if: "inputs.track == 'am'"
        working-directory: "."
      -
        name: "API allocator qualification"
        run: "bash ../.github/scripts/backend-nextest.sh run -E 'package(=cma) and binary(=allocator_cli) and test(=actual_api_allocator_completes_without_configuration)' --test-threads 1 --success-output final"
        if: "inputs.track == 'am'"
      -
        name: "Image normalization budgets"
        run: "bash ../.github/scripts/backend-nextest.sh run -E 'binary(=media_image_peak)' --test-threads 1 --success-output final"
        if: "inputs.track == 'eg'"
      -
        name: "Gateway socket latency budget"
        run: "bash ../.github/scripts/backend-nextest.sh run -E 'binary(=turn_metrics)' --test-threads 1 --success-output final"
        if: "inputs.track == 'eg'"
      -
        name: "Isolated Linux Workspace removal writer boundary"
        run: "bash ../.github/scripts/backend-nextest.sh run -E 'package(=layer4-runtime) and test(=supervisor::mutation_tests::workspace_reconciliation_tests::real_linux_writer_boundary_reconciles_target_and_resumes_live_sibling)' --run-ignored only --test-threads 1"
        if: "inputs.track == 'am'"
      -
        name: "Gateway latency runner regressions"
        run: "ruby ../.github/scripts/eg-latency-check-tests.rb"
        if: "inputs.track == 'eg'"
      -
        name: "Enforce Gateway latency budgets"
        run: "python3 -B ../.github/scripts/eg-latency-check.py"
        if: "inputs.track == 'eg'"
      -
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        if: "always() && inputs.track == 'eg'"
        with:
          name: "cmaeg-latency-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "api/target/cmaeg-latency-results/"
          if-no-files-found: "error"
  mongo-harness:
    name: "Mongo harness regressions"
    if: "inputs.track == 'am'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"
      - name: "Mongo fixture and shard regressions"
        run: |
          node --test .github/scripts/mongo-contract-tests.test.mjs
          python3 -B .github/scripts/mongo-contract-shards-tests.py
          ruby .github/scripts/ci-tracks-workflow-tests.rb
  mongo-shards:
    name: "Mongo shard (${{ matrix.shard }})"
    if: "inputs.track == 'am'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 90
    # The shared archive restore lists and downloads this run's artifact.
    permissions:
      contents: "read"
      actions: "read"
    strategy:
      fail-fast: false
      matrix:
        shard: [isolated, 1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      RUST_MIN_STACK: 33554432
      CMA_NEXTEST_REUSE: "1"
      # Owner-approved on 2026-11-24: in the merge queue only, the ordinary
      # shards (1/8 to 8/8) retry a failing test once through this UTC date,
      # inclusive. A pass on retry is still flagged and tracked. Renewal is a
      # reviewed PR that changes this date (.github/scripts/mongo_flaky_retry.py).
      CMA_MONGO_FLAKY_RETRY_UNTIL: "2026-12-01"
    defaults:
      run:
        working-directory: "api"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"
      - uses: "./.github/actions/rust-archive"
      # Runs only for a merge group's ordinary shards. PR and push runs and
      # the isolated shard (dedicated measurement contracts) skip it, so their
      # contracts step receives an empty count and retries nothing.
      - name: "Merge-queue flaky retry policy"
        id: "flaky-retry"
        if: "github.event_name == 'merge_group' && matrix.shard != 'isolated'"
        working-directory: "."
        env:
          EVENT_NAME: "${{ github.event_name }}"
          TRACK: "${{ inputs.track }}"
          MONGO_SHARD: "${{ matrix.shard }}"
        run: "python3 -B .github/scripts/mongo_flaky_retry.py policy"
      - name: "Disposable real Mongo persistence contracts"
        id: "contracts"
        timeout-minutes: 75
        env:
          MONGO_SHARD: "${{ matrix.shard }}"
          CMA_MONGO_FLAKY_RETRIES: "${{ steps.flaky-retry.outputs.retries }}"
          CMA_MONGO_FLAKY_REPORT_DIR: "${{ steps.flaky-retry.outputs.report-dir }}"
        run: 'bash ../.github/scripts/mongo-contract-tests.sh --shard "$MONGO_SHARD"'
      - name: "Flag tests that passed only on their retry"
        id: "flaky-report"
        if: "always() && steps.flaky-retry.outputs.retries == '1'"
        timeout-minutes: 5
        working-directory: "."
        env:
          EVENT_NAME: "${{ github.event_name }}"
          MONGO_SHARD: "${{ matrix.shard }}"
          TESTS_OUTCOME: "${{ steps.contracts.outcome }}"
          CMA_MONGO_FLAKY_REPORT_DIR: "${{ steps.flaky-retry.outputs.report-dir }}"
        run: "python3 -B .github/scripts/mongo_flaky_retry.py report"
      # Read by .github/workflows/mongo-flaky-tracker.yml, which alone may
      # write the tracking issue.
      - name: "Retain the flaky test record for the tracking issue"
        if: "always() && steps.flaky-report.outputs.upload == 'true'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ steps.flaky-retry.outputs.artifact }}"
          path: "${{ steps.flaky-retry.outputs.report-dir }}/flaky-tests.json"
          retention-days: 3
          if-no-files-found: "error"
  mongo-eg:
    name: "Gateway Mongo execution"
    if: "inputs.track == 'eg'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 90
    # The shared archive restore lists and downloads this run's artifact.
    permissions:
      contents: "read"
      actions: "read"
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      RUST_MIN_STACK: 33554432
      CMA_NEXTEST_REUSE: "1"
    defaults:
      run:
        working-directory: "api"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6.5.0
        with:
          node-version: "24.15.0"
      -
        uses: "./.github/actions/rust-archive"
      -
        name: "Authenticated Mongo startup regressions"
        if: "inputs.track == 'eg'"
        working-directory: "."
        run: "node --test .github/scripts/authenticated-mongo-readiness.test.mjs .github/scripts/authenticated-mongo-contract.test.mjs"
      -
        name: "Gateway sealed-record migration regressions"
        if: "inputs.track == 'eg'"
        working-directory: "."
        run: "node --test .github/scripts/export-gateway-records.test.mjs"
      -
        name: "Prepare compiled gateway browser contract"
        if: "inputs.track == 'eg'"
        working-directory: "."
        run: |
          npm ci --prefix web
          npm run build --prefix web
      -
        name: "Install gateway contract browser"
        if: "inputs.track == 'eg'"
        working-directory: "."
        run: |
          node --test .github/scripts/install-contract-browser.test.mjs
          node .github/scripts/install-contract-browser.mjs
      -
        name: "Gateway authenticated Mongo contracts"
        if: "inputs.track == 'eg'"
        working-directory: "."
        run: "bash .github/scripts/authenticated-mongo-contract.sh eg"
  mongo:
    name: "Mongo contracts"
    if: "always()"
    needs: [mongo-harness, mongo-shards, mongo-eg]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: "Require every Mongo shard to succeed"
        env:
          TRACK: "${{ inputs.track }}"
          NEEDS: "${{ toJSON(needs) }}"
        run: "python3 -B .github/scripts/mongo-contract-gate.py"
  isolation:
    name: "Authenticated Mongo contracts"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    # The shared archive restore lists and downloads this run's artifact.
    permissions:
      contents: "read"
      actions: "read"
    env:
      BASH_ENV: "${{ github.workspace }}/.github/scripts/backend-resource-env.sh"
      RUST_MIN_STACK: 33554432
      CMA_NEXTEST_REUSE: "1"
    defaults:
      run:
        working-directory: "api"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        uses: "./.github/actions/rust-archive"
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "24.15.0"
      -
        name: "Authenticated Mongo startup regressions"
        working-directory: "."
        run: "node --test .github/scripts/authenticated-mongo-readiness.test.mjs .github/scripts/authenticated-mongo-contract.test.mjs"
      -
        name: "Prepare consumer browser fixture"
        working-directory: "."
        run: |
          npm ci --prefix web
          npm run build --prefix web
      -
        name: "Install consumer contract browser"
        working-directory: "."
        run: "node .github/scripts/install-contract-browser.mjs"
      -
        name: "Run authenticated Mongo contracts"
        run: "bash ../.github/scripts/authenticated-mongo-contract.sh am"
    if: "inputs.track == 'am'"
  result:
    name: "Rust track result"
    if: "always()"
    needs:
      - "lint"
      - "tests"
      - "timing"
      - "mongo"
      - "isolation"
    runs-on: "ubuntu-latest"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        env:
          NEEDS: "${{ toJSON(needs) }}"
          TRACK: "${{ inputs.track }}"
        run: "python3 .github/scripts/ci_tracks/children.py rust"
