name: Build reserved native image

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      tasks:
        required: true
        type: string
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build and test
    cache-mode: read
    if: >-
      github.repository == 'ChronoAIProject/cma' && github.event_name == 'push' &&
      github.workflow_ref == 'ChronoAIProject/cma/.github/workflows/staging-cd.yml@refs/heads/develop' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      artifact: ${{ steps.upload.outcome == 'success' && steps.upload.outputs.artifact-id || '' }}
    env:
      CD_COMPONENT: ${{ inputs.component }}
      CD_TASKS: ${{ inputs.tasks }}
      CD_NATIVE_CI_PRODUCER: 'true'
      CD_BUILD_CACHE: enabled
      CD_LEGACY_BUILDKIT_DRAIN: ${{ vars.CMA_LEGACY_BUILDKIT_DRAIN == 'true' && 'enabled' || '' }}
      CD_LAYER_ARCHIVE_CACHE: ${{ vars.CMA_BOUNDED_LAYER_CACHE == 'true' && 'enabled' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select an exact pending reservation
        id: select
        timeout-minutes: 2
        run: python3 -B .github/scripts/staging_cd_produce.py --select-native
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        if: steps.select.outputs.build == 'true'
        timeout-minutes: 5
      - name: Expose cache runtime to the Buildx client
        if: steps.select.outputs.build == 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error('Build cache runtime is unavailable');
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.select.outputs.build == 'true' && inputs.component != 'am'
        timeout-minutes: 5
        with:
          node-version: 26
      - name: Ensure native image transport
        if: steps.select.outputs.build == 'true'
        timeout-minutes: 10
        run: bash .github/scripts/staging_cd_transport.sh
      - name: Check pinned Omarchy signing keys
        if: steps.select.outputs.build == 'true' && inputs.component == 'runtime-omarchy'
        timeout-minutes: 2
        run: python3 -B .github/scripts/omarchy_key_expiry.py --warn-days 14
      - name: Prepare component Cargo cache
        if: steps.select.outputs.build == 'true' && inputs.component == 'am'
        id: cargo
        timeout-minutes: 15
        continue-on-error: true
        run: python3 -B .github/scripts/staging_cd_build_cache.py
      - name: Restore compatible Cargo mounts
        if: steps.cargo.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CD_CARGO_CACHE_FAMILY: ${{ steps.cargo.outputs.family }}
          CD_CARGO_CACHE_PREFIX: ${{ steps.cargo.outputs.prefix }}
        run: python3 -B .github/scripts/staging_cd_cargo_artifact.py
      - name: Restore bounded layer archive
        id: layer-restore
        if: steps.select.outputs.build == 'true' && vars.CMA_BOUNDED_LAYER_CACHE == 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/cma-layer-cache/archive.tar
            ${{ runner.temp }}/cma-layer-cache/replay.json
          key: cma-layer-archive-v1-${{ inputs.component }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cma-layer-archive-v1-${{ inputs.component }}--
          fail-on-cache-miss: false
      - name: Validate restored layer archive
        id: layer-validate
        if: steps.layer-restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -B .github/scripts/buildkit_cache_archive.py restore "$RUNNER_TEMP/cma-layer-cache/restored" "$RUNNER_TEMP/cma-layer-cache/archive.tar"
      - name: Build and test the exact reserved native image
        id: producer
        if: steps.select.outputs.build == 'true'
        timeout-minutes: 240
        env:
          GH_TOKEN: ${{ github.token }}
          CD_LAYER_ARCHIVE_RESTORED: ${{ steps.layer-validate.outcome == 'success' }}
        run: python3 -B .github/scripts/staging_cd_produce.py
      - name: Upload tested native archive
        id: upload
        if: steps.producer.outputs.native-path != ''
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.producer.outputs.native-name }}
          path: ${{ steps.producer.outputs.native-path }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Retain accepted Cargo mounts
        id: cargo-bundle
        if: steps.upload.outcome == 'success' && steps.producer.outputs.build-cache-ready == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.producer.outputs.build-cache-artifact }}
          path: ${{ steps.producer.outputs.build-cache-directory }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Index the exact graph of the retained Cargo mounts
        if: steps.cargo-bundle.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.producer.outputs.build-cache-index }}
          path: ${{ steps.producer.outputs.build-cache-directory }}/manifest.json
          if-no-files-found: error
          retention-days: 2
