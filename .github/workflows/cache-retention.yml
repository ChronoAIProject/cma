name: "Hosted cache retention"
on:
  workflow_run:
    workflows: ["Staging CD", "Runtime Omarchy", "Migration harness"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
permissions: {}
jobs:
  sweep:
    if: >-
      github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: cma-develop-cache-readers
      queue: max
      cancel-in-progress: false
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: "Read the public workflow revision"
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/ChronoAIProject/cma.git "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
      - name: "Retire superseded caches and measure remaining bytes"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            python3 -B .github/scripts/actions_cache_sweep.py --apply
          else
            python3 -B .github/scripts/actions_cache_sweep.py
          fi
