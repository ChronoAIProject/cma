name: "Hosted cache retention"
on:
  workflow_run:
    workflows: ["Staging CD", "Runtime Omarchy", "Migration harness"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      inspect_buildkit:
        description: "Inventory cache layers referenced by BuildKit indexes"
        type: boolean
        default: false
permissions: {}
jobs:
  staging_activity:
    name: Check the completed staging attempt for component work
    if: >-
      github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/staging-cd.yml' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      needed: ${{ steps.activity.outputs.needed }}
    steps:
      - name: Read the public workflow revision
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/ChronoAIProject/cma.git "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
      - name: Check exact staging attempt jobs
        id: activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/actions_cache_workload.py
  sweep:
    needs: staging_activity
    outputs:
      observed_bytes_to_admit: ${{ steps.preview.outputs.observed_bytes_to_admit }}
    if: >-
      always() && !cancelled() &&
      (needs.staging_activity.result != 'success' || needs.staging_activity.outputs.needed != 'false') &&
      github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: cma-develop-cache-sweep
      queue: max
      cancel-in-progress: false
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      actions: read
    steps:
      - name: "Read the public workflow revision"
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/ChronoAIProject/cma.git "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
      - name: "Report cache candidates and projected remaining bytes"
        id: preview
        env:
          GH_TOKEN: "${{ github.token }}"
        run: python3 -B .github/scripts/actions_cache_sweep.py
      - name: Preview safe recovery candidates
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/actions_cache_sweep.py --preview-recovery
  inspect_buildkit:
    needs: sweep
    # Fetching the index refreshes its last access. The metadata sweep can
    # measure storage without touching legacy indexes during natural expiry.
    if: >-
      always() && !cancelled() && github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop' &&
      vars.CMA_LEGACY_BUILDKIT_DRAIN != 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.inspect_buildkit) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.path == '.github/workflows/staging-cd.yml' && github.event.workflow_run.conclusion == 'success' &&
        vars.CMA_LEGACY_BUILDKIT_GC != 'true' && needs.sweep.result == 'success' &&
        fromJSON(needs.sweep.outputs.observed_bytes_to_admit || '0') > 0))
    concurrency:
      group: cma-develop-buildkit-observation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    cache-mode: read
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read the cache runtime environment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error('Build cache runtime is unavailable');
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Inventory referenced layers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/actions_cache_buildkit_inventory.py "$RUNNER_TEMP/buildkit-cache-inventory.json"
      - name: Retain the read-only report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: buildkit-cache-inventory
          path: ${{ runner.temp }}/buildkit-cache-inventory.json
          if-no-files-found: error
          retention-days: 3
  recover:
    needs: staging_activity
    outputs:
      status: ${{ steps.recovery.outputs.status }}
      before_bytes: ${{ steps.recovery.outputs.before_bytes }}
      after_bytes: ${{ steps.recovery.outputs.after_bytes }}
      observed_bytes_to_admit: ${{ steps.recovery.outputs.observed_bytes_to_admit }}
    if: >-
      always() && !cancelled() &&
      (needs.staging_activity.result != 'success' || needs.staging_activity.outputs.needed != 'false') &&
      github.repository == 'ChronoAIProject/cma' && github.ref == 'refs/heads/develop' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: cma-develop-cache-recovery
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Read the public workflow revision
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/ChronoAIProject/cma.git "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
      - name: Retire proven candidates and measure actual repository usage
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/actions_cache_sweep.py --apply-recovery
  retain_layers:
    name: Retain bounded layer cache
    if: >-
      vars.CMA_BOUNDED_LAYER_CACHE == 'true' && vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && github.event_name == 'workflow_run' &&
      github.ref == 'refs/heads/develop' && github.repository == 'ChronoAIProject/cma' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/staging-cd.yml'
    concurrency:
      group: cma-develop-layer-cache-admission
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        component: [am, eg, web, runtime, runtime-omarchy]
    cache-mode: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Select candidate from successful protected publication
        id: layer-candidate
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ matrix.component }}
          CD_LAYER_ARCHIVE_CACHE: enabled
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
        run: python3 -B .github/scripts/actions_layer_admission.py select
      - name: Download exact candidate
        if: steps.layer-candidate.outputs.artifact != ''
        id: layer-candidate-download
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.layer-candidate.outputs.artifact }}
          run-id: ${{ steps.layer-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cma-layer-cache
          merge-multiple: true
      - name: Retry exact candidate download
        id: layer-candidate-retry
        if: steps.layer-candidate.outputs.artifact != '' && steps.layer-candidate-download.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.layer-candidate.outputs.artifact }}
          run-id: ${{ steps.layer-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cma-layer-cache
          merge-multiple: true
      - name: Explain unavailable optional layer archive
        if: failure() && steps.layer-candidate-retry.outcome == 'failure'
        timeout-minutes: 1
        run: |
          echo '::error title=Layer archive unavailable::Candidate download was withheld because both attempts failed. Each attempt is limited to 5 minutes.'
          exit 1
      - name: Validate candidate before reservation
        if: steps.layer-candidate.outputs.artifact != ''
        timeout-minutes: 5
        run: python3 -B .github/scripts/buildkit_cache_archive.py restore "$RUNNER_TEMP/cma-layer-cache/validated" "$RUNNER_TEMP/cma-layer-cache/archive.tar"
      - name: Reserve full archive charge
        if: steps.layer-candidate.outputs.artifact != ''
        id: reserve-layer-archive
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ matrix.component }}
          CD_LAYER_ARCHIVE_CACHE: enabled
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
        run: python3 -B .github/scripts/actions_layer_admission.py reserve
      - name: Save admitted layer archive
        if: steps.reserve-layer-archive.outputs.allowed == 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/cma-layer-cache/archive.tar
            ${{ runner.temp }}/cma-layer-cache/replay.json
          key: ${{ steps.reserve-layer-archive.outputs.key }}
  verify_layers:
    name: Verify bounded layer cache on a fresh runner
    needs: retain_layers
    if: >-
      vars.CMA_BOUNDED_LAYER_CACHE == 'true' && vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && github.event_name == 'workflow_run' &&
      github.ref == 'refs/heads/develop' && github.repository == 'ChronoAIProject/cma' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/staging-cd.yml'
    concurrency:
      group: cma-develop-layer-cache-admission
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        component: [am, eg, web, runtime, runtime-omarchy]
    cache-mode: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore exact immutable archive key
        id: verify-restore
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/cma-layer-cache/archive.tar
            ${{ runner.temp }}/cma-layer-cache/replay.json
          key: cma-layer-archive-v1-${{ matrix.component }}--${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          fail-on-cache-miss: false
      - name: Verify restored archive bytes and graph
        id: verify-archive
        if: steps.verify-restore.outcome == 'success' && steps.verify-restore.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: python3 -B .github/scripts/buildkit_cache_archive.py restore "$RUNNER_TEMP/cma-layer-cache/verified" "$RUNNER_TEMP/cma-layer-cache/archive.tar"
      - name: Set up the actual BuildKit importer
        if: steps.verify-archive.outcome == 'success' && vars.CMA_BOUNDED_LAYER_PREDECESSOR_RETIREMENT == 'true'
        timeout-minutes: 3
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          cache-binary: false
      - name: Prove reuse from the exact restored archive
        id: verify-reuse
        if: steps.verify-archive.outcome == 'success' && vars.CMA_BOUNDED_LAYER_PREDECESSOR_RETIREMENT == 'true'
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ matrix.component }}
          CD_LAYER_ARCHIVE_CACHE: enabled
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
        run: python3 -B .github/scripts/staging_cd_layer_reuse.py
      - name: Retire verified compatible archive predecessors
        if: steps.verify-reuse.outcome == 'success' && vars.CMA_BOUNDED_LAYER_PREDECESSOR_RETIREMENT == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          CD_COMPONENT: ${{ matrix.component }}
          CD_LAYER_ARCHIVE_CACHE: enabled
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
          LAYER_EXACT_CACHE_HIT: ${{ steps.verify-restore.outputs.cache-hit }}
          LAYER_REUSE_ARCHIVE_DIGEST: ${{ steps.verify-reuse.outputs.archive_digest }}
        run: python3 -B .github/scripts/actions_layer_admission.py verify
  recover_native_buildkit:
    if: >-
      vars.CMA_LEGACY_BUILDKIT_GC == 'true' && vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' &&
      vars.CMA_LEGACY_BUILDKIT_DRAIN != 'true' &&
      github.event_name == 'workflow_run' && github.ref == 'refs/heads/develop' &&
      github.repository == 'ChronoAIProject/cma' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/staging-cd.yml'
    concurrency:
      group: cma-develop-layer-cache-admission
      queue: max
      cancel-in-progress: false
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read the cache runtime environment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error('Build cache runtime is unavailable');
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Recover native cache with verified replacement and reachability evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CD_LEGACY_BUILDKIT_GC: ${{ vars.CMA_LEGACY_BUILDKIT_GC == 'true' && 'enabled' || '' }}
          CD_LAYER_CACHE_WRITER_FLOOR: ${{ vars.CMA_LAYER_CACHE_WRITER_FLOOR == 'true' && 'verified' || '' }}
          CD_LEGACY_BUILDKIT_INDEX_RETIREMENT: ${{ vars.CMA_LEGACY_BUILDKIT_INDEX_RETIREMENT == 'true' && 'enabled' || '' }}
        run: python3 -B .github/scripts/actions_cache_buildkit_recovery.py
