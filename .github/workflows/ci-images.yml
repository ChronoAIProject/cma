name: "Component images"
on:
  workflow_call:
    inputs:
      components:
        type: "string"
        required: true
      changed_deployables:
        default: "[]"
        type: "string"
      export_verification_image:
        default: false
        type: boolean
permissions:
  contents: "read"
  actions: "read"
  issues: "read"
jobs:
  images:
    concurrency:
      # Develop writes one BuildKit scope per component. Serialize writers to
      # the same scope while letting independent image checks run in parallel.
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && format('cma-develop-ci-image-{0}', matrix.component) || format('ci-image-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.component) }}
      queue: max
      cancel-in-progress: false
    name: "Image (${{ matrix.component }})"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        component: "${{ fromJSON(inputs.components) }}"
    steps:
      -
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
      -
        name: "Resolve canonical image name"
        id: "image-name"
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
        run: "python3 -B .github/scripts/ci_tracks/recipe.py --component \"$IMAGE_COMPONENT\""
      -
        name: "Shared image build contracts"
        run: |
          bash .github/secret-scanner-build-tests.sh
          bash .github/image-metadata-tests.sh
          python3 -B .github/scripts/runtime_image_layers_tests.py
          python3 -B .github/scripts/runtime_image_metadata_tests.py
          python3 -B .github/scripts/runtime_image_hygiene_tests.py
          python3 -B .github/scripts/runtime_image_machine_id_tests.py
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      -
        name: "Local Gateway release gate regressions"
        run: "python3 -B .github/scripts/prepare-cmaeg-release-dockerfile-tests.py"
        if: "matrix.component == 'cmaeg'"
      -
        name: "Runtime image evidence and provenance regressions"
        run: "node --test .github/scripts/runtime-image-evidence.test.mjs .github/scripts/release-runtime-input.test.mjs"
        if: "matrix.component == 'runtime'"
      -
        name: "Ledger image qualification regressions"
        run: "node --test .github/scripts/runtime-ledger-evidence.test.mjs .github/scripts/runtime-ledger-downgrade.test.mjs"
        if: "matrix.component == 'runtime'"
      -
        name: "Migration matrix evidence regressions"
        run: "node --test .github/scripts/migration-matrix.test.mjs"
        if: "matrix.component == 'runtime'"
      -
        uses: "docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130"
        with:
          cache-image: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
      -
        uses: "docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e"
        with:
          cache-binary: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
      -
        name: "Load the exact finalized staging image"
        id: staging-image
        if: >-
          vars.CMA_STAGING_RELEASE_ARCHIVE_HANDOFF == 'true' && github.event_name == 'push' &&
          github.ref == 'refs/heads/develop' && github.repository == 'ChronoAIProject/cma' &&
          ((matrix.component == 'api' && contains(fromJSON(inputs.changed_deployables), 'cma-agent-manager')) ||
           (matrix.component == 'runtime' && contains(fromJSON(inputs.changed_deployables), 'cma-runtime')))
        timeout-minutes: 32
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
          GH_TOKEN: ${{ github.token }}
        run: "python3 -B .github/scripts/ci_staging_image.py"
      -
        name: "Prepare API Cargo cache identity"
        if: "steps.staging-image.outputs.adopted != 'true' && (matrix.component == 'api' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'merge_group'))"
        id: "api-cargo-cache"
        run: "python3 .github/scripts/api-cargo-cache.py prepare"
      -
        name: "Restore API Cargo cache archive"
        if: "steps.staging-image.outputs.adopted != 'true' && (matrix.component == 'api' && steps.api-cargo-cache.outcome == 'success')"
        id: "api-cargo-cache-restore"
        uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25"
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: "${{ runner.temp }}/cma-api-cargo-cache/data"
          key: "${{ steps.api-cargo-cache.outputs.key }}"
          restore-keys: "${{ steps.api-cargo-cache.outputs.prefix }}"
          fail-on-cache-miss: false
          enableCrossOsArchive: false
      -
        # Restores into a fresh cache-mount namespace and publishes it only after
        # validation and extraction succeed, within an internal budget below this
        # step's bound. A failed or slow restore leaves the builds on a clean
        # namespace, so the cache can only cost a cold build.
        name: "Inject API Cargo cache mounts"
        if: "steps.staging-image.outputs.adopted != 'true' && (matrix.component == 'api' && steps.api-cargo-cache.outcome == 'success')"
        id: "api-cargo-cache-inject"
        timeout-minutes: 5
        run: "python3 .github/scripts/api-cargo-cache.py inject"
      -
        name: "Set immutable image version"
        if: "steps.staging-image.outputs.adopted != 'true'"
        id: "build-identity"
        run: "echo \"version=git-${GITHUB_SHA:0:12}\" >> \"$GITHUB_OUTPUT\""
      -
        name: "Resolve OS security refresh key"
        if: "steps.staging-image.outputs.adopted != 'true'"
        id: "os-refresh"
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
          PER_BUILD_KEY: "${{ github.run_id }}-${{ github.run_attempt }}"
        run: "python3 .github/scripts/os_refresh_key.py \"$IMAGE_COMPONENT\" api/crates/layer4-runtime/Dockerfile \"$PER_BUILD_KEY\" >> \"$GITHUB_OUTPUT\""
      - name: Restore bounded layer archive
        id: layer-restore
        if: steps.staging-image.outputs.adopted != 'true' && vars.CMA_BOUNDED_LAYER_CACHE == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/cma-layer-cache/archive.tar
            ${{ runner.temp }}/cma-layer-cache/replay.json
          key: cma-layer-archive-v1-${{ matrix.component == 'api' && 'am' || matrix.component == 'cmaeg' && 'eg' || matrix.component }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cma-layer-archive-v1-${{ matrix.component == 'api' && 'am' || matrix.component == 'cmaeg' && 'eg' || matrix.component }}--
          fail-on-cache-miss: false
      - name: Validate restored layer archive
        id: layer-validate
        if: steps.layer-restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -B .github/scripts/buildkit_cache_archive.py restore "$RUNNER_TEMP/cma-layer-cache/restored" "$RUNNER_TEMP/cma-layer-cache/archive.tar"
      -
        name: "Build image for all target platforms"
        if: "steps.staging-image.outputs.adopted != 'true'"
        uses: "docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8"
        with:
          context: "."
          file: "${{ matrix.component == 'web' && 'web/Dockerfile' || matrix.component == 'api' && 'api/crates/cma/Dockerfile' || matrix.component == 'cmaeg' && 'api/crates/cmaeg/Dockerfile' || 'api/crates/layer4-runtime/Dockerfile' }}"
          platforms: "${{ matrix.component == 'web' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}"
          push: false
          outputs: "type=cacheonly"
          build-args: |
            CHRONO_BUILD=${{ steps.build-identity.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            RUNTIME_DESKTOP=0
            OS_SECURITY_REFRESH=${{ steps.os-refresh.outputs.value }}
            ${{ matrix.component == 'runtime' && 'SOURCE_DATE_EPOCH=0' || '' }}
            ${{ matrix.component == 'api' && steps.api-cargo-cache-inject.outputs.namespace != '' && format('BUILDKIT_CACHE_MOUNT_NS={0}', steps.api-cargo-cache-inject.outputs.namespace) || '' }}
          cache-from: |
            type=gha,version=2,scope=${{ matrix.component == 'api' && 'cma-am' || matrix.component == 'cmaeg' && 'cma-eg' || matrix.component == 'web' && 'cma-web' || matrix.component }}
            ${{ steps.layer-validate.outcome == 'success' && format('type=local,src={0}/cma-layer-cache/restored', runner.temp) || '' }}
      -
        name: "Load native image for scanning"
        if: "steps.staging-image.outputs.adopted != 'true'"
        uses: "docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8"
        with:
          context: "."
          file: "${{ matrix.component == 'web' && 'web/Dockerfile' || matrix.component == 'api' && 'api/crates/cma/Dockerfile' || matrix.component == 'cmaeg' && 'api/crates/cmaeg/Dockerfile' || 'api/crates/layer4-runtime/Dockerfile' }}"
          platforms: "linux/amd64"
          push: false
          load: true
          outputs: "${{ matrix.component == 'runtime' && 'type=docker,rewrite-timestamp=true' || '' }}"
          tags: "${{ steps.image-name.outputs.name }}:ci"
          build-args: |
            CHRONO_BUILD=${{ steps.build-identity.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            RUNTIME_DESKTOP=0
            OS_SECURITY_REFRESH=${{ steps.os-refresh.outputs.value }}
            ${{ matrix.component == 'runtime' && 'SOURCE_DATE_EPOCH=0' || '' }}
            ${{ matrix.component == 'api' && steps.api-cargo-cache-inject.outputs.namespace != '' && format('BUILDKIT_CACHE_MOUNT_NS={0}', steps.api-cargo-cache-inject.outputs.namespace) || '' }}
          cache-from: |
            type=gha,version=2,scope=${{ matrix.component == 'api' && 'cma-am' || matrix.component == 'cmaeg' && 'cma-eg' || matrix.component == 'web' && 'cma-web' || matrix.component }}
            ${{ steps.layer-validate.outcome == 'success' && format('type=local,src={0}/cma-layer-cache/restored', runner.temp) || '' }}
      -
        name: "Extract API Cargo cache before pruning"
        if: "steps.staging-image.outputs.adopted != 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.component == 'api' && steps.api-cargo-cache.outcome == 'success' && steps.api-cargo-cache-restore.outputs.cache-hit != 'true')"
        id: "api-cargo-cache-export"
        timeout-minutes: 5
        run: "python3 .github/scripts/api-cargo-cache.py extract"
      -
        name: "Release build cache before image checks"
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
          IMAGE_NAME: "${{ steps.image-name.outputs.name }}"
        run: |
          native_image_id=$(docker image inspect "${IMAGE_NAME}:ci" --format '{{.Id}}')
          docker buildx prune --all --force
          test "$(docker image inspect "${IMAGE_NAME}:ci" --format '{{.Id}}')" = "$native_image_id"
          df -h .
      -
        name: "Verify every runtime image layer"
        if: "matrix.component == 'runtime'"
        timeout-minutes: 20
        run: "python3 -B .github/scripts/runtime_image_hygiene.py --image cma-runtime:ci --component runtime --output \"$RUNNER_TEMP/runtime-layer-hygiene.json\""
      -
        name: "Restore Trivy databases"
        if: "github.event_name != 'push' || github.ref != 'refs/heads/develop'"
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cache/trivy
          # Trivy uses daily keys. Restore the newest eligible database and let the scanner refresh it.
          key: cache-trivy-readonly
          restore-keys: cache-trivy-
      -
        name: "Vulnerability scan"
        if: "matrix.component != 'runtime'"
        uses: "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25"
        with:
          cache: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
          image-ref: "${{ steps.image-name.outputs.name }}:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
      -
        # Pinned runtime inputs build the same packages while the advisory
        # database keeps changing; the gate decides which findings this change owns.
        name: "Runtime vulnerability scan"
        if: "matrix.component == 'runtime'"
        uses: "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25"
        with:
          cache: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
          image-ref: "${{ steps.image-name.outputs.name }}:ci"
          format: "json"
          output: "${{ runner.temp }}/runtime-vulnerabilities.json"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true
      -
        name: "Runtime vulnerability gate"
        if: "matrix.component == 'runtime'"
        timeout-minutes: 5
        env:
          BASE_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}"
          GH_TOKEN: "${{ github.token }}"
        run: "python3 -B .github/scripts/image_vulnerability_gate.py --component runtime --report \"$RUNNER_TEMP/runtime-vulnerabilities.json\" --base \"$BASE_SHA\""
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        if: "matrix.component == 'runtime'"
        with:
          node-version: 26
          package-manager-cache: false
      -
        name: "Execute built runtime image contract"
        if: "matrix.component == 'runtime'"
        timeout-minutes: 10
        run: "node .github/scripts/runtime-image-evidence.mjs run cma-runtime:ci \"$GITHUB_SHA\" \"$RUNNER_TEMP/runtime-image-evidence.json\""
      -
        name: "Check machine IDs on two read-only runtime boots"
        if: "matrix.component == 'runtime'"
        run: "python3 -B .github/scripts/runtime_image_startup_identity.py cma-runtime:ci"
      -
        name: "Retain runtime image evidence"
        if: "always() && matrix.component == 'runtime'"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "runtime-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            ${{ runner.temp }}/runtime-image-evidence.json
            ${{ runner.temp }}/runtime-layer-hygiene.json
          if-no-files-found: "error"
          retention-days: 90
      -
        name: "Require passing runtime image evidence"
        if: "always() && matrix.component == 'runtime'"
        run: "node .github/scripts/runtime-image-evidence.mjs verify cma-runtime:ci \"$GITHUB_SHA\" \"$RUNNER_TEMP/runtime-image-evidence.json\""
      -
        name: "Qualify exact runtime ledger storage"
        if: "matrix.component == 'runtime'"
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
          IMAGE_NAME: "${{ steps.image-name.outputs.name }}"
        run: "node .github/scripts/runtime-ledger-evidence.mjs \"${IMAGE_NAME}:ci\" \"$GITHUB_SHA\" \"$RUNNER_TEMP/ledger-storage.json\""
      -
        name: "Retain ledger storage evidence"
        if: "always() && (matrix.component == 'runtime')"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "ledger-storage-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/ledger-storage.json"
          if-no-files-found: "error"
          retention-days: 90
      -
        name: "Verify web bundle identity against image metadata"
        if: "matrix.component == 'web'"
        run: "python3 .github/scripts/web-build-identity.py cma-web:ci \"$GITHUB_SHA\" \"git-${GITHUB_SHA:0:12}\""
      -
        uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
        if: "matrix.component == 'web'"
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      -
        name: "Install web image browser harness"
        if: "matrix.component == 'web'"
        run: "npm ci --prefix web"
      -
        name: "Detached browser cleanup regression"
        if: "matrix.component == 'web'"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
          CMA_WEB_WATCHDOG_EVIDENCE_DIR: "${{ runner.temp }}/web-image-evidence/watchdog"
        run: "python3 .github/scripts/web-image-watchdog-tests.py"
      -
        name: "Watchdog startup and retained evidence regressions"
        if: "matrix.component == 'web'"
        timeout-minutes: 5
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
          CMA_WEB_WATCHDOG_EVIDENCE_TEST_DIR: "${{ runner.temp }}/web-image-evidence/startup"
        run: "python3 .github/scripts/web-image-watchdog-evidence-tests.py"
      -
        name: "Browser finalization phase regression"
        if: "matrix.component == 'web'"
        timeout-minutes: 2
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
        run: "python3 .github/scripts/web-image-phase-tests.py"
      -
        name: "Render exact web image with stale retained assets"
        if: "matrix.component == 'web'"
        timeout-minutes: 6
        env:
          CMA_E2E_BROWSER_PATH: "/usr/bin/google-chrome"
          CMA_WEB_IMAGE_EVIDENCE_DIR: "${{ runner.temp }}/web-image-evidence/suite"
        run: "python3 .github/scripts/web-image-smoke.py cma-web:ci"
      -
        name: "Bound web image browser evidence"
        if: "always() && matrix.component == 'web'"
        timeout-minutes: 1
        run: "python3 .github/scripts/web-image-evidence.py \"$RUNNER_TEMP/web-image-evidence\" \"$RUNNER_TEMP/web-image-upload\""
      -
        name: "Retain web image browser evidence"
        if: "always() && matrix.component == 'web'"
        timeout-minutes: 3
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "web-image-browser-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/web-image-upload/"
          if-no-files-found: "warn"
          retention-days: 7
          compression-level: 0
      -
        name: "Export tested native image"
        if: >-
          steps.staging-image.outputs.adopted != 'true' && success() &&
          (github.event_name == 'push' || github.event_name == 'merge_group' ||
           github.event.pull_request.head.repo.full_name == github.repository ||
           (inputs.export_verification_image && github.ref == 'refs/heads/develop' &&
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
            (matrix.component == 'api' || matrix.component == 'runtime')))
        id: native-image-export
        timeout-minutes: 10
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
        run: "python3 .github/scripts/export-ci-native-image.py \"$IMAGE_COMPONENT\" \"$GITHUB_SHA\" \"$RUNNER_TEMP/ci-native-image\""
      -
        name: "Install pinned image secret scanner"
        if: >-
          success() && steps.native-image-export.outcome == 'success' &&
          (github.event_name != 'push' || github.ref != 'refs/heads/develop')
        timeout-minutes: 5
        env:
          CD_COMPONENT: "${{ matrix.component == 'api' && 'am' || matrix.component == 'cmaeg' && 'eg' || matrix.component }}"
        run: |
          bash .github/scripts/staging_cd_transport.sh
          bash .github/scripts/install-image-gitleaks.sh
      -
        name: "Scan tested image as staging publication does"
        id: native-image-scan
        if: >-
          success() && steps.native-image-export.outcome == 'success' &&
          (github.event_name != 'push' || github.ref != 'refs/heads/develop')
        timeout-minutes: 30
        env:
          IMAGE_COMPONENT: "${{ matrix.component }}"
        run: "python3 -B .github/scripts/ci_image_secret_scan.py \"$IMAGE_COMPONENT\" \"$RUNNER_TEMP/ci-native-image\" \"$GITHUB_SHA\""
      -
        name: "Retain tested native image"
        if: >-
          success() && steps.native-image-export.outcome == 'success' &&
          (steps.native-image-scan.outcome == 'success' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
        timeout-minutes: 10
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "ci-native-image-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/ci-native-image/"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 1
      -
        name: "Save accepted API Cargo cache archive"
        if: "steps.staging-image.outputs.adopted != 'true' && (success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.component == 'api' && vars.CMA_LAYER_CACHE_WRITER_FLOOR != 'true' && steps.api-cargo-cache-export.outputs.ready == 'true')"
        uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25"
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: "${{ runner.temp }}/cma-api-cargo-cache/data"
          key: "${{ steps.api-cargo-cache.outputs.key }}"
          enableCrossOsArchive: false
