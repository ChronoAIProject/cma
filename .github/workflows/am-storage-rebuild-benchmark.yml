name: AM storage rebuild benchmark
on:
  push:
    branches: [tl/developer-52/2741-hosted-rebuild]
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'ChronoAIProject/cma'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: a4939265a97d28a1f0dd3d0b4f799c9200882d97
          path: rebuild-candidate
          persist-credentials: false
      - name: Measure warm and clean release builds after one Agent log edit
        run: |
          mkdir "$RUNNER_TEMP/am-storage-rebuild"
          docker run --rm \
            --volume "$PWD/rebuild-candidate:/source" \
            --volume "$PWD/.github/scripts/am-storage-rebuild-benchmark.sh:/benchmark.sh:ro" \
            --volume "$RUNNER_TEMP/am-storage-rebuild:/results" \
            --workdir /source \
            --env RUNNER_TEMP=/results \
            rust:1.96.1-alpine sh -ec '
              apk add --no-cache bash binutils git musl-dev python3
              git config --global --add safe.directory /source
              bash /benchmark.sh /results/result.json
            '
      - name: Upload measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: am-storage-rebuild
          path: ${{ runner.temp }}/am-storage-rebuild/result.json
          if-no-files-found: error
          retention-days: 7
