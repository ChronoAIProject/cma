name: "Restore shared Rust archive"
description: "Restore the event SHA archive without compiling again."
runs:
  using: "composite"
  steps:
    -
      name: "Read pinned Rust toolchain"
      id: "toolchain"
      shell: "bash"
      working-directory: "."
      run: "python3 -c 'import os,tomllib; v=tomllib.load(open(\"api/rust-toolchain.toml\",\"rb\"))[\"toolchain\"][\"channel\"]; open(os.environ[\"GITHUB_OUTPUT\"],\"a\").write(\"channel=\"+v+\"\\n\")'"
    -
      uses: "dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca" # stable
      with:
        toolchain: "${{ steps.toolchain.outputs.channel }}"
    -
      name: "Install pinned nextest"
      uses: "taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f" # v2.90.6
      with:
        tool: "cargo-nextest@0.9.151"
        fallback: "none"
    # Composite steps take no timeout-minutes, so actions/download-artifact
    # could not be bounded here and once trickled for 76 minutes. The script
    # stops and repeats each attempt at a fixed bound, and extracts only bytes
    # that match the digest recorded at upload. Its listing and download need
    # `actions: read` in every job that uses this action.
    -
      name: "Download Backend test archive"
      shell: "bash"
      working-directory: "."
      env:
        GH_TOKEN: "${{ github.token }}"
        ARTIFACT_NAME: "rust-tests-${{ github.sha }}"
      run: "python3 -B .github/scripts/ci_artifact_download.py --name \"$ARTIFACT_NAME\" --path \"$RUNNER_TEMP\""
    -
      name: "Extract Backend test archive once"
      run: |
        cargo nextest list --archive-file "$RUNNER_TEMP/backend-tests.tar.zst" --extract-to "$PWD" --list-type binaries-only
        test -x target/debug/cmaeg
        test -x target/debug/cmaeg-media-probe
        test -x target/debug/layer4-runtime
      shell: "bash"
      working-directory: "api"
