name: ci-image-build
description: ci-image-build
inputs:
  component: {description: component, required: true}
  image-name: {description: image-name, required: true}
runs:
  using: composite
  steps:
  - name: Set immutable image version
    id: build-identity
    run: echo "version=git-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
    shell: bash
    working-directory: .
  - name: Build image for all target platforms
    uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
    with:
      context: .
      file: ${{ inputs.component == 'web' && 'web/Dockerfile' || inputs.component == 'api' && 'api/crates/cma/Dockerfile' || inputs.component
        == 'cmaeg' && 'api/crates/cmaeg/Dockerfile' || inputs.component == 'image-manager' && 'api/crates/cma-image-manager/Dockerfile' || 'api/crates/layer4-runtime/Dockerfile'
        }}
      platforms: ${{ inputs.component == 'web' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      push: false
      outputs: type=cacheonly
      build-args: |
        CHRONO_BUILD=${{ steps.build-identity.outputs.version }}
        CHRONO_BUILD_SHA=${{ github.sha }}
        RUNTIME_DESKTOP=${{ inputs.component == 'runtime-desktop' && '1' || '0' }}
        OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
      cache-from: type=gha,scope=${{ inputs.component }}
      cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && format('type=gha,mode=max,scope={0}', inputs.component)
        || '' }}
  - name: Load native image for scanning
    uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
    with:
      context: .
      file: ${{ inputs.component == 'web' && 'web/Dockerfile' || inputs.component == 'api' && 'api/crates/cma/Dockerfile' || inputs.component
        == 'cmaeg' && 'api/crates/cmaeg/Dockerfile' || inputs.component == 'image-manager' && 'api/crates/cma-image-manager/Dockerfile' || 'api/crates/layer4-runtime/Dockerfile'
        }}
      platforms: linux/amd64
      push: false
      load: true
      tags: ${{ inputs.image-name }}:ci
      build-args: |
        CHRONO_BUILD=${{ steps.build-identity.outputs.version }}
        CHRONO_BUILD_SHA=${{ github.sha }}
        RUNTIME_DESKTOP=${{ inputs.component == 'runtime-desktop' && '1' || '0' }}
        OS_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
      cache-from: type=gha,scope=${{ inputs.component }}
