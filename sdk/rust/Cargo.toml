[package]
name = "cma-sdk"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Async Rust client for the ChronoAI Managed Agent REST API"
repository = "https://github.com/ChronoAIProject/cma"
readme = "docs/README.md"
keywords = ["cma", "agent", "sdk", "async"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
httpdate = "1"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints.rust]
unsafe_code = "forbid"
